<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe3cc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1612" media="(prefers-color-scheme: dark)">
<title>Torre da Disciplina · Crônicas de Aethelgard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Alegreya:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#efe3cc;--paper-2:#e6d6b8;--sheet:#f7eedd;--ink:#3b2a20;--ink-soft:#6d5848;--rule:#b89d7c;
  --wine:#7b2f3b;--wine-ink:#fbeee0;--teal:#2f6b62;--gold:#b8862f;--leaf:#5f7f45;--sky:#4f7aa8;
  --hp:#b2443f;--en:#3f6fa8;--xp:#b8862f;--shadow:rgba(59,42,32,.16);
  --serif:"Alegreya",Georgia,"Times New Roman",serif;--sc:"Alegreya SC","Alegreya",Georgia,serif;--sans:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1c1612;--paper-2:#251d17;--sheet:#2a211a;--ink:#efe3cc;--ink-soft:#bba88f;--rule:#5b4836;
  --wine:#a4495a;--wine-ink:#fff3e6;--teal:#5fa597;--gold:#d8a94c;--leaf:#8db06c;--sky:#7ea6d2;
  --hp:#d4635c;--en:#6d9ad1;--xp:#d8a94c;--shadow:rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1c1612;--paper-2:#251d17;--sheet:#2a211a;--ink:#efe3cc;--ink-soft:#bba88f;--rule:#5b4836;
  --wine:#a4495a;--wine-ink:#fff3e6;--teal:#5fa597;--gold:#d8a94c;--leaf:#8db06c;--sky:#7ea6d2;
  --hp:#d4635c;--en:#6d9ad1;--xp:#d8a94c;--shadow:rgba(0,0,0,.35);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;
  background-image:radial-gradient(circle at 20% 10%,rgba(184,134,47,.07),transparent 40%),radial-gradient(circle at 80% 90%,rgba(123,47,59,.06),transparent 45%);
  -webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
img{max-width:100%}
.wrap{width:min(980px,100%);margin:0 auto;padding:0 12px}

/* Cabeçalho */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 8px}
.brand{white-space:nowrap;font-family:var(--sc);font-weight:800;font-size:21px;letter-spacing:.3px;line-height:1}
.brand small{display:block;font-family:var(--serif);font-style:italic;font-weight:500;font-size:13px;color:var(--ink-soft);letter-spacing:0;margin-top:3px}
.chips{display:flex;gap:5px;flex-wrap:nowrap;justify-content:flex-end}
@media (max-width:440px){.brand{font-size:18px}.brand small{font-size:12px}.chip{font-size:13px;padding:2px 8px 2px 4px}.chip i{width:16px;height:16px;font-size:10px}}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:3px 10px 3px 6px;font-weight:700;font-size:14px;white-space:nowrap}
.chip i{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:#fff8ec}
.chip .lv{background:var(--teal)}.chip .pc{background:var(--wine)}.chip .au{background:var(--gold)}

/* Palco */
.stage{position:relative;border-radius:14px;overflow:hidden;border:1.5px solid var(--ink);box-shadow:0 0 0 4px var(--sheet),0 0 0 5px var(--rule),0 10px 24px var(--shadow);background:#e9d9bb}
.stage canvas{display:block;width:100%;aspect-ratio:2/1;height:auto}
.hud{position:absolute;inset:8px 8px auto 8px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.who{min-width:0;width:min(42%,220px);background:rgba(247,238,221,.8);border:1px solid rgba(59,42,32,.4);border-radius:8px;padding:3px 7px 5px;color:#3b2a20}
.who.right{text-align:right}
.who b{font-family:var(--serif);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:5px;border-radius:9px;background:rgba(59,42,32,.18);overflow:hidden;margin-top:3px}
.meter i{display:block;height:100%;width:0;border-radius:9px;background:var(--hp);transition:width .18s}
.meter.en i{background:#3f6fa8}.meter.xp i{background:var(--xp)}
.who.right .meter i{margin-left:auto}
.modeline{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-family:var(--serif);font-style:italic;font-size:13px;color:#3b2a20;background:rgba(247,238,221,.82);border-radius:999px;padding:2px 12px;white-space:nowrap;pointer-events:none;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 4px}

/* Botões */
.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:9px;padding:8px 12px;font-weight:800;font-size:15px;line-height:1.1;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 2px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
.btn.wine{background:var(--wine);color:var(--wine-ink)}
.btn.teal{background:var(--teal);color:#f7f1e6}
.btn.on{background:var(--ink);color:var(--paper)}
.btn.sm{padding:5px 9px;font-size:13.5px;border-radius:7px}
.btn.ghost{box-shadow:none;border-color:var(--rule)}
.btn.block{width:100%}

/* Fichas */
main{padding:12px 0 calc(92px + env(safe-area-inset-bottom,0px))}
.cols{display:grid;gap:14px}
@media (min-width:860px){.cols{grid-template-columns:1.15fr .85fr;align-items:start}}
.sheet{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:26px 16px 16px;margin-top:14px;box-shadow:0 1px 0 var(--rule),0 6px 16px var(--shadow)}
.sheet::before{content:"";position:absolute;inset:4px;border:1px solid var(--rule);border-radius:2px;pointer-events:none;opacity:.65}
.cols>div>.sheet:first-child{margin-top:14px}
.ribbon{position:absolute;top:-13px;left:14px;background:var(--wine);color:var(--wine-ink);font-family:var(--sc);font-weight:700;font-size:15px;letter-spacing:.4px;padding:3px 18px 4px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 50%,100% 100%,0 100%,9px 50%)}
.ribbon.teal{background:var(--teal)}
.lede{font-family:var(--serif);font-size:16.5px;line-height:1.5;color:var(--ink-soft);max-width:62ch}
.muted{color:var(--ink-soft)}.small{font-size:14px}.tiny{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.gap{height:12px}
.divider{height:0;border-top:1px dashed var(--rule);margin:14px 0}

/* Rotina */
.points{display:flex;align-items:baseline;gap:12px;margin:2px 0 10px}
.points .n{font-family:var(--sc);font-weight:800;font-size:54px;line-height:.9;color:var(--wine)}
.points .l{font-family:var(--serif);font-size:17px;line-height:1.25}
.tasks{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--rule)}
.task:last-child{border-bottom:0}
.tick{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;display:grid;place-items:center;padding:0;font-weight:800;color:transparent}
.task.done .tick{background:var(--wine);border-color:var(--wine);color:var(--wine-ink)}
.task .t{flex:1;min-width:0}
.task.done .t span{text-decoration:line-through;text-decoration-color:var(--wine);color:var(--ink-soft)}
.task .x{border:0;background:none;color:var(--ink-soft);font-size:20px;line-height:1;padding:4px 6px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;min-width:0;border:1.5px solid var(--rule);border-radius:9px;background:var(--paper);padding:8px 10px}
.focus{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:110px;height:110px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--sc);font-size:24px}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:10px}
.days span{aspect-ratio:1;border-radius:50%;border:1px solid var(--rule);background:transparent}
.days span.l1{background:color-mix(in srgb,var(--wine) 35%,transparent)}
.days span.l2{background:color-mix(in srgb,var(--wine) 65%,transparent)}
.days span.l3{background:var(--wine)}
.days span.now{outline:2px solid var(--gold);outline-offset:1px}

/* Caçada */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:12px}
.mob{border:1px solid var(--rule);border-radius:10px;padding:8px;text-align:center;background:var(--paper)}
.mob img{height:64px;object-fit:contain;display:block;margin:0 auto 4px}
.mob b{font-family:var(--serif);font-size:14.5px;display:block;line-height:1.15}
.route{list-style:none;padding:0;margin:12px 0 0;counter-reset:c}
.route li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--rule)}
.route li:last-child{border:0}
.route li::before{counter-increment:c;content:counter(c);width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--sc);font-weight:800;font-size:14px}
.route li.lit::before{background:var(--gold);border-color:var(--gold);color:#2b1d12}
.route li.dim{color:var(--ink-soft)}.route li.dim::before{border-style:dashed;border-color:var(--rule)}
.tag{display:inline-block;border:1px solid var(--rule);border-radius:999px;padding:1px 8px;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.tag.gold{border-color:var(--gold);color:var(--gold)}

/* Herói */
.herohead{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.portrait{width:120px;height:140px;display:grid;place-items:end center;background:radial-gradient(ellipse at 50% 92%,var(--shadow) 0 30%,transparent 31%)}
.portrait img{height:132px;animation:breathe 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scale(1.015,.982)}}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px 12px;margin-top:12px}
.stat{display:flex;justify-content:space-between;border-bottom:1px dotted var(--rule);padding:3px 0;font-size:15px}
.stat b{font-variant-numeric:tabular-nums}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.slot{border:1.5px dashed var(--rule);border-radius:10px;aspect-ratio:1;display:grid;place-items:center;position:relative;background:var(--paper);padding:4px}
.slot.full{border-style:solid;border-color:var(--ink)}
.slot img{max-height:78%;object-fit:contain}
.slot small{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;color:var(--ink-soft)}
.slot em{position:absolute;top:2px;right:4px;font-style:normal;font-weight:800;font-size:12px;color:var(--gold)}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:10px}
.bag button{aspect-ratio:1;border:1px solid var(--rule);border-radius:10px;background:var(--paper);position:relative;padding:6px;display:grid;place-items:center}
.bag button.sel{border:2px solid var(--wine)}
.bag button.eq::after{content:"E";position:absolute;top:2px;left:4px;font-size:11px;font-weight:800;color:var(--teal)}
.bag button.no{opacity:.45}
.bag img{max-height:100%;object-fit:contain}
.bag em{position:absolute;top:2px;right:4px;font-style:normal;font-weight:800;font-size:12px;color:var(--gold)}
.detail{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;margin-top:12px;padding:10px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.detail img{width:64px;height:64px;object-fit:contain}
.detail h3{font-family:var(--serif);font-size:18px}
.shop{display:flex;flex-direction:column;margin-top:8px}
.shop .it{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--rule)}
.shop .it img{width:44px;height:44px;object-fit:contain}
.potion{width:44px;height:44px;display:grid;place-items:center}
.switch{display:flex;align-items:center;gap:8px;font-size:15px}
.switch input{width:20px;height:20px;accent-color:var(--wine)}

/* Habilidades */
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.cls{border:1.5px solid var(--rule);border-radius:12px;background:var(--paper);padding:8px;text-align:center}
.cls img{height:96px;object-fit:contain;display:block;margin:0 auto}
.cls b{font-family:var(--sc);font-size:17px;display:block}
.cls p{font-size:13px;color:var(--ink-soft);line-height:1.3;margin:2px 0 8px;min-height:3.9em}
.skill{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--rule)}
.skill:last-child{border:0}
.skill h3{font-family:var(--serif);font-size:17px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.skill h3 .tag{font-family:var(--sans)}
.pips{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.pips i{width:9px;height:9px;border-radius:50%;border:1px solid var(--wine)}
.pips i.f{background:var(--wine)}
.skill p{font-size:14.5px;color:var(--ink-soft);grid-column:1/-1}
.skill .act{grid-row:1/3;grid-column:2;align-self:center}
.sheetimg{border:1px solid var(--rule);border-radius:4px;display:block;margin-top:10px;cursor:zoom-in}

/* Álbum */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:12px}
.card{border:0;background:none;padding:0;text-align:center}
.card .art{aspect-ratio:3/4;border-radius:8px;border:3px solid var(--rule);overflow:hidden;background:var(--paper-2);position:relative}
.card.rare .art{border-color:var(--teal)}.card.leg .art{border-color:var(--gold)}
.card .art img{width:100%;height:100%;object-fit:cover;display:block}
.card.miss .art img{filter:grayscale(1) sepia(.4) blur(5px) opacity(.45)}
.card.sel .art{outline:3px solid var(--wine);outline-offset:2px}
.card b{display:block;font-family:var(--serif);font-size:14px;margin-top:4px;line-height:1.15}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px}
.cardview{display:grid;grid-template-columns:minmax(0,180px) 1fr;gap:14px;margin-top:14px;align-items:start}
.cardview .art{aspect-ratio:3/4;border-radius:10px;border:4px solid var(--gold);overflow:hidden}
.cardview .art img{width:100%;height:100%;object-fit:cover;display:block}
.verse{font-family:var(--serif);font-style:italic;color:var(--ink-soft);margin-top:8px}
@media (max-width:520px){.cardview{grid-template-columns:1fr}.cardview .art{max-width:220px}}

/* Navegação inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1.5px solid var(--ink);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{width:min(620px,100%);margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tabs button{border:0;background:none;border-radius:10px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--wine);background:color-mix(in srgb,var(--wine) 10%,transparent)}
.tabs button .dot{position:absolute}
.badge{position:relative}
.badge::after{content:attr(data-n);position:absolute;top:-4px;right:-10px;background:var(--wine);color:var(--wine-ink);font-size:10px;font-weight:800;border-radius:999px;padding:0 5px;line-height:15px}
.badge[data-n="0"]::after,.badge:not([data-n])::after{display:none}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-weight:700;font-size:15px;max-width:min(92vw,440px);text-align:center;box-shadow:0 8px 20px var(--shadow)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(28,22,18,.55);display:grid;place-items:center;padding:20px}
.modal .sheet{max-width:440px;width:100%;margin:0}
.modal .sheet img.full{width:100%;display:block}
.foot{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:22px}
@media (prefers-reduced-motion:reduce){.portrait img{animation:none}}
.mob{font:inherit;color:inherit;cursor:pointer}
.mob.sub{border-color:var(--teal);border-width:1.5px}.mob.chefe{border-color:var(--gold);border-width:2px;grid-column:span 2}
.mob.chefe img{height:96px}
img.corr{filter:saturate(.45) hue-rotate(-25deg) brightness(.82) contrast(1.05)}
img.puri{filter:saturate(1.25) brightness(1.08) sepia(.12)}
img.unseen{filter:brightness(0) opacity(.22)!important}
.noart{display:grid;place-items:center;height:64px;font-size:12px;color:var(--ink-soft);font-style:italic}
.route li.here b{color:var(--wine)}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips2 .btn{padding:4px 9px;font-size:13px}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 8px}
.twin figure{margin:0;text-align:center;border:1px solid var(--rule);border-radius:10px;padding:8px;background:var(--paper)}
.twin img{height:140px;width:100%;object-fit:contain}
.twin figcaption{font-size:12.5px;color:var(--ink-soft);font-family:var(--serif);font-style:italic}
.ph{width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 70%,color-mix(in srgb,var(--el) 55%,#f7eedd) 0 35%,color-mix(in srgb,var(--el) 25%,#f2e6cf) 65%,#e8dcc4 100%);padding:10%}
.ph img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(40,28,22,.25))}
.ph span{font-size:11px;font-style:italic;color:#6d5848;text-align:center}
.card.epic .art{border-color:var(--teal)}
.card.miss .art .ph img,.card.miss .art>img{filter:grayscale(1) sepia(.4) blur(4px) opacity(.45)}
.cardview .art.miss img{filter:grayscale(1) sepia(.4) blur(6px) opacity(.5)}
.cardview .art.epic{border-color:var(--teal)}.cardview .art{border-color:var(--rule)}.cardview .art.leg{border-color:var(--gold)}
.slots{grid-template-columns:repeat(6,1fr)!important}
@media (max-width:520px){.slots{grid-template-columns:repeat(3,1fr)!important}.mob.chefe{grid-column:span 1}}
.portrait.trans img{filter:drop-shadow(0 0 10px rgba(216,169,76,.8))}
.cls.artless img{filter:saturate(.8)}
.modal .sheet{max-height:90vh;overflow:auto}
.tabs .in{grid-template-columns:none!important;grid-auto-flow:column;grid-auto-columns:1fr;width:min(720px,100%)!important}
.tabs button{font-size:11.5px!important}
.gear{border:1px solid var(--rule);background:var(--sheet);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;padding:0;flex:none}
.gear svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round}
.chips{align-items:center}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rule);margin-right:5px;vertical-align:middle}
.sync.on{background:#5f9a4c}.sync.err{background:var(--hp)}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink-soft);margin-top:8px}
.field input,.login input,.copy{border:1.5px solid var(--rule);border-radius:9px;background:var(--paper);padding:8px 10px;color:var(--ink);width:100%}
.login{display:flex;flex-direction:column;gap:8px}
.copy{margin-top:8px;font-size:13px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px}
.it.me{background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:8px}
.it.acct{grid-template-columns:1fr auto!important}
.pos{font-family:var(--sc);font-size:20px;text-align:center;color:var(--wine)}
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;padding:10px;border-radius:10px;background:linear-gradient(#e8d6b6,#d9c39b);border:1px solid var(--rule);color:#3b2a20}
.ftr{text-align:center}.ftr b{font-family:var(--serif);font-size:14px;display:block}
.ftr img{height:110px;object-fit:contain;display:block;margin:4px auto}
.ftr.b img{transform:scaleX(-1)}.ftr.b img.corr{transform:none}
.vs{font-family:var(--sc);font-size:26px;color:var(--wine);align-self:center}
.ftr.hit.a img{animation:lungeA .35s}.ftr.hit.b img{animation:lungeB .35s}
.ftr.hurt img{animation:hurt .3s}
@keyframes lungeA{50%{transform:translateX(22px) rotate(6deg)}}
@keyframes lungeB{50%{transform:translateX(-22px) scaleX(-1)}}
@keyframes hurt{30%{filter:brightness(2.2);translate:-6px 0}70%{translate:5px 0}}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--rule);background:var(--c);padding:0}
.sw.on{outline:3px solid var(--wine);outline-offset:2px}
.portrait img{object-fit:contain}
.card .art,.cardview .art{aspect-ratio:2/3!important}
.card .art img,.cardview .art img{object-fit:cover}
.card .art .ph img{object-fit:contain}
.treewrap{overflow-x:auto;margin:10px -6px 0;padding:4px 6px 8px}
.tree{position:relative;margin:0 auto}
.tree svg{position:absolute;inset:0;overflow:visible}
.tree path{fill:none;stroke:var(--rule);stroke-width:2;stroke-dasharray:5 4}
.tree path.ok{stroke:var(--wine);stroke-dasharray:none;stroke-width:2.5}
.tree text{font:700 10.5px var(--sans);fill:var(--ink-soft);text-anchor:middle;paint-order:stroke;stroke:var(--sheet);stroke-width:4px}
.tree text.ok{fill:var(--wine)}
.tg{position:absolute;left:0;right:0;font-family:var(--sc);font-weight:700;font-size:14px;color:var(--teal);border-bottom:1px dashed var(--rule);padding-bottom:2px}
.sn{position:absolute;transform:translate(-50%,-50%);width:56px;height:56px;border:2px solid var(--rule);background:var(--paper);border-radius:50%;padding:0;display:grid;place-items:center;color:var(--ink)}
.sn.pas{border-radius:13px}
.sn .ic{font-size:22px;line-height:1}
.sn em{position:absolute;bottom:-7px;right:-9px;font-style:normal;font-size:10.5px;font-weight:800;background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:0 4px;line-height:15px}
.sn b{position:absolute;top:62px;left:50%;width:84px;margin-left:-42px;font-size:11px;line-height:1.15;font-weight:700;text-align:center;font-family:var(--sans)}
.sn.lock{opacity:.55;border-style:dashed}
.sn.av{border-color:var(--wine);box-shadow:0 0 0 3px color-mix(in srgb,var(--wine) 25%,transparent);animation:pulse 1.6s ease-in-out infinite}
.sn.got{background:var(--wine);border-color:var(--wine);color:var(--wine-ink)}
.sn.max{background:var(--gold);border-color:var(--gold);color:#2b1d12}
.sn.sel{outline:3px solid var(--teal);outline-offset:3px}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--wine) 8%,transparent)}}
.skdetail{margin-top:10px;border:1px solid var(--rule);border-radius:10px;padding:2px 10px;background:var(--paper)}
@media (prefers-reduced-motion:reduce){.sn.av{animation:none}}
.sn b{color:var(--ink)!important}.sn em{color:var(--ink)!important}
.sn.lock b{color:var(--ink-soft)!important}
</style>
</head>

  ${sp.set||sp.pages?`<p class="tiny muted" style="margin-top:8px">${sp.set?'Conjunto de 3 cartas da mesma região: +6% de ataque e vida. ':''}${sp.pages?`${sp.pages} página(s) do álbum completas: +${sp.pages*2}% de vida.`:''}</p>`:''}
 </section></div><div>
 ${viewAparencia()}
 <section class="sheet"><div class="ribbon teal">Equipamento</div>${sub}${heroSub==='equip'?equipView:shopView}</section>
 <section class="sheet"><div class="ribbon">Conta</div><p class="small muted">Nome, login, nuvem, convite e backup ficam na aba Conta.</p><div class="gap"></div><button class="btn sm" data-tab="conta">Abrir Conta</button></section>
 </div></div>`}

/* ---------- Classe ---------- */
const reqList=s=>s.req||[];
function reqOk(s){return reqList(s).every(([id,n])=>rank(id)>=n)}
function learnableCount(){return SK.filter(s=>clsOk(s.id)&&rank(s.id)<s.max&&reqOk(s)).length}
function skillRow(s){const r=rank(s.id),ok=reqOk(s),max=r>=s.max;return `<div class="skill"><div><h3>${s.name}<span class="tag">${s.type}${s.type==='ativa'?` · ${s.cd} s · ${s.en} energia`:''}</span></h3><div class="pips">${Array.from({length:s.max},(_,i)=>`<i class="${i<r?'f':''}"></i>`).join('')}</div></div>
 <button class="btn sm act ${!max&&ok&&S.pc>0?'wine':''}" data-act="learn" data-id="${s.id}" ${max||!ok||S.pc<1?'disabled':''}>${max?'Máximo':r?'Melhorar · 1':'Aprender · 1'}</button>
 <p>${r?s.d(r):'Ainda não aprendida.'}${!max?` <span style="color:var(--ink)">Próximo: ${s.d(r+1)}.</span>`:''}${!ok?` <i>Requer ${reqList(s).filter(([id,n])=>rank(id)<n).map(([id,n])=>SKM[id].name+' '+n).join(' e ')}.</i>`:''}</p></div>`}
function clsCard(k,ready,label){const C=CLASSES[k];return `<div class="cls ${C.artless?'artless':''}"><img src="${ART[C.img]}" alt=""><b>${C.name}</b><p>${C.desc}</p><button class="btn sm block ${ready?'wine':''}" data-act="promote" data-c="${k}" ${ready?'':'disabled'}>${ready?'Escolher':label}</button></div>`}
function viewHabilidades(){const c=CLASSES[S.cls];let box;
 if(c.tier===0){const ready=S.lvl>=10;box=`<p class="lede">Aos 10 níveis, o Aprendiz escolhe uma classe.</p><div class="classes">${FIRST.map(k=>clsCard(k,ready,'Nível 10')).join('')}</div>`}
 else if(c.tier===1){const opts=SECONDS.filter(x=>x[2]===S.cls).map(x=>x[0]);const ready=S.lvl>=40;box=`<div class="herohead"><div class="portrait"><img src="${ART[c.img]}" alt=""></div><div><p class="lede">${c.desc}</p></div></div><div class="divider"></div><p class="lede">No nível 40, escolha a 2ª classe. As habilidades de agora continuam com você.</p><div class="classes">${opts.map(k=>clsCard(k,ready,'Nível 40')).join('')}</div>`}
 else if(c.tier===2){const ready=S.lvl>=80&&S.bosses.includes(7);box=`<div class="herohead"><div class="portrait"><img src="${ART[c.img]}" alt=""></div><div><p class="lede">${c.desc}</p></div></div><div class="divider"></div><p class="lede">Transcendência: nível 80 e Umbra libertada.</p><div class="classes">${clsCard(c.trans,ready,ready?'':'Nível 80 + Umbra')}</div>`}
 else box=`<div class="herohead"><div class="portrait trans"><img src="${ART[c.img]}" alt=""></div><div><p class="lede">${c.desc}</p></div></div>`;
 if(c.artless)box+=`<p class="tiny muted" style="margin-top:8px">O visual próprio desta classe entra quando a arte com cabelo chegar. Até lá, o herói usa o visual da classe anterior com uma aura.</p>`;
 if(c.tier>0)box+=`<div class="gap"></div><button class="btn sm ghost" data-act="swapclass" ${S.gold<800?'disabled':''}>Recomeçar a escolha de classe · 800 ouro</button><p class="tiny muted" style="margin-top:6px">Volta a Aprendiz e devolve todos os pontos gastos fora do Aprendiz.</p>`;
 const sheet=c.sheet?`<img class="sheetimg" src="${ART[c.sheet]}" alt="Ficha" data-act="zoom" data-k="${c.sheet}" loading="lazy">`:'';
 const groups=skillTree();
 return `<div class="cols"><div>
 <section class="sheet"><div class="ribbon">Classe</div>${box}${sheet}</section></div><div>
 <section class="sheet"><div class="ribbon teal">Habilidades</div><div class="points"><span class="n">${S.pc}</span><span class="l">pontos de habilidade<br><span class="muted small">nível de classe ${S.jobLvl} · ${S.jobXp}/${jobNeed(S.jobLvl)} XP</span></span></div>
  ${groups}
  <div class="divider"></div><button class="btn sm ghost" data-act="respec" ${S.gold<300?'disabled':''}>Redistribuir pontos · 300 ouro</button>
 </section></div></div>`}

/* ---------- Álbum ---------- */
let selCard='slime_sonolento',albumReg=0;
function cardArt(id,cls=''){const M=MONS[id];if(ART['cd_'+id])return `<img src="${ART['cd_'+id]}" alt="" class="${cls}" loading="lazy">`;
  const key=M.fk||M.ck;const bg=ELCOL[M.el]||'#b8a48a';return `<div class="ph ${cls}" style="--el:${bg}">${key?`<img src="${ART[key]}" alt="" class="${M.fk?'':'puri'}">`:'<span>Arte em produção</span>'}</div>`}
function viewAlbum(){const ids=regMons(albumReg);const got=ids.filter(k=>S.cards[k]).length;const all=MONIDS.filter(k=>S.cards[k]).length;
 if(MONS[selCard].reg!==albumReg)selCard=ids[0];
 const M=MONS[selCard],C=CARDS[selCard],have=S.cards[selCard]||0,seen=have||S.seen[selCard]||S.kills[selCard],st=stars(selCard),m=1+.25*(Math.max(1,st)-1);
 const socketed=S.sockets[C.slot]===selCard;const rcls=r=>r==='lendária'?'leg':r==='épica'?'epic':'';
 return `<section class="sheet"><div class="ribbon">Álbum de memórias</div>
  <div class="row between"><span class="lede" style="color:var(--ink)">${all} de ${MONIDS.length} cartas</span><span class="small muted">Página completa: +2% de vida</span></div>
  <div class="chips2">${REGIONS.map((R,i)=>{const n=regMons(i).filter(k=>S.cards[k]).length;return `<button class="btn sm ${i===albumReg?'on':''}" data-act="albumreg" data-n="${i}" ${i>S.unlocked?'disabled':''}>${R.name} <span class="tiny">${n}/13</span></button>`}).join('')}</div>
  <div class="meter xp" style="height:8px;margin-top:10px"><i style="width:${got/13*100}%"></i></div>
  <div class="album">${ids.map(k=>{const X=MONS[k],h=S.cards[k];return `<button class="card ${h?'':'miss'} ${rcls(CARDS[k].rar)} ${selCard===k?'sel':''}" data-act="card" data-k="${k}"><div class="art">${cardArt(k)}</div><b>${h||S.seen[k]?X.name:'???'}</b><span class="stars">${h?'★'.repeat(stars(k))+'☆'.repeat(5-stars(k)):''}</span></button>`}).join('')}</div>
  <div class="cardview"><div class="art ${rcls(C.rar)} ${have?'':'miss'}">${cardArt(selCard)}</div><div>
   <h2 style="font-family:var(--serif);font-size:22px">${seen?M.name:'Carta desconhecida'}</h2>
   <div class="row" style="margin:6px 0"><span class="tag">${M.el}</span><span class="tag">${M.kind}</span><span class="tag">${M.size}</span><span class="tag ${C.rar==='lendária'?'gold':''}">${C.rar}</span><span class="tag">encaixe: ${SLOTN[C.slot]}</span></div>
   <p>${C.text(m)}</p>${have&&st<5?`<p class="small muted">Próxima estrela: ${C.text(1+.25*st)}. Cada cópia extra soma uma estrela.</p>`:''}
   <p class="small muted">${have?`Você tem ${have} cópia${have>1?'s':''}.`:`Cai de ${M.name} em ${REGIONS[M.reg].name}. Marcador: ${S.pity[selCard]||0}/${PITY[M.tier]}; ao completar, a carta vem garantida.`}</p>
   ${S.kills[selCard]?`<p class="verse">“${esc(M.before)}”</p>`:''}
   <div class="gap"></div>${have?`<button class="btn ${socketed?'':'wine'}" data-act="socket" data-k="${selCard}">${socketed?'Remover do encaixe':'Encaixar em '+SLOTN[C.slot].toLowerCase()}</button>`:''}
   <p class="tiny muted" style="margin-top:8px">Encaixes: ${Object.entries(S.sockets).map(([sl,id])=>SLOTN[sl]+': '+(id?MONS[id].name:'vazio')).join(' · ')}. Três cartas da mesma região ativam +6% de ataque e vida.</p>
  </div></div></section>`}

/* ---------- Render e eventos ---------- */
let tab='rotina';
const VIEWS={rotina:viewRotina,cacada:viewCacada,heroi:viewHeroi,habilidades:viewHabilidades,album:viewAlbum,pvp:viewPvp,mestre:viewMaster,conta:viewConta};
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));$('#view').innerHTML=VIEWS[tab]();updateModes();hud()}
let refreshQ=0;function refreshIfVisible(){if(!$('#modal').hidden)return;if(tab==='cacada'||tab==='album'||(tab==='heroi'&&heroSub==='equip')){clearTimeout(refreshQ);refreshQ=setTimeout(()=>{const y=scrollY;render();scrollTo(0,y)},250)}}
function modal(html){const m=$('#modal');m.innerHTML=html;m.hidden=false}
let pending=null;function ask(msg,ok,fn){pending=fn;modal(`<section class="sheet"><p class="lede" style="color:var(--ink)">${msg}</p><div class="gap"></div><div class="row"><button class="btn wine" data-act="askok">${ok}</button><button class="btn ghost" data-act="close">Cancelar</button></div></section>`)}
document.addEventListener('click',e=>{const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;render();scrollTo({top:0});if(location.hash!=='#'+tab)history.replaceState(null,'','#'+tab);return}
 if(e.target.id==='modal'||e.target.closest('[data-act="close"]')){$('#modal').hidden=true;return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;const y=scrollY;
 if(a==='askok'){$('#modal').hidden=true;const f=pending;pending=null;f&&f();return}
 if(a==='mode'){startMode(b.dataset.m);if(tab==='cacada')render();if(b.closest('#view'))scrollTo({top:0,behavior:'smooth'});return}
 if(a==='travel'){travel(Number(b.dataset.n));render();scrollTo({top:0,behavior:'smooth'});return}
 if(a==='mondetail'){monDetail(b.dataset.id);return}
 if(a==='task')return toggleTask(b.dataset.id);
 if(a==='deltask'){const t=S.tasks.find(x=>x.id===b.dataset.id);if(t)ask('Remover “'+esc(t.name)+'” da rotina?','Remover',()=>{S.tasks=S.tasks.filter(x=>x!==t);save();render()});return}
 if(a==='focusstart'){S.focus={start:Date.now(),credited:0};save();render();return}
 if(a==='focusstop'){const mins=Math.floor(Math.min(240,(Date.now()-S.focus.start)/60000));focusTick();S.focusMin+=mins;S.focus={start:0,credited:0};save();render();toast(`Sessão encerrada: ${mins} minuto${mins===1?'':'s'}`);return}
 if(a==='heroSub'){heroSub=b.dataset.k;render();scrollTo(0,y);return}
 if(a==='pick'){selItem=Number(b.dataset.u);heroSub='equip';render();scrollTo(0,y);return}
 if(a==='equip'){equip(Number(b.dataset.u));scrollTo(0,y);return}
 if(a==='refine'){const it=itemOf(Number(b.dataset.u)),c=refineCost(it.r);if(S.gold<c||it.r>=10)return;S.gold-=c;it.r++;toast(ITEMS[it.i].name+' agora é +'+it.r);save();render();scrollTo(0,y);return}
 if(a==='sell'){const u=Number(b.dataset.u),it=itemOf(u),d=ITEMS[it.i];S.gold+=sellPrice(d,it.r);S.inv=S.inv.filter(x=>x.u!==u);selItem=null;save();render();scrollTo(0,y);return}
 if(a==='buy'){const d=ITEMS[Number(b.dataset.i)];if(S.gold<d.price)return;S.gold-=d.price;S.inv.push({u:S.uid++,i:d.i,r:0});toast('Comprado: '+d.name);save();render();scrollTo(0,y);return}
 if(a==='pot'){const n=Number(b.dataset.n),c=n===10?110:12;if(S.gold<c)return;S.gold-=c;S.potions+=n;save();render();scrollTo(0,y);return}
 if(a==='learn'){const s=SKM[b.dataset.id];if(S.pc<1||rank(s.id)>=s.max||!reqOk(s))return;S.pc--;S.skills[s.id]=rank(s.id)+1;toast(s.name+' nível '+S.skills[s.id]);save();render();scrollTo(0,y);return}
 if(a==='promote'){const k=b.dataset.c,C=CLASSES[k];ask('Tornar-se '+C.name+'?','Escolher',()=>{S.cls=k;const s=stats();S.hp=s.hp;S.en=s.en;
   const starter=ITEMS.find(x=>x.cls===k&&x.slot==='arma');if(starter){S.inv.push({u:S.uid,i:starter.i,r:0});S.eq.arma=S.uid++}
   toast('Agora você é '+C.name+'!'+(starter?' Ganhou '+starter.name+'.':''));save();render()});return}
 if(a==='swapclass'){if(S.gold<800)return;ask('Voltar a Aprendiz e escolher a classe de novo por 800 ouro? Os pontos gastos fora do Aprendiz voltam para você.','Recomeçar',()=>{S.gold-=800;for(const s of SK)if(s.cls!=='aprendiz'&&S.skills[s.id]){S.pc+=S.skills[s.id];delete S.skills[s.id]}S.cls='aprendiz';for(const k of EQ){const it=itemOf(S.eq[k]);if(it&&!canUse(ITEMS[it.i]))S.eq[k]=null}save();render()});return}
 if(a==='respec'){if(S.gold<300)return;ask('Devolver todos os pontos de habilidade por 300 ouro?','Redistribuir',()=>{S.gold-=300;const back=Object.values(S.skills).reduce((x,v)=>x+v,0);S.pc+=back;S.skills={};save();render()});return}
 if(a==='albumreg'){albumReg=Number(b.dataset.n);selCard=regMons(albumReg)[0];render();scrollTo(0,y);return}
 if(a==='card'){selCard=b.dataset.k;render();scrollTo(0,y);return}
 if(a==='socket'){const k=b.dataset.k,sl=CARDS[k].slot;S.sockets[sl]=S.sockets[sl]===k?null:k;save();render();scrollTo(0,y);return}
 if(a==='zoom'){modal(`<section class="sheet"><img class="full" src="${ART[b.dataset.k]}" alt=""><div class="gap"></div><button class="btn block" data-act="close">Fechar</button></section>`);return}
 if(a==='reset'){ask('Apagar todo o progresso? Isso não pode ser desfeito.','Apagar tudo',()=>{S=fresh();initVitals();foe=null;hero.dead=0;save();render();modeText()});return}
});
document.addEventListener('change',e=>{if(e.target.dataset.act==='autopot'){S.autoPot=e.target.checked;save()}});
document.addEventListener('submit',e=>{if(e.target.id==='addTask'){e.preventDefault();const v=$('#taskName').value.trim();if(!v)return;S.tasks.push({id:'t'+(S.tid++),name:v});save();render();$('#taskName')?.focus()}});

/* ---------- Farm offline ---------- */
function offline(){const away=(Date.now()-S.last)/60000;if(away<2||S.mode==='city')return;const s=stats(),c=s.card;const mins=Math.min(away,c.cap*60);
  const R=REGIONS[S.region];const L=S.mode==='tower'?10+S.tower.floor:clamp(S.lvl,R.min,R.max);const kills=Math.floor(mins*5*.5);if(kills<1)return;
  const pen=L<S.lvl-6?.5:1,mult=1+c.offline/100;const xp=Math.round(kills*(8+L*5)*pen*mult),gold=Math.round(kills*(2+L*2)*(1+s.gold/100)*mult);
  const lv0=S.lvl;S.gold+=gold;gainXP(xp);if(S.mode==='hunt')S.rk[S.region]=RK(S.region)+kills;S.hp=stats().hp;save();
  const h=Math.floor(mins/60),m=Math.round(mins%60);
  modal(`<section class="sheet"><div class="ribbon">Enquanto você esteve fora</div><p class="lede">O herói caçou por ${h?h+' h ':''}${m} min${away>c.cap*60?` (limite de ${c.cap} h)`:''}.</p><div class="statgrid"><div class="stat"><span>Libertados</span><b>${fmt(kills)}</b></div><div class="stat"><span>XP</span><b>${fmt(xp)}</b></div><div class="stat"><span>Ouro</span><b>${fmt(gold)}</b></div><div class="stat"><span>Nível</span><b>${lv0}${S.lvl>lv0?' → '+S.lvl:''}</b></div></div><div class="gap"></div><button class="btn wine block" data-act="close">Continuar</button></section>`)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{offline();rollDay();render()}});
window.addEventListener('pagehide',save);

/* ---------- Início ---------- */
const h0=location.hash.slice(1);if(VIEWS[h0])tab=h0;
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==tab){tab=h;render()}});
albumReg=S.region;selCard=regMons(albumReg)[0];
offline();if(S.mode==='boss')S.mode='hunt';unlockCheck(false);nextSpawn=T+.8;modeText();render();updateModes();
setInterval(save,15000);connectFirebase();
requestAnimationFrame(frame);

/* ---------- Árvore de habilidades ---------- */
let selSkill=null;
function skGlyph(s){const f=s.fx||'',k=s.kind||'',p=s.p?Object.keys(s.p(1)):[];
  if(f.includes('fire')||f==='apoc')return'🔥';if(f.includes('ice')||f==='blizzard')return'❄';if(f==='bolt')return'⚡';if(f.includes('arrow')||f==='rain')return'➶';if(f==='holy')return'✧';if(f.includes('combo')||f==='chi')return'✊';
  if(f==='thorn'||f==='root'||f==='leaves')return'❦';if(f==='bash')return'⛨';if(f.includes('slash')||f==='dash'||f==='spin')return'⚔';
  if(k==='heal'||k==='oath')return'✚';if(k==='shield'||k==='reflect')return'⛨';if(k==='buff'||k==='weaken')return'✪';if(k==='evade')return'≋';
  if(p.includes('crit')||p.includes('critDmg'))return'◎';if(p.includes('hp')||p.includes('reg'))return'♥';if(p.includes('def'))return'⛨';if(p.includes('atk')||p.includes('skill'))return'⚔';if(p.includes('luck'))return'☘';if(p.includes('enr'))return'✦';if(p.includes('ls'))return'❥';if(p.includes('falcon'))return'➶';return'✦'}
function skillTree(){const groups=lineage(),CW=88,RH=104,GH=34,NW=56;const pos={};let y=0,maxW=0,html='',edges='';
  for(const g of groups){const list=SK.filter(s=>s.cls===g);const depth={};const dep=s=>{if(depth[s.id]!=null)return depth[s.id];let d=0;for(const[r]of reqList(s)){const R=SKM[r];if(R&&R.cls===g)d=Math.max(d,dep(R)+1)}return depth[s.id]=d};list.forEach(dep);
    const cols={};for(const s of list)(cols[depth[s.id]]=cols[depth[s.id]]||[]).push(s);const nCols=Object.keys(cols).length,nRows=Math.max(...Object.values(cols).map(c=>c.length));
    html+=`<div class="tg" style="top:${y}px">${CLASSES[g].name}</div>`;
    for(const[d,c]of Object.entries(cols)){const off=(nRows-c.length)*RH/2;c.forEach((s,i)=>{pos[s.id]={x:Number(d)*CW+CW/2,y:y+GH+off+i*RH+NW/2}})}
    maxW=Math.max(maxW,nCols*CW);y+=GH+nRows*RH}
  for(const s of SK){if(!pos[s.id])continue;const b=pos[s.id];for(const[r,n]of reqList(s)){const a=pos[r];if(!a)continue;const ok=rank(r)>=n;
    const sameRow=Math.abs(a.y-b.y)<4,x1=a.x,y1=a.y,x2=b.x,y2=b.y;let path,mx,my;
    if(a.x<b.x&&Math.abs(a.y-b.y)<RH*1.5){const cx=(x1+x2)/2;path=`M${x1+NW/2} ${y1}C${cx} ${y1} ${cx} ${y2} ${x2-NW/2} ${y2}`;mx=cx;my=(y1+y2)/2}
    else{const cy=(y1+y2)/2;path=`M${x1} ${y1+NW/2}C${x1} ${cy} ${x2} ${cy} ${x2} ${y2-NW/2-14}`;mx=(x1+x2)/2;my=cy}
    edges+=`<path d="${path}" class="${ok?'ok':''}" marker-end="url(#ar${ok?'1':'0'})"/><text x="${mx}" y="${my+4}" class="${ok?'ok':''}">nv ${n}</text>`}}
  const nodes=SK.filter(s=>pos[s.id]).map(s=>{const r=rank(s.id),ok=reqOk(s),st=r>=s.max?'max':r>0?'got':ok?'av':'lock',P=pos[s.id];
    return `<button class="sn ${st} ${s.type==='ativa'?'act':'pas'} ${selSkill===s.id?'sel':''}" style="left:${P.x}px;top:${P.y}px" data-act="selskill" data-id="${s.id}" aria-label="${esc(s.name)}"><span class="ic">${skGlyph(s)}</span><em>${r}/${s.max}</em><b>${esc(s.name)}</b></button>`}).join('');
  const sel=selSkill&&pos[selSkill]?SKM[selSkill]:null;
  return `<p class="tiny muted">Toque numa habilidade para ver e aprender. Linhas cheias: requisito cumprido; tracejadas: ainda falta. Círculo = ativa, quadrado = passiva.</p>
  <div class="treewrap"><div class="tree" style="width:${maxW}px;height:${y}px"><svg width="${maxW}" height="${y}"><defs><marker id="ar1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="var(--wine)"/></marker><marker id="ar0" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="var(--rule)"/></marker></defs>${edges}</svg>${html}${nodes}</div></div>
  ${sel?`<div class="skdetail">${skillRow(sel)}</div>`:'<p class="small muted" style="margin-top:8px">Nenhuma habilidade selecionada.</p>'}`}
