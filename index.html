<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#201c2f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Torre da Disciplina</title>
<meta name="apple-mobile-web-app-title" content="Torre">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
/* Layout: app de celular — barra de status do herói no topo, conteúdo rolável, abas fixas embaixo. Tema único noturno de masmorra. */
:root{
  --bg:#14121d; --panel:#201c2f; --panel2:#2a2540; --line:#3a3354;
  --ink:#f1ead9; --mute:#a7a0bb;
  --gold:#f2c14e; --xp:#6ec6ff; --hp:#e8585a; --ok:#5fcf8a;
  --str:#ff8a5c; --int:#6ec6ff; --dis:#f2c14e; --cre:#c58cff;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:20px}
h3{font-size:17px}
p{margin:0}
.mute{color:var(--mute)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* ===== HEADER (Runner Game) ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.lv{font-family:var(--display);font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;white-space:nowrap}
.lv b{color:var(--xp);font-size:17px}
.top-mid{min-width:0;display:flex;flex-direction:column;gap:3px}
.top-name{font-family:var(--display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.sync{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none}
.sync.on{background:var(--ok)}.sync.err{background:var(--hp)}
.coins{display:flex;gap:10px;align-items:center;font-family:var(--display);font-size:15px}
.coin{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #b8862a}
.fire{width:9px;height:12px;background:var(--str);clip-path:polygon(50% 0,100% 60%,80% 100%,20% 100%,0 60%)}
.bar{height:8px;background:#0f0d16;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--xp);transition:width .4s}
.bar.hp i{background:var(--hp)}
.bar.gold i{background:var(--gold)}

/* Runner Stage */
.strip{position:relative;max-width:560px;margin:10px auto 0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0f0d16;height:220px}
.strip canvas{display:block;width:100%;height:180px;image-rendering:pixelated}
.hud{position:absolute;inset:8px 8px auto 8px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none;text-shadow:0 1px 0 #000;font-size:12px}
.hud .who{display:flex;gap:8px;align-items:center;background:rgba(15,13,22,.72);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 8px;min-width:0}
.hud .lv{font-family:var(--display);font-size:12px;background:var(--panel2);border-radius:5px;padding:2px 6px;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:3px;width:clamp(110px,26vw,190px)}
.bars .nm{font-weight:700;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:9px;background:#0f0d16;border:1px solid #000;border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;transition:width .12s}
.bar.hp i{background:linear-gradient(#ff8a8a,var(--hp))}
.bar.sp i{background:linear-gradient(#bfe6ff,var(--sp))}
.bar.xp{height:4px}
.bar.xp i{background:var(--xp)}
.bar span{position:absolute;inset:0;font-size:8px;line-height:9px;text-align:center;font-weight:700;letter-spacing:.02em}
.hud .where{display:flex;flex-direction:column;align-items:flex-end;gap:4px;background:rgba(15,13,22,.72);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 8px;text-align:right}
.where b{font-family:var(--display);font-size:14px}
.where small{font-size:11px;color:#d9cfe8}
.gold{display:flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums}
.gold i{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #b8862a}
.toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);background:var(--gold);color:#241a05;font-family:var(--display);font-size:16px;padding:6px 14px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.5);pointer-events:none;white-space:nowrap;z-index:10}

/* Skillbar abaixo do canvas */
.skillbar{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:6px;padding:6px;background:var(--panel)}
.sk{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 4px;border-radius:8px;border:1px solid var(--line);background:var(--panel);overflow:hidden;min-width:0}
.sk .ic{width:24px;height:24px;image-rendering:pixelated}
.sk b{font-size:11px;font-weight:700;text-align:center;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.sk small{font-size:10px;color:var(--mute);font-variant-numeric:tabular-nums}
.sk .key{position:absolute;left:4px;top:2px;font-family:var(--display);font-size:10px;color:var(--mute)}
.sk .cd{position:absolute;inset:0;background:conic-gradient(rgba(10,8,16,.78) var(--p,0%),transparent 0);pointer-events:none}
.sk .cdt{position:absolute;inset:0 0 auto 0;height:34px;display:grid;place-items:center;font-family:var(--display);font-size:16px;text-shadow:0 2px 0 #000;pointer-events:none}
.sk.nosp{border-color:#4a3a6a}.sk.nosp b{color:var(--mute)}
.sk.flash{animation:fl .35s}
@keyframes fl{0%{box-shadow:inset 0 0 0 2px var(--gold)}100%{box-shadow:none}}
.auto{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:11px;font-weight:700;text-align:center}
.auto[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}

main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);font-weight:600}
.note{background:#0f0d16;border:1px dashed var(--line);border-radius:8px;padding:10px;font-size:13px;color:var(--mute)}
.note b{color:var(--ink)}

.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px 14px;font-weight:600}
.btn:hover{border-color:var(--mute)}
.btn.main{background:var(--gold);color:#241a05;border-color:#b8862a;box-shadow:0 3px 0 #9b6f1c;font-family:var(--display);font-size:16px}
.btn.main:active{transform:translateY(2px);box-shadow:0 1px 0 #9b6f1c}
.btn.red{background:var(--hp);color:#fff;border-color:#a83a3c;box-shadow:0 3px 0 #85292b;font-family:var(--display);font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:6px 10px;font-size:13px}
.x{background:none;border:0;color:var(--mute);font-size:18px;padding:4px 6px;line-height:1}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c,var(--mute))}
.c-str{--c:var(--str)}.c-int{--c:var(--int)}.c-dis{--c:var(--dis)}.c-cre{--c:var(--cre)}
.chip.bad{border-color:var(--hp);color:#ffb3b4}
.chip.good{border-color:var(--ok)}

.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.task.done{opacity:.6}
.task.done .tt{text-decoration:line-through}
.check{width:40px;height:40px;border-radius:8px;border:2px solid var(--c,var(--line));background:#0f0d16;display:grid;place-items:center}
.check svg{width:22px;height:22px;stroke:var(--c);stroke-width:3;fill:none;opacity:0}
.task.done .check{background:var(--c)}
.task.done .check svg{opacity:1;stroke:#14121d}
.tbody{min-width:0;display:flex;flex-direction:column;gap:4px}
.tt{font-weight:500;overflow-wrap:anywhere}
.tmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mute)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum{background:var(--panel2);border-radius:8px;padding:8px 10px}
.sum b{display:block;font-family:var(--display);font-size:20px}
.focus-time{font-family:var(--display);font-size:44px;text-align:center;line-height:1;padding:6px 0}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 4px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.cat i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.cat[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--panel2))}
details summary{cursor:pointer;font-weight:600;color:var(--gold);list-style:none}
details summary::-webkit-details-marker{display:none}
form.add{display:grid;gap:8px;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 120px;min-width:0}
input,select{background:#0f0d16;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.goal{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.goal.won{border-color:var(--gold)}
.goal-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.goal-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.goal-act input{width:70px;padding:6px 8px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{background:none;border:0;border-radius:7px;padding:8px 4px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--gold)}
.hero{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.stage{background:radial-gradient(circle at 50% 80%,#3a3354 0,#1a1726 70%);border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;aspect-ratio:1;max-width:100%}
canvas{image-rendering:pixelated;display:block;max-width:100%}
.clsname{font-family:var(--display);color:var(--gold);font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel2);border-radius:8px;padding:10px;border-left:3px solid var(--c)}
.stat b{font-family:var(--display);font-size:22px;display:block}
.stat small{color:var(--mute);font-size:12px}
.combat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.combat div{background:#0f0d16;border-radius:8px;padding:8px 2px}
.combat b{font-family:var(--display);font-size:18px;display:block}
.combat small{font-size:11px;color:var(--mute)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.item>div{min-width:0;display:flex;flex-direction:column;gap:3px}
.item.on{border-color:var(--gold)}
.item.locked{opacity:.75}
.item-n{font-weight:600}
.item-s{font-size:12px;color:var(--mute)}
.slot-tag{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--gold)}
.reqs{display:flex;gap:4px;flex-wrap:wrap}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button{flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--mute)}
.filters button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

.pts{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pts b{font-family:var(--display);font-size:28px;color:var(--gold)}
.cls{border-top:3px solid var(--c)}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#0f0d16;border:1px solid var(--line);color:var(--mute)}
.pill.on{border-color:var(--ok);color:var(--ok)}
.tree{list-style:none;margin:0;padding:0 0 0 14px;display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--line)}
.node{position:relative;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.node::before{content:"";position:absolute;left:-21px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:3px;background:var(--bg);border:2px solid var(--line)}
.node.own{border-color:var(--c)}
.node.own::before{background:var(--c);border-color:var(--c)}
.node.off{opacity:.55}
.node>div{min-width:0;display:flex;flex-direction:column;gap:2px}
.node b{font-weight:600}
.node small{color:var(--mute);font-size:12px}

.tower{display:flex;flex-direction:column;gap:4px}
.floor{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;background:#0f0d16;border:1px solid var(--line);font-family:var(--display);font-size:14px}
.floor.cur{background:color-mix(in srgb,var(--hp) 20%,var(--panel2));border-color:var(--hp)}
.floor.clr{color:var(--mute)}
.floor.boss span:first-child::after{content:" · chefe";color:var(--hp)}
.floor .who{font-family:var(--body);font-size:11px;color:var(--gold);text-align:right}
.mob{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}

.rank{display:flex;flex-direction:column;gap:6px}
.rk{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:8px;padding:8px 10px}
.rk.me{border:1px solid var(--gold)}
.rk .pos{font-family:var(--display);font-size:18px;color:var(--mute)}
.rk:first-child .pos{color:var(--gold)}
.rk .tbody span{font-size:12px}
.fl{font-family:var(--display);white-space:nowrap}
.duel{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:8px;padding:8px 10px}
.duel canvas{width:44px;height:auto}
.steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);padding:4px 0;border-radius:8px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--gold);background:var(--panel2)}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,6,14,.82);display:grid;place-items:center;padding:16px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.fighter{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.fighter .nm{font-family:var(--display);font-size:13px;overflow-wrap:anywhere}
.fighter .bar{width:100%}
.fighter small{font-size:12px}
.vs{font-family:var(--display);color:var(--hp);font-size:20px}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.blog{background:#0f0d16;border-radius:8px;padding:10px;height:140px;overflow:auto;font-size:13px;display:flex;flex-direction:column-reverse;gap:2px}
.result{font-family:var(--display);font-size:22px;text-align:center}
.result.win{color:var(--ok)}.result.lose{color:var(--hp)}
.rewards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.toast-ui{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--panel2);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast-ui.lvl{background:var(--gold);color:#241a05;font-family:var(--display);font-size:17px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);background:var(--sw);padding:0}
.sw button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--bg) inset}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.styles button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--mute)}
.styles button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.mis{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.mis.on{border-color:var(--c)}
.mis>div{min-width:0;display:flex;flex-direction:column;gap:4px}
.wk{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.wk.ready{border-color:var(--gold)}
.wk.claimed{opacity:.6}
.cp{display:flex;gap:8px;flex-wrap:wrap}
.cp .chip{font-size:12px}
.btns{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.four button{font-size:13px;padding:8px 2px}
.ctiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ctile{border:1px solid var(--line);border-top:3px solid var(--c);background:var(--panel2);border-radius:8px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.ctile b{font-family:var(--display);font-size:14px}
.ctile small{font-size:11px;color:var(--mute)}
.ctile.on small.st{color:var(--ok)}
.ctile[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 22%,var(--panel2));border-color:var(--c)}
.tiers{display:flex;flex-direction:column;gap:0}
.tier{display:flex;flex-direction:column;gap:6px}
.tier-h{display:flex;justify-content:space-between;align-items:center}

.pathbtn{display:flex;flex-direction:column;gap:4px;text-align:left;border:2px solid var(--pc);background:color-mix(in srgb,var(--pc) 14%,var(--panel2));border-radius:10px;padding:12px}
.pathbtn b{font-family:var(--display);font-size:17px;color:var(--pc)}
.pathbtn span{font-size:13px;color:var(--mute)}
.ranks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

.rank-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rank-h b{font-family:var(--display);font-size:15px}
.req{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12px;align-items:center}
.req .bar{grid-column:1/-1;height:6px}
.req .bar i{background:var(--c)}
.cnt{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:var(--panel2);border-radius:8px;padding:10px}

.secmap{display:flex;flex-direction:column;gap:4px}

.sec.cur{border-color:var(--gold)}

.sec i{width:12px;height:12px;border-radius:3px;background:var(--sc)}
.homebar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--gold) 12%,var(--panel));border:1px dashed var(--gold);border-radius:10px;padding:10px 12px;font-size:13px}
.luck{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;background:color-mix(in srgb,var(--cre) 12%,var(--panel));border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.luck b{font-size:16px;color:var(--cre)}
.luck small{color:var(--mute);font-size:12px;flex-basis:100%}
.addrow{display:flex;gap:8px;align-items:center}

.cnt2{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border-radius:8px;padding:10px}

.branches.two{grid-template-columns:1fr 1fr}
.branch{display:flex;flex-direction:column;min-width:0}

.br-h b{font-family:var(--display);font-size:15px}
.br-h small{font-size:11px;color:var(--mute)}
.tier-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:0 0 4px 2px}
.gap4{height:6px}
.sn-h{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.lvl{font-size:12px;color:var(--gold);font-weight:700}
.why{color:#ffb3b4}
.clsgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clsopt{border:1px solid var(--line);border-top:3px solid var(--c);background:var(--panel2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.clsopt b{font-family:var(--display);font-size:15px}
.clsopt small{font-size:11px}
.fl-txt.sk{font-family:var(--display);font-size:14px;animation-duration:1.1s}
.fl-txt.crit{font-size:15px;color:#ffe066}
.fl-txt.hurt{color:#ff8a8a}
.fl-txt.heal{color:#5fcf8a}
.fl-txt.burn{color:#ff8a3a}
.fl-txt.dodge{color:#c58cff}
.fl-txt.gold{color:#f2c14e}
.arena{position:relative}
.bfx{position:absolute;inset:0;pointer-events:none}
.lungeR{animation:lungeR .3s ease-out}
.lungeL{animation:lungeL .3s ease-out}
@keyframes lungeR{40%{transform:translateX(18px)}}
@keyframes lungeL{40%{transform:translateX(-18px)}}
.hitf canvas{animation:hitf .28s}
@keyframes hitf{0%,40%{filter:brightness(3) saturate(0)}100%{filter:none}}
.hitf{animation:shake .25s}
.bigshake{animation:bigshake .35s}
@keyframes bigshake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
.bnum{position:absolute;transform:translateX(-50%);font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;white-space:nowrap;animation:bpop .9s forwards}
.bnum.crit{color:#ffe066;font-size:24px}
.bnum.heal{color:#5fcf8a}
.bnum.burn{color:#ff8a3a}
.bnum.dodge{color:#c58cff;font-size:15px}
.bnum.stun{color:#ffe066;font-size:14px}
@keyframes bpop{0%{transform:translate(-50%,6px) scale(.5);opacity:0}20%{transform:translate(-50%,-4px) scale(1.25);opacity:1}100%{transform:translate(-50%,-38px) scale(1);opacity:0}}
.sbanner{position:absolute;left:50%;top:-10px;transform:translateX(-50%);padding:4px 14px;border-radius:999px;font-family:var(--display);font-size:16px;background:var(--bc);color:#14121d;white-space:nowrap;box-shadow:0 0 18px var(--bc);animation:bnr 1s forwards;z-index:2}
@keyframes bnr{0%{transform:translate(-50%,10px) scale(.5);opacity:0}15%{transform:translate(-50%,0) scale(1.12);opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
.proj{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:radial-gradient(circle,#fff6c8,var(--pc) 55%,transparent 72%);box-shadow:0 0 14px var(--pc);animation:proj .32s linear forwards}
@keyframes proj{from{left:var(--x0)}to{left:var(--x1)}}
.boom{position:absolute;width:10px;height:10px;border-radius:50%;border:3px solid var(--pc);transform:translate(-50%,-50%);animation:boom .45s ease-out forwards}
@keyframes boom{to{width:80px;height:80px;opacity:0}}
.meteor{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff,#ff8a3a 50%,#c8461f);box-shadow:0 0 16px #ff6a2a;animation:meteor .4s ease-in forwards}
@keyframes meteor{from{transform:translate(50px,-90px)}to{transform:translate(0,0)}}
.slash{position:absolute;width:44px;height:4px;margin-left:-22px;background:linear-gradient(90deg,transparent,var(--pc),transparent);border-radius:4px;transform:rotate(-35deg);box-shadow:0 0 8px var(--pc);animation:slash .3s ease-out forwards}
@keyframes slash{0%{opacity:0;transform:rotate(-35deg) scaleX(.2)}30%{opacity:1;transform:rotate(-35deg) scaleX(1.1)}100%{opacity:0;transform:rotate(-35deg) scaleX(1)}}
.ring{position:absolute;width:60px;height:60px;border-radius:50%;border:3px solid var(--pc);transform:translate(-50%,-50%);animation:ring .6s forwards}
@keyframes ring{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}

.needs{display:flex;gap:6px;flex-wrap:wrap}

<body>
<header class="top">
  <div class="top-in">
    <div class="lv">Nv <b id="hLv" class="num">1</b></div>
    <div class="top-mid">
      <div class="top-name"><span class="sync" id="hSync" title="Salvo só neste aparelho"></span><span id="hName">Herói</span></div>
      <div class="bar"><i id="hXp" style="width:0%"></i></div>
    </div>
    <div class="coins">
      <span class="coin" title="Sequência de dias"><span class="fire"></span><span id="hStreak" class="num">0</span></span>
      <span class="coin" title="Ouro"><span class="dot"></span><span id="hGold" class="num">0</span></span>
    </div>
  </div>
  
  <!-- ===== RUNNER INTEGRADO ===== -->
  <div class="strip" id="stripBox">
    <canvas id="game" width="480" height="270" aria-label="Herói correndo e lutando contra monstros"></canvas>
    <div class="hud">
      <div class="who">
        <span class="lv">Nv <b id="rLv">1</b></span>

          <div class="bar sp"><i id="rSp"></i><span id="tSp">60/60</span></div>
          <div class="bar xp"><i id="rXp" style="width:0%"></i></div>
        </div>
      </div>
      <div class="where">
        <b id="rCity">Alvorada</b><small id="rMap">Campos do Despertar</small>
        <span class="gold"><i></i><span id="rGold">0</span></span>
      </div>
    </div>
    <div class="toast" id="toast" hidden></div>
    
    <!-- Ações do runner -->
    <div style="position:absolute; right:6px; bottom:6px; display:flex; gap:4px; pointer-events:auto;">
      <button class="sbtn" id="bMission" type="button" style="font-size:10px; padding:4px 6px;">Missão</button>
      <button class="sbtn" id="bFocus" type="button" style="font-size:10px; padding:4px 6px;">Foco</button>
    </div>
  </div>

  <!-- Skillbar do Runner -->
  <div class="skillbar" id="skillbar" style="max-width:560px; margin:0 auto;"></div>
</header>

const cap1=t=>t.charAt(0).toUpperCase()+t.slice(1);
const pctS=v=>{const p=Math.round(v*1000)/10;return String(p).replace('.',',')};
function fxLine(k,v){
  if(k==='vsType')return Object.entries(v).map(([t,x])=>`+${pctS(x)}% de dano contra ${TYPEPL[t]||t}`).join(' · ');
  if(k==='vsEl')return Object.entries(v).map(([e,x])=>`+${pctS(x)}% de dano contra monstros de ${(ELS[e]||{}).n||e}`).join(' · ');
  if(k==='vsSize')return Object.entries(v).map(([z,x])=>`+${pctS(x)}% de dano contra monstros de tamanho ${(SIZES[z]||z).toLowerCase()}`).join(' · ');
  if(k==='resEl')return Object.entries(v).map(([e,x])=>`−${pctS(x)}% de dano recebido de ${(ELS[e]||{}).n||e}`).join(' · ');
  if(k==='elDmg')return Object.entries(v).map(([e,x])=>`+${pctS(x)}% de dano de ${(ELS[e]||{}).n||e}`).join(' · ');
  if(k==='statPct')return Object.keys(v).length===4?`+${pctS(Object.values(v)[0])}% em todos os atributos`:Object.entries(v).map(([s2,x])=>`+${pctS(x)}% de ${STATN[s2]}`).join(' · ');
  if(k==='wepEl')return `Arma com elemento ${(ELS[v]||{}).n||v}`;
  const d=FXDEF[k];if(!d)return'';const t=d[1],sh=d[2];v=Number(v)||0;
  if(t==='hours')return `Farm offline até ${v} horas`;
  if(k==='postActHeal')return `Cura ${pctS(v)}% da vida por segundo nos 5 s após usar uma ativa`;
  if(k==='streakAll')return `+${pctS(v)}% em todos os atributos por dia de sequência (máximo +30%); zera se a sequência quebrar`;
  if(t==='num')return `${v>0?'+':''}${String(Math.round(v*10)/10).replace('.',',')} ${sh}`;
  if(t==='pts')return `${v>0?'+':''}${String(v).replace('.',',')}% ${sh}`;
  if(t==='neg')return `−${pctS(v)}% ${sh}`;
  if(t==='pct2')return `${v>0?'+':''}${pctS(v)}% ${sh}`;
  return `${v>0?'+':'−'}${pctS(Math.abs(v))}% de ${sh}`;
}

const fxText=fx=>Object.entries(fx||{}).filter(([k])=>k!=='cond'&&(FXDEF[k]||NESTED[k]||k==='wepEl')).map(([k,v])=>fxLine(k,v)).join(' · ')+(fx&&fx.cond?' '+Object.entries(fx.cond).map(([c,v])=>COND_T[c]?COND_T[c](v):'').join(' '):'');
const mulFx=(fx,m)=>{const o={};Object.entries(fx||{}).forEach(([k,v])=>{if(k==='cond'||k==='wepEl'||k==='idleH'){o[k]=v;return}if(NESTED[k]){o[k]={};Object.entries(v).forEach(([a,b])=>o[k][a]=Math.round(b*m*1000)/1000);return}o[k]=typeof v==='number'?Math.round(v*m*1000)/1000:v});return o};

function draw(cv,grid,pal,scale){
  const w=grid[0].length,h=grid.length;cv.width=w*scale;cv.height=h*scale;
  const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);

const imgCache=new Map();
function drawPng(cv,url,box){
  const paint=img=>{const k=Math.max(1,Math.floor(box/Math.max(img.width,img.height)));cv.width=img.width*k;cv.height=img.height*k;const x=cv.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(img,0,0,cv.width,cv.height)};
  let img=imgCache.get(url);if(img&&img.complete){paint(img);return}
  if(!img){img=new Image();img.src=url;imgCache.set(url,img)}
  img.addEventListener('load',()=>paint(img),{once:true});
}

function cardArt(cv,c,big,hidden){
  const W=big?120:60,H=big?84:42;cv.width=W;cv.height=H;const x=cv.getContext('2d');x.imageSmoothingEnabled=false;
  const ec=ELS[c.el].c;
  x.fillStyle='#16131f';x.fillRect(0,0,W,H);
  if(!hidden){for(let i=0;i<7;i++){const r=(.25+hashStr(c.id+i)%40/100)*W,cx=hashStr(c.id+'x'+i)%W,cy=hashStr(c.id+'y'+i)%H;const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,ec+'55');g.addColorStop(1,ec+'00');x.fillStyle=g;x.fillRect(0,0,W,H)}}
  const png=okPng(GSPR.cards[c.id])?GSPR.cards[c.id]:null;
  const put=src=>{const k=Math.max(1,Math.floor(Math.min((W-8)/src.width,(H-6)/src.height)));const w=src.width*k,h=src.height*k;
    if(hidden){const sil=document.createElement('canvas');sil.width=src.width;sil.height=src.height;const y=sil.getContext('2d');y.drawImage(src,0,0);y.globalCompositeOperation='source-in';y.fillStyle='#3a3354';y.fillRect(0,0,sil.width,sil.height);src=sil}
    x.drawImage(src,(W-w)/2|0,(H-h)/2+(big?2:1)|0,w,h)};
  if(png){let img=imgCache.get(png);if(!img){img=new Image();img.src=png;imgCache.set(png,img)}if(img.complete&&img.width)put(img);else img.addEventListener('load',()=>cardArt(cv,c,big,hidden),{once:true});return}
  put(shapeCanvas(c.shape,c.color,c.kind==='elite',c.kind==='rboss'||c.kind==='mboss',1));
}

const DMGK=['hit','slash','proj','arrow','multi','aoe','meteor','exec','counter'];

function battleFx(f){
  const m=f.m,box=$('bfx');if(!m||!box)return;
  const pos={A:22,B:78},add=(cls,css,txt,ms)=>{const e=document.createElement('div');e.className=cls;if(css)e.style.cssText=css;if(txt)e.textContent=txt;box.appendChild(e);setTimeout(()=>e.remove(),ms||1100);return e};
  const pulse=(el,c)=>{if(!el)return;el.classList.remove(c);void el.offsetWidth;el.classList.add(c)};
  const col=KCOL[m.k]||'#ffffff',banner=(txt,c)=>{box.querySelectorAll('.sbanner').forEach(e=>e.remove());add('sbanner',`--bc:${c}`,txt,1000)};
  if(m.k==='cast'){pulse($('f'+m.a),m.a==='A'?'lungeR':'lungeL');banner(m.sk,KSTYLE[m.style]||'#ffe066');return}
  if(DMGK.includes(m.k)){
    if(m.k!=='counter')pulse($('f'+m.a),m.a==='A'?'lungeR':'lungeL');
    const hitNow=()=>{pulse($('f'+m.t),'hitf');add('bnum'+(m.crit?' crit':''),`left:${pos[m.t]}%;top:24px`,'-'+m.d,900)};
    if(m.k==='proj'||m.k==='arrow'){add('proj',`--pc:${m.k==='arrow'?'#e8e0d0':(ELS[m.el]||{}).c||col};--x0:${pos[m.a]}%;--x1:${pos[m.t]}%;top:44px`,'',400);setTimeout(()=>{hitNow();add('boom',`--pc:${col};left:${pos[m.t]}%;top:50px`,'',500)},250)}
    else if(m.k==='meteor'){add('meteor',`left:calc(${pos[m.t]}% - 6px + ${Math.round(Math.random()*16-8)}px);top:40px`,'',450);setTimeout(()=>{add('boom',`--pc:${col};left:${pos[m.t]}%;top:52px`,'',500);hitNow();pulse($('battleArena'),'bigshake')},380)}
    else if(m.k==='aoe'){add('boom',`--pc:${(ELS[m.el]||{}).c||col};left:${pos[m.t]}%;top:50px`,'',500);hitNow();pulse($('battleArena'),'bigshake')}
    else if(m.k==='multi'){add('slash',`--pc:${col};left:${pos[m.t]}%;top:${40+Math.round(Math.random()*12)}px`,'',300);hitNow()}
    else{add('slash',`--pc:${m.crit?'#ffe066':m.k==='exec'?'#e8585a':'#ffffff'};left:${pos[m.t]}%;top:46px`,'',350);hitNow();if(m.crit||m.k==='exec')pulse($('battleArena'),'bigshake')}
    if(m.crit)add('boom',`--pc:#ffe066;left:${pos[m.t]}%;top:50px`,'',500);
    if(m.sk&&m.k==='counter')banner(m.sk,col);
  }else if(m.k==='heal')add('bnum heal',`left:${pos[m.a]}%;top:24px`,'+'+m.d,900);
  else if(m.k==='shield'||m.k==='shieldhit'||m.k==='block')add('ring',`--pc:#6ec6ff;left:${pos[m.a]}%;top:50px`,'',650);
  else if(m.k==='buff')add('ring',`--pc:#ffe066;left:${pos[m.a]}%;top:50px`,'',650);
  else if(m.k==='debuff')add('ring',`--pc:#c58cff;left:${pos[m.t||'B']}%;top:50px`,'',650);
  else if(m.k==='dodge')add('bnum dodge',`left:${pos[m.a]}%;top:24px`,'Esquivou!',900);
  else if(m.k==='resist')add('bnum dodge',`left:${pos[m.a]}%;top:24px`,'Resistiu!',900);
  else if(m.k==='reflect'){add('ring',`--pc:${col};left:${pos[m.a]}%;top:50px`,'',650);add('bnum',`left:${pos[m.t]}%;top:24px`,'-'+m.d,900)}
  else if(m.k==='poison'||m.k==='burnon')add('ring',`--pc:${col};left:${pos[m.t]}%;top:50px`,'',650);
  else if(m.k==='burn')add('bnum burn',`left:${pos[m.t]}%;top:24px`,'-'+m.d,900);
  else if(m.k==='stun'||m.k==='freeze')add('bnum stun',`left:${pos[m.t]}%;top:6px`,m.k==='freeze'?'❄ ❄':'✦ ✦ ✦',900);
  else if(m.k==='mech'){banner(m.sk,'#e8585a');if(m.d){pulse($('fA'),'hitf');add('bnum',`left:${pos.A}%;top:24px`,'-'+m.d,900)}}
}

function startFight(){
  const r=seq[si];bA=r.A;bB=r.B;clock=0;
  drawHero($('cA'),myLook(),5);r.drawB($('cB'));$('bfx').innerHTML='';$('nA').textContent=r.A.name;$('nB').textContent=r.B.name;
  if(r.title)logLine(r.title,true);if(r.fr[0])paint(r.fr[0]);

function paint(f){$('hA').style.width=f.ah/bA.hp*100+'%';$('hB').style.width=f.bh/bB.hp*100+'%';$('tA').textContent=f.ah+'/'+bA.hp;$('tB').textContent=f.bh+'/'+bB.hp}
function tick(){
  const r=seq[si];if(!r){finish();return}
  clock+=.06*speed;let n=0;
  while(fi<r.fr.length&&r.fr[fi].time<=clock&&n<6){const f=r.fr[fi++];paint(f);if(f.m&&!['resist','shieldhit'].includes(f.m.k)||!f.m)logLine(f.t);battleFx(f);n++}
  if(fi>=r.fr.length){if(r.end)logLine(r.end,true);si++;fi=0;if(seq[si])startFight();else finish()}
}
function finish(){
  clearInterval(timer);timer=null;
  const r=seq[seq.length-1];if(r){bA=r.A;bB=r.B;r.drawB($('cB'));$('nB').textContent=r.B.name;paint(r.fr[r.fr.length-1])}
  $('bRes').innerHTML=resultHtml;$('bRes').hidden=false;$('bSkip').hidden=true;$('bDone').hidden=false;
}

function readPng(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\/png$/.test(file.type)){rej('Envie um arquivo PNG.');return}
    if(file.size>200000){rej('Imagem grande demais. Use um PNG pequeno, de até 64 por 64 pixels.');return}
    const fr=new FileReader();fr.onerror=()=>rej('Não consegui ler o arquivo.');
    fr.onload=()=>{const img=new Image();img.onerror=()=>rej('Arquivo de imagem inválido.');img.onload=()=>{
      const max=32,k=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*k)),h=Math.max(1,Math.round(img.height*k));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(img,0,0,w,h);
      const url=cv.toDataURL('image/png');okPng(url)?res(url):rej('A imagem ficou grande demais depois de ajustada.');};img.src=fr.result};
    fr.readAsDataURL(file);
  });
}

  }
  if(type==='gift'){data=id?deep(GCFG.gifts.find(g=>g.id===id)):{id:newId('g'),n:'',xp:200,gold:200,until:today()}}

function snapshotForm(){const o={};document.querySelectorAll('#view input,#view select').forEach(el=>{if(el.id&&el.type!=='file')o[el.id]=el.type==='checkbox'?el.checked:el.value});return o}

function equipBest(){
  let changed=0;
  for(const sl of Object.keys(SLOTS)){
    const opts=[...new Set(s.owned)].map(id=>ITEM[id]).filter(i=>i&&i.slot===sl&&reqOk(i));
    if(!opts.length)continue;
    const val=i=>score(i)+((s.sock[i.id]||[]).filter(Boolean).length*40);
    const best=opts.reduce((a,b)=>val(b)>val(a)?b:a);
    if(s.eq[sl]!==best.id&&val(best)>val(ITEM[s.eq[sl]]||{id:''})){s.eq[sl]=best.id;changed++}
  }
  return changed;
}
function sellOne(id){
  const i=ITEM[id],idx=s.owned.indexOf(id);if(!i||idx<0)return 0;
  if(s.eq[i.slot]===id&&count(id)===1)return 0;
  if(count(id)===1&&(s.sock[id]||[]).some(Boolean))return 0;
  s.owned.splice(idx,1);const g=sellPrice(i);s.gold+=g;return g;
}

  }
  const timers=[];

      atk:Math.round(D.atk*k*(elite?1.6:1)),def:D.def*k,spd:D.spd,xp:Math.round(D.xp*k*(elite?3:1)),gold:D.gold,card:D.card,color:ensureSheet(D.id).color,

    if(!list.length)return;

  const alive=()=>G.monsters.filter(m=>!m.dying);

  function shake(a){if(!REDUCED)G.trauma=Math.min(1,G.trauma+a)}
  
  function strike(m,mult,opt={}){
    if(!m||m.dying)return;
    const crit=Math.random()*100<hero.crit;

  }
  
  function kill(m){
    m.dying=.001;G.kills++;G.mapKills++;
    for(let i=0;i<16;i++)G.fx.push({kind:'spark',x:m.x+rand(-8,8),y:m.y-rand(4,20),vx:rand(-60,60),vy:rand(-90,-20),t:0,dur:rand(.4,.7),col:m.color||'#ffffff',grav:1});

    for(let i=0;i<Math.min(6,g);i++)G.coins.push({x:m.x,y:m.y-14,vx:rand(-50,50),vy:rand(-120,-60),t:0,val:i===0?g:0});

    /* SINCRONIZAÇÃO DE XP/OURO COM O JOGO PRINCIPAL */
    if(s) {

      s.acc.x += m.xp; // Acumula XP para o jogo principal
      if (s.acc.x >= needXp(s.level)) {
        const up = Math.floor(s.acc.x / needXp(s.level));
        s.acc.x = s.acc.x % needXp(s.level);
        gainXP(up * needXp(s.level), true);
      }
    }
    /* ======================================== */

    if(Math.random()<.04*luck()){toastUI('Item: Poção Vermelha');addPop(m.x,m.y-56,'Poção!','drop')}
    if(Math.random()<(m.boss?.25:m.elite?.05:.008)*luck()){G.cards++;toastUI(m.card+'!');addPop(m.x,m.y-60,'CARTA!','card');shake(.3)}
  }
  
  function gainXp(x){
    hero.xp+=x;
    while(hero.xp>=needXp(hero.lv)){hero.xp-=needXp(hero.lv);hero.lv++;hero.mhp+=14;hero.hp=hero.mhp;hero.msp+=4;hero.sp=hero.msp;hero.atk+=3;hero.def+=1;
      addPop(hero.x,GROUND-70,'LEVEL UP!','lvl');toastUI(`Nível ${hero.lv}!`);
      for(let i=0;i<24;i++)G.fx.push({kind:'spark',x:hero.x+rand(-12,12),y:GROUND-rand(0,50),vx:rand(-20,20),vy:rand(-80,-30),t:0,dur:rand(.6,1.1),col:'#f2c14e'})}
  }
  
  function monsterHit(m){
    if(hero.dead||m.dying)return;
    if(Math.random()<.08){addPop(hero.x,GROUND-60,'Miss','miss');return}
    const crit=Math.random()<.05;let d=m.atk*rand(.9,1.1)-hero.def*.5;if(crit)d*=1.6;d=Math.max(1,Math.round(d));

  }

  function addPop(x,y,text,kind){G.pops.push({x:x+rand(-4,4),y,text,kind,t:0,dur:kind==='skill'?1.1:.9,vx:kind==='dmg'||kind==='crit'?rand(10,30):0})}
  const POPSTYLE={dmg:['#ffffff','#2a1d0a',13],crit:['#ffe066','#a8161c',19],hurt:['#ff6a6a','#2a0505',13],critHurt:['#ff2a2a','#ffe066',17],heal:['#7dff9a','#063a15',14],
    miss:['#c9c3db','#1a1426',11],skill:['#ffffff','#3a2a6a',12],status:['#ffe066','#3a2a00',10],drop:['#c58cff','#1a0a2a',12],card:['#f2c14e','#5a1a6a',16],lvl:['#ffe066','#6a3a00',16]};
  
  function drawPops(g,dt){
    for(const p of G.pops){
      p.t+=dt;const k=p.t/p.dur,[fill,stroke,size]=POPSTYLE[p.kind]||POPSTYLE.dmg;
      const rise=(1-Math.pow(1-Math.min(1,k),3))*(p.kind==='skill'?14:26);
      const sc=p.kind==='crit'||p.kind==='card'||p.kind==='lvl'?(k<.15?lerp(1.8,1,k/.15):1):(k<.1?lerp(.6,1,k/.1):1);
      g.save();g.globalAlpha=k>.7?1-(k-.7)/.3:1;g.translate(Math.round(p.x+p.vx*k),Math.round(p.y-rise));g.scale(sc,sc);
      g.font=`700 ${size}px ${p.kind==='skill'||p.kind==='lvl'||p.kind==='card'?'"Pixelify Sans",monospace':'Rubik,system-ui,sans-serif'}`;
      g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=p.kind==='crit'?4:3;g.strokeStyle=stroke;g.strokeText(p.text,0,0);g.fillStyle=fill;g.fillText(p.text,0,0);
      if(p.kind==='crit'){g.font='700 8px Rubik,system-ui,sans-serif';g.lineWidth=3;g.strokeText('CRÍTICO',0,-13);g.fillStyle='#ff6a3a';g.fillText('CRÍTICO',0,-13)}
      g.restore();
    }
    G.pops=G.pops.filter(p=>p.t<p.dur);
  }

  let skyKey='',sky=null;
  const PAL=()=>mapOf(G.map).pal;
  function skyGrad(){const p=PAL();if(skyKey!==G.map){skyKey=G.map;sky=ctx.createLinearGradient(0,0,0,GROUND);sky.addColorStop(0,p.sky[0]);sky.addColorStop(.55,p.sky[1]);sky.addColorStop(1,p.sky[2])}return sky}
  function drawBackground(g){
    const p=PAL();g.fillStyle=skyGrad();g.fillRect(0,0,W,GROUND);
    g.fillStyle=p.sun+'.85)';g.beginPath();g.arc(380,62,22,0,7);g.fill();g.fillStyle=p.sun+'.25)';g.beginPath();g.arc(380,62,34,0,7);g.fill();
    const cOff=G.scroll*.05+G.time*4;
    for(let i=-1;i<6;i++){const n=Math.floor(cOff/110)+i,x=Math.round(n*110-cOff+hash(n)*40),y=24+hash(n+3)*50;
      g.fillStyle='rgba(255,255,255,.85)';g.fillRect(x,y,46,8);g.fillRect(x+8,y-6,26,6);g.fillRect(x+18,y-10,12,4);g.fillStyle='rgba(240,200,170,.6)';g.fillRect(x,y+8,46,2)}
    layer(g,.15,90,(x,n)=>{const h=50+hash(n)*40;tri(g,x,GROUND-30,60,h,p.mt);tri(g,x+3,GROUND-30-h+12,10,12,'#fff2c8')});
    g.fillStyle=p.hill[0];g.fillRect(0,GROUND-34,W,34);
    layer(g,.3,70,(x,n)=>{const r=26+hash(n+9)*18;g.fillStyle=p.hill[1];for(let d=-r;d<=r;d+=2){const hh=Math.round(Math.sqrt(r*r-d*d)*.7);g.fillRect(x+d,GROUND-34-hh,2,hh)}});
    layer(g,.6,64,(x,n)=>{const v=hash(n+21);
      if(v<.22){house(g,x,GROUND-6,n)}
      else if(v<.8){const h=24+hash(n+5)*16;g.fillStyle='#6b4a24';g.fillRect(x-2,GROUND-14,4,14);tri(g,x,GROUND-10,13,h,p.tree[0]);tri(g,x,GROUND-10-h*.45,10,h*.6,p.tree[1])}
      else{g.fillStyle='#8a5a2b';g.fillRect(x-14,GROUND-12,2,12);g.fillRect(x+12,GROUND-12,2,12);g.fillRect(x-14,GROUND-10,28,2);g.fillRect(x-14,GROUND-5,28,2)}});
  }
  function drawGround(g){
    const p=PAL();g.fillStyle=p.ground;g.fillRect(0,GROUND,W,H-GROUND);g.fillStyle=p.grass[0];g.fillRect(0,GROUND,W,3);g.fillStyle=p.grass[1];g.fillRect(0,GROUND+3,W,2);
    const off=G.scroll%16;g.fillStyle='rgba(0,0,0,.18)';for(let x=-off;x<W;x+=16)g.fillRect(Math.round(x),GROUND+10,8,2);
    layer(g,1,37,(x,n)=>{if(hash(n)<.5){g.fillStyle='#a8845a';g.fillRect(x,GROUND+16+Math.round(hash(n+2)*20),4,3)}});
  }
  function drawForeground(g){
    layer(g,1.3,48,(x,n)=>{if(hash(n+40)<.55){g.fillStyle=PAL().grass[1];for(let i=0;i<5;i++)g.fillRect(x+i*2,H-8-Math.round(hash(n+i)*8),2,12)}});
  }
  function layer(g,factor,spacing,fn){const off=G.scroll*factor;for(let i=-1;i<=Math.ceil(W/spacing)+1;i++){const n=Math.floor(off/spacing)+i;fn(Math.round(n*spacing-off+hash(n+7)*spacing*.3),n)}}
  function tri(g,cx,base,w,h,col){g.fillStyle=col;const steps=Math.max(1,Math.round(h/2));for(let r=0;r<steps;r++){const ww=Math.round(w*(r+1)/steps);g.fillRect(Math.round(cx-ww),Math.round(base-h+r*2),ww*2,2)}}
  function house(g,x,base,n){const roof=['#b0553a','#2f5f8a','#4f8a3a'][n%3];g.fillStyle='#d9c39a';g.fillRect(x-14,base-18,28,18);tri(g,x,base-16,17,14,roof);g.fillStyle='#6b4a24';g.fillRect(x-4,base-10,7,10);g.fillStyle='#f2c14e';g.fillRect(x+7,base-14,5,5)}

  function drawFx(g,dt){
    for(const e of G.fx){
      e.t+=dt;const k=Math.min(1,e.t/e.dur);
      g.save();
      if(e.kind==='slash'||e.kind==='slash2'||e.kind==='dash'){
        const col=e.crit?'#ffe066':e.kind==='dash'?'#ff8a3a':'#ffffff';g.strokeStyle=col;g.globalAlpha=1-k;g.lineWidth=(e.crit?5:3)*(1-k)+1;
        g.beginPath();const r=14+k*10,dir=e.kind==='slash2'?1:-1;g.arc(e.x,e.y,r,dir*-1.2,dir*.9,dir<0);g.stroke();
        if(e.kind==='dash'){g.globalAlpha=(1-k)*.5;g.fillStyle='#ff8a3a';for(let i=0;i<5;i++)g.fillRect(e.x-40-i*10+k*30,e.y-8+i*4,24,2)}
      }else if(e.kind==='bolt'){
        g.globalAlpha=k<.6?1:1-(k-.6)/.4;g.strokeStyle='#dfefff';g.lineWidth=3;g.shadowColor='#6ec6ff';g.shadowBlur=10;
        g.beginPath();let x=e.x+Math.sin(e.seed)*10,y=0;g.moveTo(x,y);
        while(y<GROUND-10){y+=14;x=e.x+(hash(e.seed+y)-.5)*18*(1-y/GROUND);g.lineTo(x,y)}g.stroke();
        g.lineWidth=1;g.strokeStyle='#ffffff';g.stroke();
        g.globalAlpha*=.6;g.fillStyle='#bfe6ff';g.beginPath();g.ellipse(e.x,GROUND-2,20*k+6,5,0,0,7);g.fill();
      }else if(e.kind==='flash'){g.globalAlpha=(1-k)*.45;g.fillStyle=e.col;g.fillRect(0,0,W,H)}
      else if(e.kind==='spark'){e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.grav)e.vy+=260*dt;g.globalAlpha=1-k;g.fillStyle=e.col;g.fillRect(Math.round(e.x),Math.round(e.y),2,2)}
      g.restore();
    }
    G.fx=G.fx.filter(e=>e.t<e.dur);
  }
  function updateCoins(g,dt){
    for(const c of G.coins){
      c.t+=dt;
      if(c.t<.45){c.x+=c.vx*dt;c.y+=c.vy*dt;c.vy+=380*dt;if(c.y>GROUND-4){c.y=GROUND-4;c.vy*=-.4}}
      else{const k=Math.min(1,(c.t-.45)/.45);c.x=lerp(c.x,W-30,k*.35);c.y=lerp(c.y,22,k*.35)}
      g.fillStyle='#f2c14e';g.fillRect(Math.round(c.x)-2,Math.round(c.y)-2,4,4);g.fillStyle='#fff2b0';g.fillRect(Math.round(c.x)-1,Math.round(c.y)-1,1,1);
      if(c.t>=.9&&!c.done){c.done=true;if(c.val){addPop(W-40,40,'+'+c.val,'status')}}
    }
    G.coins=G.coins.filter(c=>!c.done);
  }

  function update(dt){
    G.time+=dt;
    for(const k in G.buffs)G.buffs[k]=Math.max(0,G.buffs[k]-dt);
    hero.sp=Math.min(hero.msp,hero.sp+(3+hero.lv*.2)*(G.buffs.focus>0?2:1)*dt);
    for(let i=timers.length-1;i>=0;i--){timers[i].t-=dt;if(timers[i].t<=0){const f=timers[i].fn;timers.splice(i,1);f()}}
    if(hero.dead>0){hero.dead-=dt;if(hero.dead<=0){hero.hp=hero.mhp;hero.sp=hero.msp;G.monsters=[];hero.anim.play('RUN');toastUI('De volta à caçada')}}
    const eng=engaged()&&!hero.dead;
    const runSpd=hero.speed*spdMul();
    const scrollV=(!eng&&!hero.dead&&!hero.busy)?runSpd:0;
    G.scroll+=scrollV*dt;
    if(!hero.busy&&!hero.dead)hero.anim.play(eng?'IDLE':'RUN',{speed:spdMul()});
    hero.anim.update(dt);hero.flash=Math.max(0,hero.flash-dt);
    hero.dash=hero.busy?hero.dash:Math.max(0,hero.dash-200*dt);
    hero.atkT-=dt*spdMul();
    if(eng&&!hero.busy&&hero.atkT<=0){
      hero.atkT=hero.atkInterval;hero.busy=true;const t=front();
      hero.anim.play('ATTACK',{restart:true,speed:spdMul(),onHit:()=>strike(t,1),onEnd:endBusy});
    }
    if(G.auto&&!hero.busy&&!hero.dead){for(const s of SKILLS){if(castSkill(s,false))break}}
    G.spawnT-=dt;if(G.spawnT<=0){spawn();G.spawnT=rand(1.6,3.2)/spdMul()}
    const list=alive().sort((a,b)=>a.x-b.x);
    list.forEach((m,i)=>{
      m.anim.update(dt);m.flash=Math.max(0,m.flash-dt);m.kb*=Math.pow(.001,dt);m.stun=Math.max(0,m.stun-dt);
      const stop=i===0?hero.x+RANGE-4:list[i-1].x+24;
      const move=m.stun>0?0:m.spd;
      m.x-=(move+scrollV)*dt;
      if(m.x<stop){m.x=stop}
      const contact=i===0&&m.x<=hero.x+RANGE;
      if(m.stun>0){if(m.anim.state!=='HIT')m.anim.play('IDLE')}
      else if(contact&&!hero.dead){
        m.atkT-=dt;
        if(m.atkT<=0&&m.anim.state!=='ATTACK'){m.atkT=rand(1.2,1.6);m.anim.play('ATTACK',{restart:true,onHit:()=>monsterHit(m),onEnd:()=>m.anim.play('IDLE')})}
        else if(m.anim.state==='RUN')m.anim.play('IDLE');
      }else if(m.anim.state!=='HIT'&&m.anim.state!=='ATTACK')m.anim.play(m.x>stop+1?'RUN':'IDLE');
    });
    G.monsters.forEach(m=>{if(m.dying)m.dying+=dt});
    G.monsters=G.monsters.filter(m=>(!m.dying||m.dying<.35)&&m.x>-60);
  }

  function render(dt){
    ctx.save();
    if(G.trauma>0){const s=G.trauma*G.trauma*6;ctx.translate(Math.round(rand(-s,s)),Math.round(rand(-s,s)));G.trauma=Math.max(0,G.trauma-dt*1.8)}
    drawBackground(ctx);drawGround(ctx);
    ctx.fillStyle='rgba(0,0,0,.22)';
    ctx.beginPath();ctx.ellipse(hero.x+hero.dash,GROUND+1,14,3,0,0,7);ctx.fill();
    alive().forEach(m=>{ctx.beginPath();ctx.ellipse(m.x,GROUND+1,12*(m.elite?1.3:1),3,0,0,7);ctx.fill()});
    [...G.monsters].sort((a,b)=>b.x-a.x).forEach(m=>{
      const a=m.dying?Math.max(0,1-m.dying/.35):1;
      ctx.save();if(m.elite||m.boss){const z=m.boss?1.7:1.3;ctx.translate(m.x,m.y);ctx.scale(z,z);ctx.translate(-m.x,-m.y)}
      m.anim.draw(ctx,m.x+m.kb,m.y+2,{flip:true,flash:m.flash,alpha:a,tint:m.elite?'#ff4a4a':null});ctx.restore();
      if(!m.dying&&m.hp<m.mhp){const w=26;ctx.fillStyle='#000';ctx.fillRect(Math.round(m.x-w/2)-1,GROUND+5,w+2,4);ctx.fillStyle=m.elite?'#ff8a3a':'#e8585a';ctx.fillRect(Math.round(m.x-w/2),GROUND+6,Math.round(w*m.hp/m.mhp),2)}
      if(m.stun>0&&!m.dying){for(let i=0;i<3;i++){const ang=G.time*6+i*2.1;ctx.fillStyle='#ffe066';ctx.fillRect(Math.round(m.x+Math.cos(ang)*9),Math.round(m.y-40+Math.sin(ang)*2),2,2)}}
    });
    if(!(hero.dead>0&&Math.floor(G.time*8)%2))hero.anim.draw(ctx,hero.x+hero.dash,GROUND+2,{flash:hero.flash,alpha:hero.dead>0?.6:1});
    drawFx(ctx,dt);updateCoins(ctx,dt);drawForeground(ctx);drawPops(ctx,dt);
    ctx.restore();
  }

  let last=performance.now();
  function loop(now){
    if(document.hidden || !$('stripBox') || $('stripBox').hidden) { requestAnimationFrame(loop); return; }
    let dt=(now-last)/1000;last=now;
    dt=Math.min(dt,.1);
    if(G.hitStop>0){G.hitStop-=dt;render(0);for(const p of G.pops)p.t+=dt*.5}
    else{update(dt);render(dt)}
    hud();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(t=>{last=t;requestAnimationFrame(loop)});
  document.addEventListener('visibilitychange',()=>{last=performance.now()});

  const sb=$('skillbar');
  sb.innerHTML=SKILLS.map(s=>`<button class="sk" type="button" data-sk="${s.id}" aria-label="${s.n}, tecla ${s.key}"><span class="key">${s.key}</span><canvas class="ic" width="17" height="17"></canvas><b>${s.n}</b><small>${s.sp} SP · ${s.cd} s</small><span class="cd"></span><span class="cdt"></span></button>`).join('')+
    `<button class="auto" id="bAuto" type="button" aria-pressed="true">AUTO<small style="font-weight:400;color:var(--mute)">ativas sozinhas</small></button>`;
  const ICONS={duplo:['..........w..','.........ww..','........ww...','.......ww....','..w..ww......','...ww........','..ww.w.......','.ww...w......','w.........w..','.........w...','........w....'],
    raio:['......yy.','.....yy..','....yy...','...yyyyy.','.....yy..','....yy...','...yy....','..yy.....','.y.......'],
    investida:['....oo....','..oooooo..','oo.oooooo.','..oooooooo','oo.oooooo.','..oooooo..','....oo....'],
    cura:['...gg...','...gg...','gggggggg','gggggggg','...gg...','...gg...']};
  const ICOL={w:'#ffffff',y:'#bfe6ff',o:'#ff8a3a',g:'#5fcf8a'};
  document.querySelectorAll('.sk').forEach(b=>{const grid=ICONS[b.dataset.sk],cv=b.querySelector('canvas'),x=cv.getContext('2d');const ox=Math.floor((17-grid[0].length)/2),oy=Math.floor((17-grid.length)/2);
    grid.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ICOL[ch]){x.fillStyle=ICOL[ch];x.fillRect(ox+i,oy+j,1,1)}}));
    b.addEventListener('click',()=>castSkill(SKILLS.find(s=>s.id===b.dataset.sk),true))});
  $('bAuto').addEventListener('click',e=>{G.auto=!G.auto;e.currentTarget.setAttribute('aria-pressed',G.auto)});
  addEventListener('keydown',e=>{const s=SKILLS.find(s=>s.key===e.key);if(s&&!e.target.matches('input,select'))castSkill(s,true)});

  $('bMission').addEventListener('click',()=>{G.buffs.mission=60;toastUI('Missão concluída! +30% velocidade e sorte');shake(.2);
    for(let i=0;i<20;i++)G.fx.push({kind:'spark',x:hero.x+rand(-14,14),y:GROUND-rand(0,50),vx:rand(-20,20),vy:rand(-70,-20),t:0,dur:rand(.6,1),col:'#f2c14e'})});
  $('bFocus').addEventListener('click',()=>{G.buffs.focus=30;toastUI('Modo foco: +20% ataque, SP em dobro')});

  let tt;function toastUI(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,1600)}
  let lastHud='';
  function hud(){
    const key=[G.map,hero.key,Math.round(hero.hp),hero.mhp,Math.round(hero.sp),hero.msp,hero.lv,hero.xp,hero.gold,Math.ceil(G.buffs.mission),Math.ceil(G.buffs.focus),G.kills,G.cards].join();
    if(key!==lastHud){lastHud=key;
      $('rLv').textContent=hero.lv;$('rName').textContent=`${hero.name} · ${CLS[hero.key]?CLS[hero.key].n:'Herói'}`;const mp=mapOf(G.map);$('rCity').textContent=mp.city;$('rMap').textContent=mp.n;
      $('rHp').style.width=hero.hp/hero.mhp*100+'%';$('tHp').textContent=`${Math.round(hero.hp)}/${hero.mhp}`;
      $('rSp').style.width=hero.sp/hero.msp*100+'%';$('tSp').textContent=`${Math.floor(hero.sp)}/${hero.msp}`;
      $('rXp').style.width=hero.xp/needXp(hero.lv)*100+'%';$('rGold').textContent=fmt(hero.gold);
      $('bMission').disabled=G.buffs.mission>0;$('bFocus').disabled=G.buffs.focus>0;
    }
    SKILLS.forEach(s=>{const b=document.querySelector(`[data-sk="${s.id}"]`);const left=Math.max(0,s.ready-G.time);
      b.querySelector('.cd').style.setProperty('--p',(left/s.cd*100)+'%');b.querySelector('.cdt').textContent=left>0?Math.ceil(left):'';b.classList.toggle('nosp',hero.sp<s.sp)});
  }

  /* ======================= AUTO-FETCHER ======================= */
  const IDB={db:null,
    open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{let r;try{r=indexedDB.open('runner-sprites',1)}catch(e){rej(e);return}r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>{this.db=r.result;res(r.result)};r.onerror=()=>rej(r.error)})},
    async tx(mode,fn){try{const db=await this.open();return await new Promise((res,rej)=>{const tx=db.transaction('s',mode),st=tx.objectStore('s'),out=fn(st);tx.oncomplete=()=>res(out&&out.result);tx.onerror=()=>rej(tx.error)})}catch(e){return null}},
    put(k,v){return this.tx('readwrite',s=>s.put(v,k))},del(k){return this.tx('readwrite',s=>s.delete(k))},
    async all(){const keys=await this.tx('readonly',s=>s.getAllKeys())||[],vals=await this.tx('readonly',s=>s.getAll())||[];return keys.map((k,i)=>[k,vals[i]])}};
  function saveSprite(who,o){IDB.put(who,o)}
  function forgetSprite(who){IDB.del(who)}

  function buildGrid(srcCv,boxes,seq,flip){
    const all=STATES.flatMap(st=>seq[st].map(i=>boxes[i])),fw=Math.max(...all.map(b=>b.w))+2,fh=Math.max(...all.map(b=>b.h))+2,cols=Math.max(...STATES.map(st=>seq[st].length));
    const out=document.createElement('canvas');out.width=fw*cols;out.height=fh*STATES.length;const x=out.getContext('2d');x.imageSmoothingEnabled=false;
    STATES.forEach((st,r)=>seq[st].forEach((i,f)=>{const b=boxes[i],dx=f*fw+Math.round((fw-b.w)/2),dy=r*fh+fh-1-b.h;
      x.save();if(flip){x.translate(dx+b.w,dy);x.scale(-1,1);x.drawImage(srcCv,b.x,b.y,b.w,b.h,0,0,b.w,b.h)}else x.drawImage(srcCv,b.x,b.y,b.w,b.h,dx,dy,b.w,b.h);x.restore()}));
    return{src:out.toDataURL('image/png'),fw,fh};
  }
  function detectFrames(img,gap){
    const w=img.width,h=img.height,c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);
    const id=x.getImageData(0,0,w,h),d=id.data,k=[d[0],d[1],d[2],d[3]],transBg=k[3]<10;
    for(let i=0;i<d.length;i+=4){const near=Math.abs(d[i]-k[0])+Math.abs(d[i+1]-k[1])+Math.abs(d[i+2]-k[2])<36,mag=d[i]>240&&d[i+1]<16&&d[i+2]>240;
      if(d[i+3]<10||(!transBg&&near)||mag)d[i+3]=0}
    x.putImageData(id,0,0);
    const N=w*h,seen=new Uint8Array(N),q=new Int32Array(N);let boxes=[];
    for(let p=0;p<N;p++){
      if(seen[p]||d[p*4+3]===0)continue;let qh=0,qt=0;q[qt++]=p;seen[p]=1;let x0=w,y0=h,x1=0,y1=0,n=0;
      while(qh<qt){const cc=q[qh++],cx=cc%w,cy=(cc/w)|0;n++;if(cx<x0)x0=cx;if(cx>x1)x1=cx;if(cy<y0)y0=cy;if(cy>y1)y1=cy;
        if(cx>0&&!seen[cc-1]&&d[(cc-1)*4+3]){seen[cc-1]=1;q[qt++]=cc-1}
        if(cx<w-1&&!seen[cc+1]&&d[(cc+1)*4+3]){seen[cc+1]=1;q[qt++]=cc+1}
        if(cy>0&&!seen[cc-w]&&d[(cc-w)*4+3]){seen[cc-w]=1;q[qt++]=cc-w}
        if(cy<h-1&&!seen[cc+w]&&d[(cc+w)*4+3]){seen[cc+w]=1;q[qt++]=cc+w}}
      boxes.push({x:x0,y:y0,w:x1-x0+1,h:y1-y0+1,n});
    }
    let changed=true;
    while(changed){changed=false;
      outer:for(let i=0;i<boxes.length;i++)for(let j=i+1;j<boxes.length;j++){const a=boxes[i],b=boxes[j];
        if(a.x-gap<=b.x+b.w&&b.x-gap<=a.x+a.w&&a.y-gap<=b.y+b.h&&b.y-gap<=a.y+a.h){
          const nx=Math.min(a.x,b.x),ny=Math.min(a.y,b.y);a.w=Math.max(a.x+a.w,b.x+b.w)-nx;a.h=Math.max(a.y+a.h,b.y+b.h)-ny;a.x=nx;a.y=ny;a.n+=b.n;boxes.splice(j,1);changed=true;break outer}}}
    boxes=boxes.filter(b=>b.n>=24&&b.w>=5&&b.h>=5);
    boxes.sort((a,b)=>a.y-b.y);const rows=[];
    boxes.forEach(b=>{const r=rows.find(r=>b.y<r.y+r.h*.5&&b.y+b.h>r.y+r.h*.5);if(r){r.list.push(b);r.h=Math.max(r.h,b.y+b.h-r.y)}else rows.push({y:b.y,h:b.h,list:[b]})});
    rows.forEach(r=>r.list.sort((a,b)=>a.x-b.x));
    return{cv:c,boxes:rows.flatMap(r=>r.list),rows:rows.map(r=>r.list)};
  }
  function autoCropAndMapSheet(imageElement,options={}){
    const o={gap:3,layout:'auto',order:['IDLE','RUN','ATTACK','HIT'],maxFrames:8,flip:false,counts:{IDLE:4,RUN:4,ATTACK:4,SKILL:3,HIT:2},...options};
    const det=detectFrames(imageElement,o.gap);
    if(!det.boxes.length)throw new Error('Nenhum quadro encontrado.');
    const area=b=>b.w*b.h,med=det.boxes.map(area).sort((a,b)=>a-b)[Math.floor(det.boxes.length/2)];
    const ok=b=>area(b)>=med*.18&&area(b)<=med*6&&b.h>=med**.5*.35;
    const rows=det.rows.map(r=>r.filter(ok)).filter(r=>r.length);
    const index=new Map(det.boxes.map((b,i)=>[b,i]));
    const seq={IDLE:[],RUN:[],ATTACK:[],SKILL:[],HIT:[]};
    let layout=o.layout;if(layout==='auto')layout=rows.length>=Math.min(3,o.order.length)?'rows':'sequence';
    if(layout==='rows'){o.order.forEach((st,i)=>{if(rows[i])seq[st]=rows[i].slice(0,o.maxFrames).map(b=>index.get(b))})}
    else{const flat=rows.flat().map(b=>index.get(b));let p=0;o.order.forEach(st=>{const n=Math.min(o.counts[st]||4,o.maxFrames);seq[st]=flat.slice(p,p+n);p+=n});
      if(!seq.IDLE.length&&flat.length)seq.IDLE=flat.slice(0,Math.min(4,flat.length))}
    const first=STATES.find(st=>seq[st].length);if(!first)throw new Error('Não deu para montar as animações.');
    if(!seq.IDLE.length)seq.IDLE=seq.RUN.length?seq.RUN.slice(0,2):seq[first].slice(0,2);
    if(!seq.RUN.length)seq.RUN=seq.IDLE.slice();
    if(!seq.ATTACK.length)seq.ATTACK=seq.RUN.slice();
    if(!seq.SKILL.length)seq.SKILL=seq.ATTACK.slice();
    if(!seq.HIT.length)seq.HIT=seq.IDLE.slice(0,1);
    const g=buildGrid(det.cv,det.boxes,seq,o.flip);
    const anims={};STATES.forEach((st,r)=>{anims[st]={row:r,frames:seq[st].length,fps:st==='RUN'?10:st==='IDLE'?5:st==='HIT'?8:10,loop:st==='IDLE'||st==='RUN'};if(st==='ATTACK'||st==='SKILL')anims[st].hit=Math.floor(seq[st].length/2)});
    return{...g,anims,layout,frames:det.boxes.length,used:Object.values(seq).reduce((a,s)=>a+s.length,0)};
  }
  
  /* === CARREGAMENTO DE SPRITES VIA URL (Ragnarok) === */
  function applySheet(who,src,fw,fh,scale,opt){
    const img=new Image();
    img.onload=()=>{
      const S=ensureSheet(who),c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);
      const cols=Math.floor(img.width/fw),rows=Math.floor(img.height/fh);
      if(!cols||!rows){toastUI('O quadro é maior que a imagem');return}
      STATES.forEach((st,r)=>{
        const row=Math.min(r,rows-1);let n=0;
        for(let f=0;f<cols;f++){const d=x.getImageData(f*fw,row*fh,fw,fh).data;let any=false;for(let i=3;i<d.length;i+=16)if(d[i]>10){any=true;break}if(any)n=f+1}
        S.anims[st].row=row;S.anims[st].frames=Math.max(1,n);if(S.anims[st].hit!=null)S.anims[st].hit=Math.min(S.anims[st].hit,Math.max(0,n-1));
      });
      S.fw=fw;S.fh=fh;S.src=src;S.scale=scale;
      S.custom=true;refreshAnim(who);
      tintCache.clear();if(!opt||!opt.quiet)toastUI(`Sprite de ${nameOf(who)} carregado`);if(opt&&opt.done)opt.done();
    };
    img.onerror=()=>toastUI('Não foi possível ler essa imagem');
    img.src=src;
  }
  function refreshAnim(who){if(who===hero.key){const st=hero.anim.state;hero.anim=makeAnimator(who);hero.anim.play(st)}G.monsters.filter(m=>m.key===who).forEach(m=>{m.anim=makeAnimator(who);m.color=SHEETS[who].color||m.color})}
  const nameOf=k=>(DB[k]&&DB[k].n)||(CLS[k]&&CLS[k].n)||k;
  
  async function processImage(key,img,extra={}){
    const t0=performance.now(),r=autoCropAndMapSheet(img,{layout:$('aLayout')?$('aLayout').value:'auto',order:$('aOrder')?$('aOrder').value.split(','):['IDLE','RUN','ATTACK','HIT'],maxFrames:$('aMax')?clamp(+$('aMax').value||8,1,16):8,flip:$('aFlip')?$('aFlip').checked:false,...(extra.opts||{})}),S=ensureSheet(key);
    S.anims=r.anims;const scale=(CLS[key]?64:DB[key]&&DB[key].boss?60:46)/r.fh;
    await new Promise(res=>applySheet(key,r.src,r.fw,r.fh,clamp(scale,.2,4),{quiet:true,done:res}));
    saveSprite(key,{src:r.src,fw:r.fw,fh:r.fh,scale:SHEETS[key].scale,anims:SHEETS[key].anims,url:extra.url||''});
    return{...r,ms:Math.round(performance.now()-t0)};
  }

  async function loadSpriteFromURL(key,url,opts){
    if(!/^https?:\/\//i.test(url))throw new Error('Cole um link que comece com http:// ou https://');
    let blob;
    try{const res=await fetch(url,{mode:'cors'});if(!res.ok)throw new Error('HTTP '+res.status);blob=await res.blob()}
    catch(e){throw new Error('O link não pôde ser baixado. O site pode não liberar acesso de outras páginas (CORS). Baixe o PNG e solte o arquivo aqui.')}
    if(!/^image\//.test(blob.type))throw new Error('O link não é uma imagem.');
    const src=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob)});
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Não foi possível ler essa imagem.'));i.src=src});
    return processImage(key,img,{url,opts});
  }
  
  async function initSprites(){
    const saved = await IDB.all();
    for(const [k,o] of saved){
      if(!o||!o.src||!(DB[k]||CLS[k]))continue;
      const S=ensureSheet(k);if(o.anims)S.anims=o.anims;
      await new Promise(res=>applySheet(k,o.src,o.fw,o.fh,o.scale,{quiet:true,done:res}));
    }
    /* Carrega URLs definidas no banco (Ragnarok) */
    const pending=[...monstersDatabase,...HERO_CLASSES].filter(e=>e.url);
    for(const e of pending){
      try{await loadSpriteFromURL(e.id,e.url);}catch(err){console.warn('Falha ao carregar sprite RO:', e.id, err)}
    }
  }
  initSprites();

})();
</script>
