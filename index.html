<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#201c2f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Torre da Disciplina</title>
<meta name="apple-mobile-web-app-title" content="Torre">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
/* Layout: app de celular — barra de status do herói no topo, conteúdo rolável, abas fixas embaixo. Tema único noturno de masmorra. */
:root{
  --bg:#14121d; --panel:#201c2f; --panel2:#2a2540; --line:#3a3354;
  --ink:#f1ead9; --mute:#a7a0bb;
  --gold:#f2c14e; --xp:#6ec6ff; --hp:#e8585a; --ok:#5fcf8a;
  --str:#ff8a5c; --int:#6ec6ff; --dis:#f2c14e; --cre:#c58cff;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:20px}
h3{font-size:17px}
p{margin:0}
.mute{color:var(--mute)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* ===== HEADER (Runner Game) ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.lv{font-family:var(--display);font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;white-space:nowrap}
.lv b{color:var(--xp);font-size:17px}
.top-mid{min-width:0;display:flex;flex-direction:column;gap:3px}
.top-name{font-family:var(--display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.sync{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none}
.sync.on{background:var(--ok)}.sync.err{background:var(--hp)}
.coins{display:flex;gap:10px;align-items:center;font-family:var(--display);font-size:15px}
.coin{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #b8862a}
.fire{width:9px;height:12px;background:var(--str);clip-path:polygon(50% 0,100% 60%,80% 100%,20% 100%,0 60%)}
.bar{height:8px;background:#0f0d16;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--xp);transition:width .4s}
.bar.hp i{background:var(--hp)}
.bar.gold i{background:var(--gold)}

/* Runner Stage */
.strip{position:relative;max-width:560px;margin:10px auto 0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0f0d16;height:220px}
.strip canvas{display:block;width:100%;height:180px;image-rendering:pixelated}
.hud{position:absolute;inset:8px 8px auto 8px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none;text-shadow:0 1px 0 #000;font-size:12px}
.hud .who{display:flex;gap:8px;align-items:center;background:rgba(15,13,22,.72);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 8px;min-width:0}
.hud .lv{font-family:var(--display);font-size:12px;background:var(--panel2);border-radius:5px;padding:2px 6px;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:3px;width:clamp(110px,26vw,190px)}
.bars .nm{font-weight:700;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:9px;background:#0f0d16;border:1px solid #000;border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;transition:width .12s}
.bar.hp i{background:linear-gradient(#ff8a8a,var(--hp))}
.bar.sp i{background:linear-gradient(#bfe6ff,var(--sp))}
.bar.xp{height:4px}
.bar.xp i{background:var(--xp)}
.bar span{position:absolute;inset:0;font-size:8px;line-height:9px;text-align:center;font-weight:700;letter-spacing:.02em}
.hud .where{display:flex;flex-direction:column;align-items:flex-end;gap:4px;background:rgba(15,13,22,.72);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 8px;text-align:right}
.where b{font-family:var(--display);font-size:14px}
.where small{font-size:11px;color:#d9cfe8}
.gold{display:flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums}
.gold i{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #b8862a}
.toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);background:var(--gold);color:#241a05;font-family:var(--display);font-size:16px;padding:6px 14px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.5);pointer-events:none;white-space:nowrap;z-index:10}

/* Skillbar abaixo do canvas */
.skillbar{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:6px;padding:6px;background:var(--panel)}
.sk{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 4px;border-radius:8px;border:1px solid var(--line);background:var(--panel);overflow:hidden;min-width:0}
.sk .ic{width:24px;height:24px;image-rendering:pixelated}
.sk b{font-size:11px;font-weight:700;text-align:center;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.sk small{font-size:10px;color:var(--mute);font-variant-numeric:tabular-nums}
.sk .key{position:absolute;left:4px;top:2px;font-family:var(--display);font-size:10px;color:var(--mute)}
.sk .cd{position:absolute;inset:0;background:conic-gradient(rgba(10,8,16,.78) var(--p,0%),transparent 0);pointer-events:none}
.sk .cdt{position:absolute;inset:0 0 auto 0;height:34px;display:grid;place-items:center;font-family:var(--display);font-size:16px;text-shadow:0 2px 0 #000;pointer-events:none}
.sk.nosp{border-color:#4a3a6a}.sk.nosp b{color:var(--mute)}
.sk.flash{animation:fl .35s}
@keyframes fl{0%{box-shadow:inset 0 0 0 2px var(--gold)}100%{box-shadow:none}}
.auto{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:11px;font-weight:700;text-align:center}
.auto[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}

main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);font-weight:600}
.note{background:#0f0d16;border:1px dashed var(--line);border-radius:8px;padding:10px;font-size:13px;color:var(--mute)}
.note b{color:var(--ink)}

.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px 14px;font-weight:600}
.btn:hover{border-color:var(--mute)}
.btn.main{background:var(--gold);color:#241a05;border-color:#b8862a;box-shadow:0 3px 0 #9b6f1c;font-family:var(--display);font-size:16px}
.btn.main:active{transform:translateY(2px);box-shadow:0 1px 0 #9b6f1c}
.btn.red{background:var(--hp);color:#fff;border-color:#a83a3c;box-shadow:0 3px 0 #85292b;font-family:var(--display);font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:6px 10px;font-size:13px}
.x{background:none;border:0;color:var(--mute);font-size:18px;padding:4px 6px;line-height:1}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c,var(--mute))}
.c-str{--c:var(--str)}.c-int{--c:var(--int)}.c-dis{--c:var(--dis)}.c-cre{--c:var(--cre)}
.chip.bad{border-color:var(--hp);color:#ffb3b4}
.chip.good{border-color:var(--ok)}

.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.task.done{opacity:.6}
.task.done .tt{text-decoration:line-through}
.check{width:40px;height:40px;border-radius:8px;border:2px solid var(--c,var(--line));background:#0f0d16;display:grid;place-items:center}
.check svg{width:22px;height:22px;stroke:var(--c);stroke-width:3;fill:none;opacity:0}
.task.done .check{background:var(--c)}
.task.done .check svg{opacity:1;stroke:#14121d}
.tbody{min-width:0;display:flex;flex-direction:column;gap:4px}
.tt{font-weight:500;overflow-wrap:anywhere}
.tmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mute)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum{background:var(--panel2);border-radius:8px;padding:8px 10px}
.sum b{display:block;font-family:var(--display);font-size:20px}
.focus-time{font-family:var(--display);font-size:44px;text-align:center;line-height:1;padding:6px 0}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 4px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.cat i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.cat[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--panel2))}
details summary{cursor:pointer;font-weight:600;color:var(--gold);list-style:none}
details summary::-webkit-details-marker{display:none}
form.add{display:grid;gap:8px;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 120px;min-width:0}
input,select{background:#0f0d16;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.goal{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.goal.won{border-color:var(--gold)}
.goal-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.goal-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.goal-act input{width:70px;padding:6px 8px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{background:none;border:0;border-radius:7px;padding:8px 4px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--gold)}
.hero{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.stage{background:radial-gradient(circle at 50% 80%,#3a3354 0,#1a1726 70%);border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;aspect-ratio:1;max-width:100%}
canvas{image-rendering:pixelated;display:block;max-width:100%}
.clsname{font-family:var(--display);color:var(--gold);font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel2);border-radius:8px;padding:10px;border-left:3px solid var(--c)}
.stat b{font-family:var(--display);font-size:22px;display:block}
.stat small{color:var(--mute);font-size:12px}
.combat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.combat div{background:#0f0d16;border-radius:8px;padding:8px 2px}
.combat b{font-family:var(--display);font-size:18px;display:block}
.combat small{font-size:11px;color:var(--mute)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.item>div{min-width:0;display:flex;flex-direction:column;gap:3px}
.item.on{border-color:var(--gold)}
.item.locked{opacity:.75}
.item-n{font-weight:600}
.item-s{font-size:12px;color:var(--mute)}
.slot-tag{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--gold)}
.reqs{display:flex;gap:4px;flex-wrap:wrap}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button{flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--mute)}
.filters button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

.pts{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pts b{font-family:var(--display);font-size:28px;color:var(--gold)}
.cls{border-top:3px solid var(--c)}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#0f0d16;border:1px solid var(--line);color:var(--mute)}
.pill.on{border-color:var(--ok);color:var(--ok)}
.tree{list-style:none;margin:0;padding:0 0 0 14px;display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--line)}
.node{position:relative;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.node::before{content:"";position:absolute;left:-21px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:3px;background:var(--bg);border:2px solid var(--line)}
.node.own{border-color:var(--c)}
.node.own::before{background:var(--c);border-color:var(--c)}
.node.off{opacity:.55}
.node>div{min-width:0;display:flex;flex-direction:column;gap:2px}
.node b{font-weight:600}
.node small{color:var(--mute);font-size:12px}

.tower{display:flex;flex-direction:column;gap:4px}
.floor{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;background:#0f0d16;border:1px solid var(--line);font-family:var(--display);font-size:14px}
.floor.cur{background:color-mix(in srgb,var(--hp) 20%,var(--panel2));border-color:var(--hp)}
.floor.clr{color:var(--mute)}
.floor.boss span:first-child::after{content:" · chefe";color:var(--hp)}
.floor .who{font-family:var(--body);font-size:11px;color:var(--gold);text-align:right}
.mob{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}

.rank{display:flex;flex-direction:column;gap:6px}
.rk{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:8px;padding:8px 10px}
.rk.me{border:1px solid var(--gold)}
.rk .pos{font-family:var(--display);font-size:18px;color:var(--mute)}
.rk:first-child .pos{color:var(--gold)}
.rk .tbody span{font-size:12px}
.fl{font-family:var(--display);white-space:nowrap}
.duel{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:8px;padding:8px 10px}
.duel canvas{width:44px;height:auto}
.steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);padding:4px 0;border-radius:8px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--gold);background:var(--panel2)}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,6,14,.82);display:grid;place-items:center;padding:16px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.fighter{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.fighter .nm{font-family:var(--display);font-size:13px;overflow-wrap:anywhere}
.fighter .bar{width:100%}
.fighter small{font-size:12px}
.vs{font-family:var(--display);color:var(--hp);font-size:20px}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.blog{background:#0f0d16;border-radius:8px;padding:10px;height:140px;overflow:auto;font-size:13px;display:flex;flex-direction:column-reverse;gap:2px}
.result{font-family:var(--display);font-size:22px;text-align:center}
.result.win{color:var(--ok)}.result.lose{color:var(--hp)}
.rewards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.toast-ui{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--panel2);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast-ui.lvl{background:var(--gold);color:#241a05;font-family:var(--display);font-size:17px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);background:var(--sw);padding:0}
.sw button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--bg) inset}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.styles button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--mute)}
.styles button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.mis{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.mis.on{border-color:var(--c)}
.mis>div{min-width:0;display:flex;flex-direction:column;gap:4px}
.wk{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.wk.ready{border-color:var(--gold)}
.wk.claimed{opacity:.6}
.cp{display:flex;gap:8px;flex-wrap:wrap}
.cp .chip{font-size:12px}
.btns{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.four button{font-size:13px;padding:8px 2px}
.ctiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ctile{border:1px solid var(--line);border-top:3px solid var(--c);background:var(--panel2);border-radius:8px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.ctile b{font-family:var(--display);font-size:14px}
.ctile small{font-size:11px;color:var(--mute)}
.ctile.on small.st{color:var(--ok)}
.ctile[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 22%,var(--panel2));border-color:var(--c)}
.tiers{display:flex;flex-direction:column;gap:0}
.tier{display:flex;flex-direction:column;gap:6px}
.tier-h{display:flex;justify-content:space-between;align-items:center}

.pathbtn{display:flex;flex-direction:column;gap:4px;text-align:left;border:2px solid var(--pc);background:color-mix(in srgb,var(--pc) 14%,var(--panel2));border-radius:10px;padding:12px}
.pathbtn b{font-family:var(--display);font-size:17px;color:var(--pc)}
.pathbtn span{font-size:13px;color:var(--mute)}
.ranks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

.rank-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rank-h b{font-family:var(--display);font-size:15px}
.req{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12px;align-items:center}
.req .bar{grid-column:1/-1;height:6px}
.req .bar i{background:var(--c)}
.cnt{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:var(--panel2);border-radius:8px;padding:10px}

.secmap{display:flex;flex-direction:column;gap:4px}

.sec.cur{border-color:var(--gold)}

.sec i{width:12px;height:12px;border-radius:3px;background:var(--sc)}
.homebar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--gold) 12%,var(--panel));border:1px dashed var(--gold);border-radius:10px;padding:10px 12px;font-size:13px}
.luck{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;background:color-mix(in srgb,var(--cre) 12%,var(--panel));border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.luck b{font-size:16px;color:var(--cre)}
.luck small{color:var(--mute);font-size:12px;flex-basis:100%}
.addrow{display:flex;gap:8px;align-items:center}

.cnt2{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border-radius:8px;padding:10px}

.branches.two{grid-template-columns:1fr 1fr}
.branch{display:flex;flex-direction:column;min-width:0}

.br-h b{font-family:var(--display);font-size:15px}
.br-h small{font-size:11px;color:var(--mute)}
.tier-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:0 0 4px 2px}
.gap4{height:6px}
.sn-h{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.lvl{font-size:12px;color:var(--gold);font-weight:700}
.why{color:#ffb3b4}
.clsgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clsopt{border:1px solid var(--line);border-top:3px solid var(--c);background:var(--panel2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.clsopt b{font-family:var(--display);font-size:15px}
.clsopt small{font-size:11px}
.fl-txt.sk{font-family:var(--display);font-size:14px;animation-duration:1.1s}
.fl-txt.crit{font-size:15px;color:#ffe066}
.fl-txt.hurt{color:#ff8a8a}
.fl-txt.heal{color:#5fcf8a}
.fl-txt.burn{color:#ff8a3a}
.fl-txt.dodge{color:#c58cff}
.fl-txt.gold{color:#f2c14e}
.arena{position:relative}
.bfx{position:absolute;inset:0;pointer-events:none}
.lungeR{animation:lungeR .3s ease-out}
.lungeL{animation:lungeL .3s ease-out}
@keyframes lungeR{40%{transform:translateX(18px)}}
@keyframes lungeL{40%{transform:translateX(-18px)}}
.hitf canvas{animation:hitf .28s}
@keyframes hitf{0%,40%{filter:brightness(3) saturate(0)}100%{filter:none}}
.hitf{animation:shake .25s}
.bigshake{animation:bigshake .35s}
@keyframes bigshake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
.bnum{position:absolute;transform:translateX(-50%);font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;white-space:nowrap;animation:bpop .9s forwards}
.bnum.crit{color:#ffe066;font-size:24px}
.bnum.heal{color:#5fcf8a}
.bnum.burn{color:#ff8a3a}
.bnum.dodge{color:#c58cff;font-size:15px}
.bnum.stun{color:#ffe066;font-size:14px}
@keyframes bpop{0%{transform:translate(-50%,6px) scale(.5);opacity:0}20%{transform:translate(-50%,-4px) scale(1.25);opacity:1}100%{transform:translate(-50%,-38px) scale(1);opacity:0}}
.sbanner{position:absolute;left:50%;top:-10px;transform:translateX(-50%);padding:4px 14px;border-radius:999px;font-family:var(--display);font-size:16px;background:var(--bc);color:#14121d;white-space:nowrap;box-shadow:0 0 18px var(--bc);animation:bnr 1s forwards;z-index:2}
@keyframes bnr{0%{transform:translate(-50%,10px) scale(.5);opacity:0}15%{transform:translate(-50%,0) scale(1.12);opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
.proj{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:radial-gradient(circle,#fff6c8,var(--pc) 55%,transparent 72%);box-shadow:0 0 14px var(--pc);animation:proj .32s linear forwards}
@keyframes proj{from{left:var(--x0)}to{left:var(--x1)}}
.boom{position:absolute;width:10px;height:10px;border-radius:50%;border:3px solid var(--pc);transform:translate(-50%,-50%);animation:boom .45s ease-out forwards}
@keyframes boom{to{width:80px;height:80px;opacity:0}}
.meteor{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff,#ff8a3a 50%,#c8461f);box-shadow:0 0 16px #ff6a2a;animation:meteor .4s ease-in forwards}
@keyframes meteor{from{transform:translate(50px,-90px)}to{transform:translate(0,0)}}
.slash{position:absolute;width:44px;height:4px;margin-left:-22px;background:linear-gradient(90deg,transparent,var(--pc),transparent);border-radius:4px;transform:rotate(-35deg);box-shadow:0 0 8px var(--pc);animation:slash .3s ease-out forwards}
@keyframes slash{0%{opacity:0;transform:rotate(-35deg) scaleX(.2)}30%{opacity:1;transform:rotate(-35deg) scaleX(1.1)}100%{opacity:0;transform:rotate(-35deg) scaleX(1)}}
.ring{position:absolute;width:60px;height:60px;border-radius:50%;border:3px solid var(--pc);transform:translate(-50%,-50%);animation:ring .6s forwards}
@keyframes ring{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}

.needs{display:flex;gap:6px;flex-wrap:wrap}

<body>
<header class="top">
  <div class="top-in">
    <div class="lv">Nv <b id="hLv" class="num">1</b></div>
    <div class="top-mid">
      <div class="top-name"><span class="sync" id="hSync" title="Salvo só neste aparelho"></span><span id="hName">Herói</span></div>
      <div class="bar"><i id="hXp" style="width:0%"></i></div>
    </div>
    <div class="coins">
      <span class="coin" title="Sequência de dias"><span class="fire"></span><span id="hStreak" class="num">0</span></span>
      <span class="coin" title="Ouro"><span class="dot"></span><span id="hGold" class="num">0</span></span>
    </div>
  </div>
  
  <!-- ===== RUNNER INTEGRADO ===== -->
  <div class="strip" id="stripBox">
    <canvas id="game" width="480" height="270" aria-label="Herói correndo e lutando contra monstros"></canvas>
    <div class="hud">
      <div class="who">
        <span class="lv">Nv <b id="rLv">1</b></span>

          <div class="bar sp"><i id="rSp"></i><span id="tSp">60/60</span></div>
          <div class="bar xp"><i id="rXp" style="width:0%"></i></div>
        </div>
      </div>
      <div class="where">
        <b id="rCity">Alvorada</b><small id="rMap">Campos do Despertar</small>
        <span class="gold"><i></i><span id="rGold">0</span></span>
      </div>
    </div>
    <div class="toast" id="toast" hidden></div>
    
    <!-- Ações do runner -->
    <div style="position:absolute; right:6px; bottom:6px; display:flex; gap:4px; pointer-events:auto;">
      <button class="sbtn" id="bMission" type="button" style="font-size:10px; padding:4px 6px;">Missão</button>
      <button class="sbtn" id="bFocus" type="button" style="font-size:10px; padding:4px 6px;">Foco</button>
    </div>
  </div>

  <!-- Skillbar do Runner -->
  <div class="skillbar" id="skillbar" style="max-width:560px; margin:0 auto;"></div>
</header>
