<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#201c2f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Torre da Disciplina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-title" content="Torre">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: app de celular — barra de status do herói no topo, conteúdo rolável, abas fixas embaixo. Tema único noturno de masmorra. */
:root{
  --bg:#14121d; --panel:#201c2f; --panel2:#2a2540; --line:#3a3354;
  --ink:#f1ead9; --mute:#a7a0bb;
  --gold:#f2c14e; --xp:#6ec6ff; --hp:#e8585a; --ok:#5fcf8a;
  --str:#ff8a5c; --int:#6ec6ff; --dis:#f2c14e; --cre:#c58cff;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:20px}
h3{font-size:17px}
p{margin:0}
.mute{color:var(--mute)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.lv{font-family:var(--display);font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;white-space:nowrap}
.lv b{color:var(--xp);font-size:17px}
.top-mid{min-width:0;display:flex;flex-direction:column;gap:3px}
.top-name{font-family:var(--display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.sync{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none}
.sync.on{background:var(--ok)}.sync.err{background:var(--hp)}
.coins{display:flex;gap:10px;align-items:center;font-family:var(--display);font-size:15px}
.coin{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #b8862a}
.fire{width:9px;height:12px;background:var(--str);clip-path:polygon(50% 0,100% 60%,80% 100%,20% 100%,0 60%)}
.bar{height:8px;background:#0f0d16;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--xp);transition:width .4s}
.bar.hp i{background:var(--hp)}
.bar.gold i{background:var(--gold)}

main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);font-weight:600}
.note{background:#0f0d16;border:1px dashed var(--line);border-radius:8px;padding:10px;font-size:13px;color:var(--mute)}
.note b{color:var(--ink)}

.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px 14px;font-weight:600}
.btn:hover{border-color:var(--mute)}
.btn.main{background:var(--gold);color:#241a05;border-color:#b8862a;box-shadow:0 3px 0 #9b6f1c;font-family:var(--display);font-size:16px}
.btn.main:active{transform:translateY(2px);box-shadow:0 1px 0 #9b6f1c}
.btn.red{background:var(--hp);color:#fff;border-color:#a83a3c;box-shadow:0 3px 0 #85292b;font-family:var(--display);font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:6px 10px;font-size:13px}
.x{background:none;border:0;color:var(--mute);font-size:18px;padding:4px 6px;line-height:1}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c,var(--mute))}
.c-str{--c:var(--str)}.c-int{--c:var(--int)}.c-dis{--c:var(--dis)}.c-cre{--c:var(--cre)}
.chip.bad{border-color:var(--hp);color:#ffb3b4}
.chip.good{border-color:var(--ok)}

.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.task.done{opacity:.6}
.task.done .tt{text-decoration:line-through}
.check{width:40px;height:40px;border-radius:8px;border:2px solid var(--c,var(--line));background:#0f0d16;display:grid;place-items:center}
.check svg{width:22px;height:22px;stroke:var(--c);stroke-width:3;fill:none;opacity:0}
.task.done .check{background:var(--c)}
.task.done .check svg{opacity:1;stroke:#14121d}
.tbody{min-width:0;display:flex;flex-direction:column;gap:4px}
.tt{font-weight:500;overflow-wrap:anywhere}
.tmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mute)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum{background:var(--panel2);border-radius:8px;padding:8px 10px}
.sum b{display:block;font-family:var(--display);font-size:20px}
.focus-time{font-family:var(--display);font-size:44px;text-align:center;line-height:1;padding:6px 0}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 4px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.cat i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.cat[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--panel2))}
details summary{cursor:pointer;font-weight:600;color:var(--gold);list-style:none}
details summary::-webkit-details-marker{display:none}
form.add{display:grid;gap:8px;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 120px;min-width:0}
input,select{background:#0f0d16;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.goal{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.goal.won{border-color:var(--gold)}
.goal-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.goal-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.goal-act input{width:70px;padding:6px 8px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{background:none;border:0;border-radius:7px;padding:8px 4px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--gold)}
.hero{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.stage{background:radial-gradient(circle at 50% 80%,#3a3354 0,#1a1726 70%);border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;aspect-ratio:1;max-width:100%}
canvas{image-rendering:pixelated;display:block;max-width:100%}
.clsname{font-family:var(--display);color:var(--gold);font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel2);border-radius:8px;padding:10px;border-left:3px solid var(--c)}
.stat b{font-family:var(--display);font-size:22px;display:block}
.stat small{color:var(--mute);font-size:12px}
.combat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.combat div{background:#0f0d16;border-radius:8px;padding:8px 2px}
.combat b{font-family:var(--display);font-size:18px;display:block}
.combat small{font-size:11px;color:var(--mute)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.item>div{min-width:0;display:flex;flex-direction:column;gap:3px}
.item.on{border-color:var(--gold)}
.item.locked{opacity:.75}
.item-n{font-weight:600}
.item-s{font-size:12px;color:var(--mute)}
.slot-tag{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--gold)}
.reqs{display:flex;gap:4px;flex-wrap:wrap}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button{flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--mute)}
.filters button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

.pts{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pts b{font-family:var(--display);font-size:28px;color:var(--gold)}
.cls{border-top:3px solid var(--c)}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#0f0d16;border:1px solid var(--line);color:var(--mute)}
.pill.on{border-color:var(--ok);color:var(--ok)}
.tree{list-style:none;margin:0;padding:0 0 0 14px;display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--line)}
.node{position:relative;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.node::before{content:"";position:absolute;left:-21px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:3px;background:var(--bg);border:2px solid var(--line)}
.node.own{border-color:var(--c)}
.node.own::before{background:var(--c);border-color:var(--c)}
.node.off{opacity:.55}
.node>div{min-width:0;display:flex;flex-direction:column;gap:2px}
.node b{font-weight:600}
.node small{color:var(--mute);font-size:12px}

.tower{display:flex;flex-direction:column;gap:4px}
.floor{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;background:#0f0d16;border:1px solid var(--line);font-family:var(--display);font-size:14px}
.floor.cur{background:color-mix(in srgb,var(--hp) 20%,var(--panel2));border-color:var(--hp)}
.floor.clr{color:var(--mute)}
.floor.boss span:first-child::after{content:" · chefe";color:var(--hp)}
.floor .who{font-family:var(--body);font-size:11px;color:var(--gold);text-align:right}
.mob{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}

.rank{display:flex;flex-direction:column;gap:6px}
.rk{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:8px;padding:8px 10px}
.rk.me{border:1px solid var(--gold)}
.rk .pos{font-family:var(--display);font-size:18px;color:var(--mute)}
.rk:first-child .pos{color:var(--gold)}
.rk .tbody span{font-size:12px}
.fl{font-family:var(--display);white-space:nowrap}
.duel{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:8px;padding:8px 10px}
.duel canvas{width:44px;height:auto}
.steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);padding:4px 0;border-radius:8px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--gold);background:var(--panel2)}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,6,14,.82);display:grid;place-items:center;padding:16px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.fighter{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.fighter .nm{font-family:var(--display);font-size:13px;overflow-wrap:anywhere}
.fighter .bar{width:100%}
.fighter small{font-size:12px}
.vs{font-family:var(--display);color:var(--hp);font-size:20px}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.blog{background:#0f0d16;border-radius:8px;padding:10px;height:140px;overflow:auto;font-size:13px;display:flex;flex-direction:column-reverse;gap:2px}
.result{font-family:var(--display);font-size:22px;text-align:center}
.result.win{color:var(--ok)}.result.lose{color:var(--hp)}
.rewards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--panel2);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.lvl{background:var(--gold);color:#241a05;font-family:var(--display);font-size:17px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);background:var(--sw);padding:0}
.sw button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--bg) inset}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.styles button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--mute)}
.styles button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.mis{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.mis.on{border-color:var(--c)}
.mis>div{min-width:0;display:flex;flex-direction:column;gap:4px}
.wk{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.wk.ready{border-color:var(--gold)}
.wk.claimed{opacity:.6}
.cp{display:flex;gap:8px;flex-wrap:wrap}
.cp .chip{font-size:12px}
.btns{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.four button{font-size:13px;padding:8px 2px}
.ctiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ctile{border:1px solid var(--line);border-top:3px solid var(--c);background:var(--panel2);border-radius:8px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.ctile b{font-family:var(--display);font-size:14px}
.ctile small{font-size:11px;color:var(--mute)}
.ctile.on small.st{color:var(--ok)}
.ctile[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 22%,var(--panel2));border-color:var(--c)}
.tiers{display:flex;flex-direction:column;gap:0}
.tier{display:flex;flex-direction:column;gap:6px}
.tier-h{display:flex;justify-content:space-between;align-items:center}
.tier-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.link{width:2px;height:16px;margin:4px auto;background:var(--line)}
.link.on{background:var(--c)}
.snode{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.snode b{font-weight:600;font-size:14px}
.snode small{color:var(--mute);font-size:12px;flex:1}
.snode.own{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel2))}
.snode.lock{opacity:.5}
.item{border-left:3px solid var(--rc,var(--line))}
.item-n{color:var(--rc,var(--ink))}
.r-c{--rc:#b9b2c9}.r-r{--rc:#6ec6ff}.r-e{--rc:#c58cff}.r-l{--rc:#f2c14e}
.rar{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--rc)}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.delta{font-size:12px;font-weight:600}
.delta.up{color:var(--ok)}.delta.down{color:var(--hp)}
.or{text-align:center;color:var(--mute);font-size:13px}
.linkbtn{background:none;border:0;color:var(--gold);font-weight:600;padding:4px;text-decoration:underline}
.err{color:#ffb3b4;font-size:13px;min-height:1em;text-align:center}
.ico{width:28px;height:28px;image-rendering:pixelated;object-fit:contain;background:#0f0d16;border-radius:6px;border:1px solid var(--line);flex:none}
.ico.big{width:56px;height:56px}
.iline{display:flex;gap:10px;align-items:center;min-width:0}
.iline>div{min-width:0;display:flex;flex-direction:column;gap:3px;flex:1}
.item>.iline,.mrow>.iline{flex-direction:row;align-items:center}
.mbtn{border:1px solid var(--gold);background:none;color:var(--gold);border-radius:6px;padding:3px 8px;font-family:var(--display);font-size:13px}
.evb{background:color-mix(in srgb,var(--ec) 22%,var(--panel));border:1px solid var(--ec);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.evb h2{color:var(--ink)}
.seg.five{grid-template-columns:repeat(5,1fr)}
.seg.five button{font-size:12px;padding:8px 2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fl2{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:12px;color:var(--mute);font-weight:600}
.fl2.full{grid-column:1/-1}
.fl2 input,.fl2 select{font-size:15px;color:var(--ink);font-weight:400}
.fl2 input[type=color]{height:42px;padding:4px}
.ck{display:flex;gap:8px;align-items:center;font-size:14px;grid-column:1/-1}
.ck input{width:auto}
.imgrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.imgrow input{flex:1 1 160px;font-size:13px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.mrow .acts{flex-direction:row;flex-wrap:wrap;justify-content:flex-end}
.pill.warn{border-color:var(--gold);color:var(--gold)}
.tabs.six{grid-template-columns:repeat(6,1fr)}
.ico{width:32px;height:32px;image-rendering:pixelated;object-fit:contain;flex:none;background:#0f0d16;border-radius:6px}
.ico.lg{width:64px;height:64px}
.iname{display:flex;gap:8px;align-items:center;min-width:0}

  const b=fresh();
  for(const k of Object.keys(b))if(o[k]===undefined)o[k]=b[k];
  if(Array.isArray(o.skills))o.skills={};
  o.eq=o.eq||{};for(const k of Object.keys(SLOTS))if(!(k in o.eq))o.eq[k]=null;

  o.maxSec=Math.max(o.maxSec||0,o.sec||0);

}

async function connectClaude(){

  let db,user;
  try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){return}
  if(!db||!user)return;
  const cfgRef=db.doc('game/config'),sprRef=db.doc('game/sprites');
  cfgRef.onSnapshot(sn=>onConfig(sn.exists?sn.data():null),()=>{});
  sprRef.onSnapshot(sn=>onSprites(sn.exists?sn.data():null),()=>{});
  net.gapi={setCfg:o=>cfgRef.set(o),setSpr:o=>sprRef.set(o)};
  const id=await user.id();
  setMaster(await user.isOwner());
  if(!id)return;
  net.mode='claude';net.id=id;
  const saveRef=db.doc('data/users/'+id+'/save'),pubRef=db.doc('players/'+id);
  net.api={
    get:async()=>{const sn=await saveRef.get();return sn.exists?sn.data():null},
    set:o=>saveRef.set(o),pub:o=>pubRef.set(o),
    watch:cb=>db.collection('players').orderBy('cleared','desc').limit(100).onSnapshot(sn=>cb(sn.docs.map(d=>[d.id,d.data()])),()=>{})
  };
  try{await startSync()}catch(e){setStatus('err')}
}

function draw(cv,grid,pal,scale){
  const w=grid[0].length,h=grid.length;cv.width=w*scale;cv.height=h*scale;
  const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);
  grid.forEach((row,j)=>[...row].forEach((ch,i)=>{const c=pal[ch];if(!c)return;x.fillStyle=c;x.fillRect(i*scale,j*scale,scale,scale)}));
}
const imgCache=new Map();
function drawPng(cv,url,box){
  const paint=img=>{const k=Math.max(1,Math.floor(box/Math.max(img.width,img.height)));cv.width=img.width*k;cv.height=img.height*k;const x=cv.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(img,0,0,cv.width,cv.height)};
  let img=imgCache.get(url);if(img&&img.complete){paint(img);return}
  if(!img){img=new Image();img.src=url;imgCache.set(url,img)}
  img.addEventListener('load',()=>paint(img),{once:true});
}
function mobDraw(cv,m,scale){
  if(m.png&&okPng(m.png)){drawPng(cv,m.png,12*scale);return}
  const src=shapeCanvas(m.shape,m.color,m.elite,m.boss,scale);cv.width=src.width;cv.height=src.height;cv.getContext('2d').drawImage(src,0,0);
}

function offBonus(){const fx=skillFx();return{all:(1+(fx.idlePct||0))*SET.idle*evMult('idle'),gold:1+(eqItems().reduce((a,i)=>a+(+i.goldPct||0),0))/100}}

  </section>

      <div class="tbody" style="gap:6px">

function render(){

const MOB_SKN={opener:'Investida Brutal',poison:'Veneno',regen:'Regeneração',double:'Ataque Duplo',stun:'Golpe Atordoante',reflect:'Espinhos',block:'Barreira',dodge:'Esquiva',lifesteal:'Drenar Vida',meteor:'Chuva de Fogo',counter:'Revide',triple:'Golpe Triplo',execute:'Golpe Final'};
function simulate(A,B){
  const P={A,B},H={A:A.hp,B:B.hp},blk={A:!!A.fx.block,B:!!B.fx.block},stun={A:false,B:false},pois={A:0,B:0},fr=[];
  const sk=(k,key)=>(P[k].skn&&P[k].skn[key])||(k==='B'?MOB_SKN[key]:'')||'';
  const push=(t,who,m)=>fr.push({ah:Math.max(0,Math.round(H.A)),bh:Math.max(0,Math.round(H.B)),t,who,m});
  const dead=()=>H.A<=0||H.B<=0;
  push(`${A.name} enfrenta ${B.name}`);
  function strike(xk,yk,mult,kind,noCounter,spell){
    const x=P[xk],y=P[yk];
    if(!spell){
      if(y.fx.dodge&&Math.random()<Math.min(.5,y.fx.dodge)){push(`${y.name} se esquivou`,null,{k:'dodge',a:yk,t:xk,sk:sk(yk,'dodge')});return}
      if(blk[yk]){blk[yk]=false;push(`${y.name} bloqueou o golpe`,null,{k:'block',a:yk,t:xk,sk:sk(yk,'block')});return}
    }
    let m=mult,exe=false;const xr=H[xk]/x.hp;
    if(x.fx.rage&&xr<0.3)m*=1+x.fx.rage;
    if(x.fx.wild&&xr<0.5)m*=1+x.fx.wild;
    if(x.fx.execute&&H[yk]/y.hp<0.25){m*=2;exe=true}
    let def=spell?0:y.def*(x.fx.pierce?0.5:1);
    if(y.fx.wild&&H[yk]/y.hp<0.5)def*=1+y.fx.wild;
    let d=x.atk*m*(0.85+Math.random()*0.3)-def*0.5,crit=false,tri=false;
    if(Math.random()*100<x.crit){d*=x.fx.critMult||1.8;crit=true}
    if(x.fx.triple&&Math.random()<x.fx.triple){d*=3;tri=true}
    d=Math.max(1,Math.round(d));H[yk]-=d;
    const k=kind||(tri?'triple':exe?'execute':'hit'),name=k==='hit'?'':sk(xk,k);
    const label={opener:`${name||'Golpe de abertura'} de ${x.name}:`,meteor:`${name||'Meteoro'} de ${x.name}:`,double:`${name||'Ataque extra'} de ${x.name}:`,counter:`${x.name} revida:`,triple:`${name||'Golpe triplo'} de ${x.name}:`,execute:`${name||'Golpe final'} de ${x.name}:`}[k]||`${x.name} causa`;
    push(`${label} ${d} de dano${crit?' (crítico!)':''}`,yk,{k,a:xk,t:yk,d,crit,sk:name});
    if(x.fx.lifesteal&&H[xk]>0){const h=Math.min(Math.round(d*x.fx.lifesteal),Math.round(x.hp-H[xk]));if(h>0){H[xk]+=h;push(`${x.name} drena ${h} de vida`,null,{k:'heal',a:xk,t:xk,d:h,sk:sk(xk,'lifesteal')})}}
    if(H[yk]>0&&y.fx.reflect){const r=Math.round(d*y.fx.reflect);if(r>0){H[xk]-=r;push(`${y.name} devolve ${r} de dano`,xk,{k:'reflect',a:yk,t:xk,d:r,sk:sk(yk,'reflect')})}}
    if(dead())return;
    if(x.fx.poison&&!pois[yk]){pois[yk]=Math.max(1,Math.round(x.atk*x.fx.poison));push(`${y.name} está queimando (${pois[yk]} por turno)`,null,{k:'poison',a:xk,t:yk,sk:sk(xk,'poison')})}
    if(x.fx.stun&&!stun[yk]&&Math.random()<x.fx.stun){stun[yk]=true;push(`${y.name} ficou atordoado`,null,{k:'stun',a:xk,t:yk,sk:sk(xk,'stun')})}
    if(!noCounter&&y.fx.counter&&Math.random()<y.fx.counter)strike(yk,xk,0.7,'counter',true);
  }
  function turn(xk,yk,n){
    const x=P[xk];
    if(pois[xk]){H[xk]-=pois[xk];push(`${x.name} sofre ${pois[xk]} de dano contínuo`,xk,{k:'burn',a:yk,t:xk,d:pois[xk]});if(dead())return}
    if(stun[xk]){stun[xk]=false;push(`${x.name} perde o turno`,null,{k:'stunned',a:xk,t:xk});return}
    if(n===0&&x.fx.opener){strike(xk,yk,x.fx.opener,'opener',true,true);if(dead())return}
    if(x.fx.meteor&&n%4===3)strike(xk,yk,x.fx.meteor,'meteor',true,true);else strike(xk,yk,1);
    if(dead())return;
    if(x.fx.double&&Math.random()<Math.min(.7,x.fx.double)){strike(xk,yk,1,'double');if(dead())return}
    if(x.fx.regen){const h=Math.round(x.hp*x.fx.regen),nh=Math.min(x.hp,H[xk]+h);if(nh>H[xk]){const g=Math.round(nh-H[xk]);H[xk]=nh;push(`${x.name} recupera ${g} de vida`,null,{k:'heal',a:xk,t:xk,d:g,sk:sk(xk,'regen')})}}
  }
  for(let n=0;n<50&&!dead();n++){turn('A','B',n);if(dead())break;turn('B','A',n)}
  return{win:(H.B<=0&&H.A>0)||(H.A>0&&H.B>0&&H.A/A.hp>H.B/B.hp),fr};
}

function checkIdle(){
  const now=Date.now(),el=now-(s.lastSeen||now);s.lastSeen=now;
  if(el<5*60000||!s.path||!s.onboarded){saveLocal();return}
  rolls();
  const cap=(eqItems().some(i=>i.idleH)?12:8)*3600000,t=Math.min(el,cap),h=t/3600000,welcome=s.welcome;s.welcome=false;
  const hh=Math.floor(h),mm=Math.round((h-hh)*60),dur=`${hh?hh+'h ':''}${mm}min`;
  let body;
  if(s.atHome){
    body=`<p class="mute">Seu herói passou ${dur} descansando em casa. Volte para a torre para ele caçar enquanto você está longe do celular.</p>`;
  }else{
    const ob=offBonus(),K=Math.floor(h*KH_OFF*ob.all),f0=s.floor;let left=K,fell=false;
    while(left>=SET.kpf&&s.floor<secTop()){
      const m=monster(s.floor,'mob'),sim=simulate(meFighter(),{name:m.name,...m.c,fx:m.fx});
      if(!sim.win){fell=true;if(s.floor>secStart())s.floor--;break}
      left-=SET.kpf;s.best=Math.max(s.best,s.floor);s.floor++;bump('floors');
    }
    s.kills=0;
    const rw=killReward(s.floor,false),g=addGold(K*rw.g*1.3*ob.gold),x=gainXP(K*rw.x*1.3,true);
    const exp=K*(0.15*0.05+0.002)*luck();let nd=Math.min(4,Math.floor(exp)+(Math.random()<exp%1?1:0));const drops=[];
    while(nd-->0){const d=rollDrop(s.floor,Math.random()<0.75?'elite':'mob');if(d){s.owned.push(d);drops.push(d)}}
    const moved=s.floor-f0;
    body=`<p class="mute">Em ${dur} longe do celular, o herói derrotou <b style="color:var(--ink)">${fmt(K)} monstros</b>.</p>
      <p>${moved>0?`Subiu do andar ${f0} para o ${s.floor}.`:fell?`Encontrou monstros fortes demais e ficou no andar ${s.floor}.`:s.floor>=secTop()?`Está no andar ${s.floor}, esperando você enfrentar o chefe.`:`Continua no andar ${s.floor}.`}</p>
      ${chips(x,g,dropChips(drops))}`;
  }
  save();
  $('mBody').innerHTML=`<div style="display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center"><canvas id="cIdle"></canvas><h2>${welcome?'Bem-vindo à Torre':'Enquanto você estava fora'}</h2>${body}
    ${welcome?'<p class="mute small">Dica: compre equipamento de iniciante na loja e registre suas metas de classe na aba Missões.</p>':''}</div>`;
  $('modal').hidden=false;drawHero($('cIdle'),myLook(),6);
}

function readPng(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\/png$/.test(file.type)){rej('Envie um arquivo PNG.');return}
    if(file.size>200000){rej('Imagem grande demais. Use um PNG pequeno, de até 64 por 64 pixels.');return}
    const fr=new FileReader();fr.onerror=()=>rej('Não consegui ler o arquivo.');
    fr.onload=()=>{const img=new Image();img.onerror=()=>rej('Arquivo de imagem inválido.');img.onload=()=>{
      const max=32,k=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*k)),h=Math.max(1,Math.round(img.height*k));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(img,0,0,w,h);
      const url=cv.toDataURL('image/png');okPng(url)?res(url):rej('A imagem ficou grande demais depois de ajustada.');};img.src=fr.result};
    fr.readAsDataURL(file);
  });
}

const ST={W:120,H:32,heroX:22,scroll:0,phase:'walk',mob:null,mobX:0,t:0,walkT:0,fight:null,parts:[],fx:[],last:0,hs:null,hw:null,heroKey:'',dirty:false,

function stripResize(){const cv=$('strip');if(!cv)return;const w=cv.clientWidth||360;ST.W=Math.max(80,Math.round(w/3));cv.width=ST.W;cv.height=ST.H}
function whiteOf(src){const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const x=c.getContext('2d');x.drawImage(src,0,0);x.globalCompositeOperation='source-atop';x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);return c}
function heroSprites(){const L=myLook(),k=JSON.stringify(L);if(k!==ST.heroKey){const a=document.createElement('canvas'),b=document.createElement('canvas');drawHero(a,L,1,false,0);drawHero(b,L,1,false,1);ST.hs=[a,b];ST.hw=whiteOf(a);ST.heroKey=k}return ST.hs}
const mobWhite=new Map();
function mobSprite(m){const sp=shapeCanvas(m.shape,m.color,m.elite,false,1);let w=mobWhite.get(sp);if(!w){w=whiteOf(sp);mobWhite.set(sp,w)}return[sp,w]}
function rgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function mix(a,b,t){const A=rgb(a),B=rgb(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`}
const hash=n=>{n=Math.sin(n*127.1)*43758.5453;return n-Math.floor(n)};
function tri(x,cx,base,w,h,col){x.fillStyle=col;for(let r=0;r<h;r++){const ww=Math.round(w*(r+1)/h);x.fillRect(Math.round(cx-ww),base-h+r,ww*2+1,1)}}
function triDown(x,cx,top,w,h,col){x.fillStyle=col;for(let r=0;r<h;r++){const ww=Math.round(w*(h-r)/h);x.fillRect(Math.round(cx-ww),top+r,ww*2+1,1)}}
function deco(x,type,layer,cx,gy,n,col){
  const v=hash(n),far=layer==='far';
  if(type==='trees'){const h=far?10+v*6:12+v*8;tri(x,cx,gy,far?3:4,Math.round(h),col);x.fillStyle=col;x.fillRect(cx,gy-2,1,2)}
  else if(type==='hills'){const r=far?9:7;x.fillStyle=col;for(let d=-r;d<=r;d++){const hh=Math.round(Math.sqrt(r*r-d*d)*(far?.9:.7));x.fillRect(cx+d,gy-hh,1,hh)}}
  else if(type==='mountains'){const h=far?16+v*6:10+v*4;tri(x,cx,gy,far?11:7,Math.round(h),col);if(far){tri(x,cx,gy-Math.round(h)+4,2,4,'#ffffff')}}
  else if(type==='clouds'){const y=far?6+v*6:gy-5-v*4;x.fillStyle=col;x.fillRect(cx-6,Math.round(y),13,3);x.fillRect(cx-3,Math.round(y)-2,7,2)}
  else if(type==='pillars'){const h=far?14+v*5:10+v*4;x.fillStyle=col;x.fillRect(cx-1,gy-h,3,h);x.fillRect(cx-2,gy-h-1,5,1)}
  else if(type==='deadtrees'){const h=far?11+v*5:9+v*5;x.fillStyle=col;x.fillRect(cx,gy-h,1,h);x.fillRect(cx-2,gy-h+3,2,1);x.fillRect(cx+1,gy-h+5,3,1);x.fillRect(cx-3,gy-h+2,1,1)}
  else if(type==='stalactites'){triDown(x,cx,0,far?2:3,Math.round(far?6+v*6:5+v*5),col);if(!far)tri(x,cx+5,gy,2,Math.round(3+v*3),col)}
  else if(type==='volcano'){if(far){tri(x,cx,gy,14,18,col);x.fillStyle='#ff6a2a';x.fillRect(cx-2,gy-18,5,1)}else tri(x,cx,gy,3,Math.round(4+v*3),col)}
  else if(type==='spires'){tri(x,cx,gy,far?2:1,Math.round(far?16+v*8:8+v*6),col)}
}
function layer(x,th,speed,col,gy,spacing,name){
  const off=ST.scroll*speed;
  for(let i=-1;i<=Math.ceil(ST.W/spacing)+1;i++){const n=Math.floor(off/spacing)+i;const cx=Math.round(n*spacing-off+hash(n+7)*spacing*.4);deco(x,th.deco,name,cx,gy,n,col)}
}
function particles(x,th,dt){
  const P=ST.parts,type=th.part,W=ST.W,Hh=ST.H;
  if(P.length<14&&Math.random()<dt*6)P.push({x:Math.random()*W,y:type==='ember'?Hh:type==='sparkle'||type==='fog'||type==='dust'?Math.random()*(Hh-8):-2,life:0});
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.life+=dt;
    if(type==='leaf'){p.x-=10*dt;p.y+=7*dt;x.fillStyle=i%2?'#7bc96f':'#c9a06f'}
    else if(type==='snow'){p.x-=4*dt;p.y+=9*dt;x.fillStyle='#ffffff'}
    else if(type==='ember'){p.y-=8*dt;p.x-=3*dt;x.fillStyle=Math.random()<.5?'#ff8a3a':'#ffd06a'}
    else if(type==='sparkle'){x.fillStyle=Math.sin(p.life*8)>0?'#fff6c8':'rgba(255,246,200,.3)'}
    else if(type==='fog'){p.x-=5*dt;x.fillStyle='rgba(200,210,190,.18)';x.fillRect(Math.round(p.x),Math.round(p.y),7,1)}
    else{p.x-=2*dt;p.y+=1*dt;x.fillStyle='rgba(200,190,190,.5)'}
    x.fillRect(Math.round(p.x),Math.round(p.y),1,1);
    if(p.life>4||p.y>Hh||p.y<-3||p.x<-8)P.splice(i,1);
  }
}
/* ---------- efeitos de golpe ---------- */
const pxr=(x,X,Y,w,h,c)=>{x.fillStyle=c;x.fillRect(Math.round(X),Math.round(Y),w,h)};
function addFx(dur,draw,o){ST.fx.push({t:0,dur,draw,...(o||{})})}
function fxBurst(cx,cy,col,n,spd){const ps=[];for(let i=0;i<(n||8);i++){const a=Math.random()*Math.PI*2,v=(spd||22)*(.5+Math.random());ps.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-8})}
  addFx(.55,(x,p,dt)=>{x.globalAlpha=Math.max(0,1-p);ps.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=60*dt;pxr(x,q.x,q.y,1,1,col)});x.globalAlpha=1})}
function fxSlash(cx,cy,col,dir,big,delay){addFx(.2,(x,p)=>{x.globalAlpha=1-p*.8;const n=big?9:6,sc=big?1.4:1;for(let i=0;i<n;i++){const t=i/(n-1),X=cx+dir*(-3+t*6)*sc+p*dir*2,Y=cy-4*sc+t*8*sc;pxr(x,X,Y,1,1,col);if(big)pxr(x,X+dir,Y,1,1,col)}x.globalAlpha=1},{delay:delay||0})}
function fxProj(x0,x1,y,col,end){addFx(.28,(x,p)=>{const X=x0+(x1-x0)*p;x.globalAlpha=.45;pxr(x,X-5*Math.sign(x1-x0),y,4,1,col);x.globalAlpha=1;pxr(x,X-1,y-1,3,3,col);pxr(x,X,y,1,1,'#fff6c8')},{end})}
function fxArrow(x0,x1,y,end){addFx(.22,(x,p)=>{const X=x0+(x1-x0)*p,d=Math.sign(x1-x0);pxr(x,X-5*d,y,5,1,'#e8e0d0');pxr(x,X,y-1,1,3,'#bfe6ff')},{end})}
function fxMeteor(tx,ty){for(let i=0;i<3;i++)addFx(.32,(x,p)=>{const X=tx+16*(1-p)+i*2-2,Y=-4+(ty+4)*p;x.globalAlpha=.5;pxr(x,X+3,Y-3,2,2,'#ff8a3a');x.globalAlpha=1;pxr(x,X-1,Y-1,3,3,'#ff5a2a');pxr(x,X,Y,1,1,'#fff6c8')},
  {delay:i*.12,end:()=>{fxBurst(tx,ty,'#ff8a3a',10,30);ST.shake=Math.max(ST.shake,.25)}})}
function fxStars(cx,cy){addFx(.9,(x,p)=>{for(let i=0;i<3;i++){const a=p*Math.PI*4+i*2.09;pxr(x,cx+Math.cos(a)*5,cy+Math.sin(a)*1.5,1,1,'#ffe066')}})}
function fxBubbles(cx,cy,col){addFx(.8,(x,p)=>{for(let i=0;i<4;i++){const q=(p+i*.25)%1;x.globalAlpha=1-q;pxr(x,cx-3+i*2,cy-q*10,1,1,col)}x.globalAlpha=1})}
function fxRing(cx,cy,col){addFx(.5,(x,p)=>{const r=Math.round(4+p*6);x.globalAlpha=1-p;x.fillStyle=col;x.fillRect(cx-r,cy-r,2*r,1);x.fillRect(cx-r,cy+r,2*r,1);x.fillRect(cx-r,cy-r,1,2*r);x.fillRect(cx+r,cy-r,1,2*r+1);x.globalAlpha=1})}
function fxPlus(cx,cy){addFx(.8,(x,p)=>{x.globalAlpha=1-p;const y=cy-p*10;[[0,-1],[-1,0],[0,0],[1,0],[0,1]].forEach(([a,b])=>pxr(x,cx+a,y+b,1,1,'#5fcf8a'));x.globalAlpha=1})}
function fxStar(cx,cy,col){addFx(.3,(x,p)=>{const L=2+p*6;x.globalAlpha=1-p;for(let i=0;i<8;i++){const a=i*Math.PI/4;for(let r=1;r<L;r++)pxr(x,cx+Math.cos(a)*r,cy+Math.sin(a)*r,1,1,col)}x.globalAlpha=1})}
function fxCoin(cx,cy){addFx(.7,(x,p)=>{x.globalAlpha=1-p*p;const y=cy-p*12;pxr(x,cx,y,2,2,'#f2c14e');pxr(x,cx,y,1,1,'#fff2b0');x.globalAlpha=1})}
function floatTxt(lx,ly,text,kind,col){const fx=$('sFx');if(!fx)return;const e=document.createElement('span');e.className='fl-txt'+(kind?' '+kind:'');e.textContent=text;e.style.left=(lx/ST.W*100)+'%';e.style.top=Math.max(0,ly*3)+'px';if(col)e.style.color=col;fx.appendChild(e);setTimeout(()=>e.remove(),1100)}
function updateStripUI(){
  if(!$('sFloor'))return;
  const th=themeOf(s.sec),top=secTop();
  $('sFloor').textContent=s.atHome?'Em casa':`Andar ${s.floor}`;
  $('sTheme').textContent=s.atHome?'Preparando-se':th.name;
  $('sKills').style.width=(s.atHome?0:s.floor>=top?100:s.kills/SET.kpf*100)+'%';
  $('sBoss').hidden=s.atHome||s.floor<top;
  $('sHome').textContent=s.atHome?'Ir para a torre':'Casa';
}
const farming=()=>!!s.path&&s.onboarded&&!s.atHome&&$('battle').hidden&&$('modal').hidden&&$('onboard').hidden&&$('login').hidden;
const gyS=()=>ST.H-5;
function heroC(){return{x:ST.heroX+7,y:gyS()-8}}
function mobC(){return{x:ST.mobX+6,y:gyS()-5}}
function startEncounter(){
  const m=ST.mob,sim=simulate(meFighter(),{name:m.name,...m.c,fx:m.fx});
  const ev=sim.fr.filter(f=>f.m).slice(0,10);
  ST.fight={m,win:sim.win,ev,i:0,t:0,wait:0};ST.phase='fight';
}
function applyEvent(m){
  const hc=heroC(),mc=mobC(),A=m.a==='A'?hc:mc,T=m.t==='A'?hc:mc,dir=m.a==='A'?1:-1;
  const dmg=['hit','opener','meteor','double','triple','execute','counter'].includes(m.k);
  if(dmg){
    const hitT=()=>{if(m.t==='B'){ST.mflash=.12;ST.mkb=2}else{ST.hflash=.12;ST.hkb=2}floatTxt(T.x,7,'-'+m.d,m.crit?'crit':m.t==='A'?'hurt':'')};
    if(m.a==='A')ST.hl=.22;else ST.ml=.22;
    if(m.k==='opener')fxProj(A.x+dir*4,T.x,T.y-1,'#ff8a3a',()=>{fxBurst(T.x,T.y,'#ff8a3a',12,30);ST.shake=Math.max(ST.shake,.15);hitT()});
    else if(m.k==='meteor'){fxMeteor(T.x,T.y);setTimeout(hitT,380)}
    else if(m.k==='double'){fxArrow(A.x+dir*4,T.x,T.y-1,()=>{fxSlash(T.x,T.y,'#bfe6ff',dir,false);hitT()})}
    else if(m.k==='triple'){[0,.08,.16].forEach(dl=>fxSlash(T.x,T.y,'#f2c14e',dir,true,dl));ST.shake=.2;hitT()}
    else if(m.k==='execute'){fxSlash(T.x,T.y,'#e8585a',dir,true);fxBurst(T.x,T.y,'#e8585a',10);ST.shake=.2;hitT()}
    else{fxSlash(T.x,T.y,m.crit?'#ffe066':'#ffffff',dir,m.crit);hitT()}
    if(m.crit){fxStar(T.x,T.y,'#ffe066');ST.shake=Math.max(ST.shake,.15)}
  }else if(m.k==='heal'){fxPlus(A.x,A.y-2);floatTxt(A.x,6,'+'+m.d,'heal')}
  else if(m.k==='block')fxRing(A.x,A.y,'#6ec6ff');
  else if(m.k==='dodge'){floatTxt(A.x,5,'Esquivou!','dodge');if(m.a==='A')ST.hkb=-3}
  else if(m.k==='reflect'){fxStar(A.x,A.y,'#f2c14e');floatTxt(T.x,7,'-'+m.d,m.t==='A'?'hurt':'')}
  else if(m.k==='poison')fxBubbles(T.x,T.y,'#7bc96f');
  else if(m.k==='burn'){fxBubbles(T.x,T.y,'#ff8a3a');floatTxt(T.x,7,'-'+m.d,'burn')}
  else if(m.k==='stun')fxStars(T.x,T.y-7);
  else if(m.k==='stunned')fxStars(A.x,A.y-7);
  if(m.sk&&m.k!=='burn'&&m.k!=='stunned')floatTxt((A.x+T.x)/2,0,m.sk,'sk',KCOL[m.k]);
}
function endEncounter(){
  const F=ST.fight,m=F.m,mc=mobC();
  if(F.win){
    const rw=killReward(m.f,m.elite);s.acc.g+=rw.g*0.1;s.acc.x+=rw.x*0.1;
    fxBurst(mc.x,mc.y,m.color||'#ffffff',14,26);fxCoin(mc.x,mc.y-4);
    if(s.acc.g>=1){const g=Math.floor(s.acc.g);s.acc.g-=g;floatTxt(mc.x,3,'+'+addGold(g)+' ouro','gold')}
    if(s.acc.x>=1){const x=Math.floor(s.acc.x);s.acc.x-=x;gainXP(x)}
    if(Math.random()<(m.elite?0.06:0.004)*luck()){const d=rollDrop(m.f,m.elite?'elite':'mob');if(d){s.owned.push(d);floatTxt(mc.x,0,ITEM[d].n,'sk','#c58cff');toast('Item encontrado: '+ITEM[d].n)}}
    s.kills+=m.elite?2:1;
    if(s.kills>=SET.kpf&&s.floor<secTop()){s.best=Math.max(s.best,s.floor);s.floor++;s.kills=0;bump('floors');floatTxt(ST.heroX+7,1,`Andar ${s.floor}!`,'sk','#5fcf8a');if(ui.tab==='torre'&&!(document.activeElement&&document.activeElement.matches('input,select')))render()}
    if(s.floor>=secTop())s.kills=SET.kpf;
    ST.phase='die';ST.t=0;
  }else{
    if(!m.elite&&s.floor>secStart()){s.floor--;s.kills=0;floatTxt(ST.heroX+7,1,`Recuou para o andar ${s.floor}`,'hurt')}else floatTxt(ST.heroX+7,1,m.elite?'O elite venceu':'Derrota','hurt');
    ST.phase='hurt';ST.t=0;
  }
  ST.dirty=true;saveLocal();header();updateStripUI();
}
function drawStrip(dt){
  const cv=$('strip'),x=cv.getContext('2d');if(!x)return;x.imageSmoothingEnabled=false;
  const W=ST.W,Hh=ST.H,gy=gyS(),home=s.atHome||!s.path;
  const th=home?{sky:['#2a2340','#c87a5a'],far:'#3a2f50',mid:'#2a2238',ground:'#4a3a2a',top:'#6b8f3a',deco:'trees',part:'sparkle'}:themeOf(s.sec);
  const moving=!home&&ST.phase==='walk'&&farming();
  ST.clock+=dt;
  if(moving&&!REDUCED){ST.scroll+=14*dt;ST.anim+=dt}
  let sh=false;if(ST.shake>0&&!REDUCED){ST.shake-=dt;sh=true;x.save();x.translate(Math.round((Math.random()-.5)*2),Math.round((Math.random()-.5)*2))}
  for(let y=0;y<gy;y++){x.fillStyle=mix(th.sky[0],th.sky[1],y/gy);x.fillRect(-1,y,W+2,1)}
  layer(x,th,.25,th.far,gy,20,'far');layer(x,th,.6,th.mid,gy,27,'mid');
  x.fillStyle=th.ground;x.fillRect(-1,gy,W+2,Hh-gy+1);x.fillStyle=th.top;x.fillRect(-1,gy,W+2,1);
  x.fillStyle='rgba(0,0,0,.2)';const off=Math.floor(ST.scroll)%6;for(let i=-off;i<W;i+=6)x.fillRect(i,gy+2,3,1);
  particles(x,th,dt);
  const hs=heroSprites();
  if(home){
    const hxH=Math.max(ST.heroX+20,W-30);const pal={r:'#b0553a',w:'#d9c39a',b:'#6b4a24',y:'#f2c14e'};
    HOUSE.forEach((row,j)=>[...row].forEach((ch,i)=>{if(pal[ch]){x.fillStyle=pal[ch];x.fillRect(hxH+i,gy-HOUSE.length+j,1,1)}}));
    if(Math.random()<dt*3)ST.parts.push({x:hxH+10,y:gy-12,life:0});
    x.drawImage(hs[Math.floor(ST.clock*1.5)%2===0?0:0],hxH-16,gy-15-(Math.floor(ST.clock*2)%2));
    if(sh)x.restore();return;
  }
  // herói: passos, investida e recuo
  ST.hl=Math.max(0,ST.hl-dt);ST.ml=Math.max(0,ST.ml-dt);ST.hflash=Math.max(0,ST.hflash-dt);ST.mflash=Math.max(0,ST.mflash-dt);
  ST.hkb*=Math.pow(.02,dt);ST.mkb*=Math.pow(.02,dt);
  const lunge=t=>t>0?Math.round(Math.sin((1-t/.22)*Math.PI)*4):0;
  let hx=ST.heroX+lunge(ST.hl)-Math.round(ST.hkb),hy=gy-15;
  const frame=moving?Math.floor(ST.anim*7)%2:0;if(moving&&frame)hy-=1;
  const blinkH=ST.phase==='hurt'&&Math.floor(ST.t*10)%2===0;
  if(!blinkH)x.drawImage(ST.hflash>0?ST.hw:hs[frame],hx,hy);
  // monstro: movimento próprio, impacto e morte
  const m=ST.mob;
  if(m){
    let mx=Math.round(ST.mobX)-lunge(ST.ml)+Math.round(ST.mkb);
    const t=ST.clock,dying=ST.phase==='die';
    if(m.png&&okPng(m.png)){let img=imgCache.get(m.png);if(!img){img=new Image();img.src=m.png;imgCache.set(m.png,img)}if(img.complete&&img.width){const k=12/Math.max(img.width,img.height);if(dying)x.globalAlpha=Math.max(0,1-ST.t/.35);x.drawImage(img,mx,gy-img.height*k,img.width*k,img.height*k);x.globalAlpha=1}}
    else{
      const [sp,wh]=mobSprite(m),src=ST.mflash>0?wh:sp;
      let yo=0,sy=1;const sh2=m.shape;
      if(['bat','bird','wisp','eye'].includes(sh2))yo=-2+Math.round(Math.sin(t*6)*1.5);
      else if(sh2==='blob')sy=1+.1*Math.sin(t*8);
      else if(ST.phase==='walk')yo=-(Math.floor(t*6)%2);
      if(dying){x.globalAlpha=Math.max(0,1-ST.t/.35);sy*=1-ST.t*.8}
      const h=Math.max(1,Math.round(src.height*sy));
      x.save();x.translate(mx+12,0);x.scale(-1,1);x.drawImage(src,0,0,src.width,src.height,0,gy-h+yo,src.width,h);x.restore();x.globalAlpha=1;
      if(m.elite&&!dying){x.fillStyle='#e8585a';x.fillRect(mx+4,gy-src.height-3+yo,4,1)}
    }
  }
  // efeitos
  for(let i=0;i<ST.fx.length;i++){const e=ST.fx[i];if(e.delay>0){e.delay-=dt;continue}e.t+=dt;const p=Math.min(1,e.t/e.dur);e.draw(x,p,dt);if(e.t>=e.dur){e.done=true;if(e.end)e.end()}}
  ST.fx=ST.fx.filter(e=>!e.done);
  if(sh)x.restore();
}
function stepStrip(dt){
  if(!farming())return;
  ST.t+=dt;
  if(ST.phase==='walk'){
    if(!ST.mob){ST.walkT+=dt;if(ST.walkT>1.1){const elite=Math.random()<0.15;ST.mob=monster(s.floor,elite?'elite':'mob');ST.mobX=ST.W+2;ST.walkT=0}}
    else{ST.mobX-=(REDUCED?40:16)*dt;if(ST.mobX<=ST.heroX+13){ST.mobX=ST.heroX+13;startEncounter()}}
  }else if(ST.phase==='fight'){
    const F=ST.fight;F.t+=dt;
    if(F.t>=F.wait){
      if(F.i>=F.ev.length){endEncounter();return}
      const e=F.ev[F.i++];applyEvent(e.m);F.t=0;F.wait=e.m.sk?(e.m.k==='meteor'?.75:.55):.3;
    }
  }else if(ST.phase==='die'){if(ST.t>.45){ST.mob=null;ST.phase='walk';ST.walkT=0}}
  else if(ST.phase==='hurt'){if(ST.t>.7){ST.mob=null;ST.phase='walk';ST.walkT=0}}
}
function stripLoop(ts){
  requestAnimationFrame(stripLoop);
  if(document.hidden||$('stripBox').hidden)return;
  if(ts-ST.last<33)return;const dt=Math.min(.1,(ts-(ST.last||ts))/1000)||.033;ST.last=ts;
  stepStrip(dt);drawStrip(dt);
}
setInterval(()=>{if(ST.dirty){ST.dirty=false;save()}},60000);
$('sBoss').onclick=()=>bossFight();
$('sHome').onclick=()=>s.atHome?towerBtn():goHome();
addEventListener('resize',stripResize);

/* ======================= CRIAÇÃO DO HERÓI ======================= */
function obCheck(){
  if(s.onboarded){if(!$('onboard').hidden)$('onboard').hidden=true;return}
  if(!BOOT||!$('login').hidden||!$('battle').hidden)return;
  if($('onboard').hidden){ui.ob={step:1,sex:null,name:'',skin:'#f1c27d',style:'curto',hair:'#5a3420'};$('modal').hidden=true;$('onboard').hidden=false;renderOnboard()}
}
function renderOnboard(){
  const o=ui.ob,b=$('obBody');if(!o)return;
  if(o.step===1)b.innerHTML=`<h2>Crie seu herói</h2><p class="mute">Primeiro, escolha o sexo do seu herói.</p>
    <div class="sexes"><button type="button" class="sexbtn" data-ob="sex" data-v="m" style="--sc:#6ec6ff"><span>♂︎</span>Masculino</button><button type="button" class="sexbtn" data-ob="sex" data-v="f" style="--sc:#ff8ac8"><span>♀︎</span>Feminino</button></div>`;
  else if(o.step===2){
    b.innerHTML=`<div class="head"><h2>Aparência</h2><button type="button" class="btn sm" data-ob="back">Voltar</button></div>
    <div class="ob-prev"><canvas id="obCv"></canvas></div>
    <label class="fld"><span>Nome do herói</span><input id="obName" maxlength="20" value="${esc(o.name)}" placeholder="Como seu herói se chama?" autocomplete="off"></label>
    <span class="label">Cor de pele</span><div class="sw">${SKINS.map((c,i)=>`<button type="button" style="--sw:${c}" data-ob="skin" data-v="${c}" aria-pressed="${o.skin===c}" aria-label="Tom de pele ${i+1}"></button>`).join('')}</div>
    <span class="label">Cabelo</span><div class="styles">${Object.entries(STYLES).map(([k,v])=>`<button type="button" data-ob="style" data-v="${k}" aria-pressed="${o.style===k}">${v.n}</button>`).join('')}</div>
    <span class="label">Cor do cabelo</span><div class="sw">${HAIRC.map((c,i)=>`<button type="button" style="--sw:${c}" data-ob="hair" data-v="${c}" aria-pressed="${o.hair===c}" aria-label="Cor de cabelo ${i+1}"></button>`).join('')}</div>
    <p class="err" id="obErr"></p><button type="button" class="btn main" data-ob="next">Continuar</button>`;
    drawHero($('obCv'),{sex:o.sex,skin:o.skin,style:o.style,hair:o.hair,body:o.sex==='f'?'#8a4f7a':'#6d6487'},8);
  }else b.innerHTML=`<div class="head"><h2>Escolha seu caminho</h2><button type="button" class="btn sm" data-ob="back">Voltar</button></div>
    <p class="mute">Os primeiros 10 andares são a Floresta. Depois dela a torre se divide. Essa escolha é definitiva.</p>
    <button class="pathbtn" type="button" data-ob="path" data-v="ceu" style="--pc:#6ec6ff"><b>Caminho dos Céus</b><span>Campos Dourados, Montanhas Nevadas, Reino das Nuvens, Templo Celestial e Paraíso Eterno. Chefes resistentes que se curam e se defendem.</span></button>
    <button class="pathbtn" type="button" data-ob="path" data-v="inferno" style="--pc:#e8585a"><b>Caminho do Inferno</b><span>Pântano Sombrio, Cavernas de Ossos, Vulcão Ardente, Cidade Infernal e Abismo Profundo. Chefes agressivos com veneno e fúria.</span></button>`;
}
$('onboard').addEventListener('input',e=>{if(e.target.id==='obName'&&ui.ob)ui.ob.name=e.target.value});
$('onboard').addEventListener('click',e=>{
  const b=e.target.closest('[data-ob]');if(!b||!ui.ob)return;const o=ui.ob,a=b.dataset.ob,v=b.dataset.v;
  if(a==='sex'){o.sex=v;o.style=v==='f'?'longo':'curto';o.step=2}
  else if(a==='back')o.step=Math.max(1,o.step-1);
  else if(a==='skin'&&SKINS.includes(v))o.skin=v;
  else if(a==='style'&&STYLES[v])o.style=v;
  else if(a==='hair'&&HAIRC.includes(v))o.hair=v;
  else if(a==='next'){if(!o.name.trim()){$('obErr').textContent='Dê um nome ao seu herói.';$('obName').focus();return}o.step=3}
  else if(a==='path'&&PATHS[v]){
    s.sex=o.sex;s.name=o.name.trim().slice(0,20);s.look={skin:o.skin,style:o.style,hair:o.hair};s.path=v;s.onboarded=true;s.welcome=false;s.lastSeen=Date.now();
    ui.ob=null;$('onboard').hidden=true;save();render();
    $('mBody').innerHTML=`<div style="display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center"><canvas id="cIdle"></canvas><h2>Bem-vindo, ${esc(s.name)}!</h2>
      <p class="mute">Seu herói já está na Floresta, caçando slimes no topo da tela.</p>
      <ol class="steps" style="text-align:left"><li>Escolha suas ${SET.maxDaily} missões de hoje na aba Missões.</li><li>Compre equipamento de iniciante na Loja, em casa.</li><li>No nível ${RANK_LV[0]} você escolhe sua classe.</li></ol></div>`;
    $('mOk').textContent='Começar';$('modal').hidden=false;drawHero($('cIdle'),myLook(),6);return;
  }else return;
  renderOnboard();
});
$('mOk').addEventListener('click',()=>{$('mOk').textContent='Coletar'});

render();stripResize();requestAnimationFrame(stripLoop);
if(net.mode==='firebase')connectFirebase();
else{checkIdle();if(!(window.claude&&window.claude.use))setMaster(true);setTimeout(()=>{if(!BOOT){BOOT=true;render()}},2500);connectClaude()}
</script>
