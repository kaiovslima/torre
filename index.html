<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#201c2f"><title>Torre da Disciplina × RO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout de app de celular (estilo original da Torre): barra do herói no topo, palco, conteúdo em coluna, abas fixas embaixo. */
:root{--bg:#14121d;--panel:#201c2f;--panel2:#2a2540;--line:#3a3354;--ink:#f1ead9;--mute:#a7a0bb;--gold:#f2c14e;--xp:#6ec6ff;--hp:#e8585a;--sp:#5aa8ff;--ok:#5fcf8a;
--forca:#ff8a5c;--intelecto:#6ec6ff;--disciplina:#f2c14e;--criatividade:#c58cff;
--display:"Cinzel",Georgia,"Times New Roman",serif;--body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.02em}h2{font-size:20px}h3{font-size:17px}p{margin:0}
.mute{color:var(--mute)}.small{font-size:13px}.tiny{font-size:11px}.num{font-variant-numeric:tabular-nums}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);font-weight:600}
/* topo */
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:8px max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));padding-top:calc(8px + env(safe-area-inset-top))}
.top-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.lv{font-family:var(--display);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;text-align:center;line-height:1.15}.lv b{display:block;color:var(--xp);font-size:18px}
.top-mid{min-width:0;display:flex;flex-direction:column;gap:3px}.top-name{font-family:var(--display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coins{font-family:var(--display);font-size:15px;display:flex;align-items:center;gap:5px}.dot{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #b8862a}
.bar{height:7px;background:#0f0d16;border:1px solid var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--xp);transition:width .3s}
.bar.hp i{background:var(--hp)}.bar.sp i{background:var(--sp)}.bar.gold i{background:var(--gold)}.bar.ok i{background:var(--ok)}
main,.stagewrap{max-width:640px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
main{padding-top:14px;padding-bottom:110px;display:flex;flex-direction:column;gap:14px}
.stagewrap{padding-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.note{background:#0f0d16;border:1px dashed var(--line);border-radius:8px;padding:10px;font-size:13px;color:var(--mute)}.note b{color:var(--ink)}
.lore{background:linear-gradient(#2a2540,#201c2f);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:12px;font-size:14px;font-style:italic;color:#ddd4c0}.lesson{font-family:var(--display);font-style:normal;color:var(--gold);margin-top:6px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--mute)}.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.main{background:var(--gold);color:#241a05;border-color:#b8862a;box-shadow:0 3px 0 #9b6f1c;font-family:var(--display);font-size:16px}.btn.main:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #9b6f1c}
.btn.red{background:var(--hp);color:#fff;border-color:#a83a3c;box-shadow:0 3px 0 #85292b;font-family:var(--display)}
.btn.good{border-color:var(--ok);color:#bff3d4}.btn.on{border-color:var(--gold);color:var(--gold)}
.btn.sm{padding:6px 10px;font-size:13px}.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.fill>*{flex:1 1 120px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c,var(--mute))}.chip.plain::before{display:none}
.chip.good{border-color:var(--ok)}.chip.bad{border-color:var(--hp);color:#ffb3b4}.chip.gold{border-color:var(--gold);color:var(--gold)}
.c-forca{--c:var(--forca)}.c-intelecto{--c:var(--intelecto)}.c-disciplina{--c:var(--disciplina)}.c-criatividade{--c:var(--criatividade)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{background:none;border:0;border-radius:7px;padding:8px 4px;font-weight:600;color:var(--mute);font-size:14px}.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--gold)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--mute)}.filters button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
input,select{background:#0f0d16;border:1px solid var(--line);border-radius:8px;padding:9px;width:100%;min-width:0}
label.f{display:grid;gap:4px;font-size:12px;color:var(--mute);flex:1 1 130px}
/* tarefas */
.tasks,.items{display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left;width:100%}
.task.sel{border-color:var(--c)}.task.done{opacity:.6}.task.done .tt{text-decoration:line-through}
.check{width:40px;height:40px;border-radius:8px;border:2px solid var(--c,var(--line));background:#0f0d16;display:grid;place-items:center;font-size:20px;padding:0}
.task.sel .check{background:color-mix(in srgb,var(--c) 25%,#0f0d16)}.task.done .check{background:var(--c);color:#14121d}
.tbody{min-width:0;display:flex;flex-direction:column;gap:4px}.tt{font-weight:500;overflow-wrap:anywhere}.tmeta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mute)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sum{background:var(--panel2);border-radius:8px;padding:8px 10px}.sum b{display:block;font-family:var(--display);font-size:20px}
.focus-time{font-family:var(--display);font-size:44px;text-align:center;line-height:1;padding:4px 0}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.cat{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 4px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.cat i{width:10px;height:10px;border-radius:3px;background:var(--c)}.cat[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--panel2))}
.goal{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.goal.mine{border-color:var(--gold)}.goal-act{display:flex;gap:6px;align-items:center}.goal-act input{width:72px;padding:6px 8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.item>div{min-width:0;display:flex;flex-direction:column;gap:2px}.item.on{border-color:var(--gold)}.item.locked{opacity:.6}
.item-n{font-weight:600}.item-s{font-size:12px;color:var(--mute)}.acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.pic{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;background:#0f0d16;position:relative;font-size:22px;overflow:hidden;flex:none}
.pic img{position:absolute;max-width:40px;max-height:40px;image-rendering:pixelated;object-fit:contain}
.stats4{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:var(--panel2);border-radius:8px;padding:10px;border-left:3px solid var(--c)}.stat b{font-family:var(--display);font-size:22px;display:block}.stat small{color:var(--mute);font-size:12px}
.combat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.combat div{background:#0f0d16;border-radius:8px;padding:8px 2px}.combat b{font-family:var(--display);font-size:18px;display:block}.combat small{font-size:11px;color:var(--mute)}
/* palco */
.stagecard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.stage{position:relative;height:250px;border-radius:8px;overflow:hidden;background:#1a2a3a;isolation:isolate;touch-action:manipulation}
.stage canvas#scene{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.stage.shake{animation:shake .22s linear}@keyframes shake{25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,1px)}}
.character{position:absolute;bottom:13%;left:28%;transform:translateX(-50%);pointer-events:none;display:flex;align-items:flex-end;justify-content:center;z-index:2;transition:left .08s linear}
.character img,.character canvas{display:block;image-rendering:pixelated;filter:drop-shadow(0 3px 1px #0006)}
.char-shadow{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:70%;min-width:26px;height:9px;border-radius:50%;background:#0008;z-index:-1}
.character.lunge{animation:lunge .3s ease-out}.character.hit{animation:hitflash .3s}.enemy.hit img{filter:brightness(2.2) drop-shadow(0 3px 1px #0006)}
@keyframes lunge{40%{transform:translate(-30%,-2px)}}@keyframes hitflash{30%{transform:translate(-44%,0)}}
.nameplate{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;font-size:11px;font-weight:700;white-space:nowrap;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
.enemy .nameplate{color:#ffd6d6}.enemy.boss .nameplate{color:var(--gold)}
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:6}
.who{background:#0f0d16cc;border:1px solid #ffffff1a;border-radius:7px;padding:5px 7px;width:min(170px,47%);font-size:12px;font-weight:600;text-shadow:0 1px 1px #000}.who.r{text-align:right}.who .bar{height:6px;margin-top:3px}
.loc{position:absolute;left:8px;bottom:8px;z-index:6;background:#0f0d16cc;border:1px solid #ffffff1a;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.dmg{position:absolute;transform:translate(-50%,0);font-family:var(--display);font-size:22px;font-weight:700;color:#fff;text-shadow:2px 2px 0 #000;animation:dmg .8s ease-out forwards;white-space:nowrap}
.dmg.crit{color:var(--gold);font-size:28px}.dmg.heal{color:var(--ok)}.dmg.hurt{color:#ff8f8f}.dmg.info{font-size:15px;color:#bfe7ff}
@keyframes dmg{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}20%{opacity:1;transform:translate(-50%,-8px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-46px) scale(.9)}}
.wfx{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.wfx.slash{width:90px;height:90px;border-radius:50%;border-top:6px solid #fff;border-right:3px solid #fff8;animation:slash .28s ease-out forwards;filter:drop-shadow(0 0 6px #9cf)}
.wfx.cleave{width:130px;height:130px;border-radius:50%;border-top:9px solid #ffd27a;border-left:4px solid #ffd27a88;animation:slash .36s ease-out forwards;filter:drop-shadow(0 0 8px #f90)}
@keyframes slash{from{opacity:0;transform:translate(-50%,-50%) rotate(-80deg) scale(.6)}30%{opacity:1}to{opacity:0;transform:translate(-50%,-50%) rotate(60deg) scale(1.05)}}
.wfx.stab{width:70px;height:4px;background:linear-gradient(90deg,transparent,#fff);box-shadow:0 -12px 0 #fff8,0 12px 0 #fff8;animation:stab .22s ease-out forwards}
@keyframes stab{from{opacity:0;transform:translate(-90%,-50%) scaleX(.3)}40%{opacity:1}to{opacity:0;transform:translate(-30%,-50%) scaleX(1)}}
.wfx.smash{width:30px;height:12px;border-radius:50%;border:4px solid #ffcf8a;animation:ring .45s ease-out forwards}
@keyframes ring{from{opacity:1;transform:translate(-50%,-50%) scale(.4)}to{opacity:0;transform:translate(-50%,-50%) scale(5,3)}}
.wfx.punch{font-size:34px;animation:pop .3s ease-out forwards}@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}40%{opacity:1}to{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
.proj{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:5}
.proj.arrow{width:38px;height:3px;background:linear-gradient(90deg,#c9a46a,#fff);border-radius:2px}.proj.arrow::after{content:"";position:absolute;right:-6px;top:-4px;border:5px solid transparent;border-left:8px solid #e8e8e8}
.proj.orb{width:20px;height:20px;border-radius:50%;background:radial-gradient(#fff,#8fd3ff 45%,#3a6cff00 72%);box-shadow:0 0 16px #8fd3ff}
.proj.fire{background:radial-gradient(#fff,#ffb14a 45%,#ff4a0000 72%);box-shadow:0 0 16px #ff8a3a}.proj.ice{background:radial-gradient(#fff,#a8ecff 45%,#4ac8ff00 72%)}
.proj.poison{background:radial-gradient(#fff,#c58cff 45%,#8a3aff00 72%);box-shadow:0 0 16px #b06aff}.proj.light{background:radial-gradient(#fff,#fff39a 45%,#ffe06600 72%);box-shadow:0 0 16px #ffe066}
.spell{position:absolute;transform:translate(-50%,-50%);width:120px;height:120px;pointer-events:none;animation:spell .7s ease-out forwards}
.spell::before{content:attr(data-s);position:absolute;inset:0;display:grid;place-items:center;font-size:52px;filter:drop-shadow(0 0 10px currentColor)}
.spell::after{content:"";position:absolute;inset:14px;border:4px solid currentColor;border-radius:50%;box-shadow:0 0 22px currentColor}
.spell.fire{color:#ff9b4a}.spell.ice{color:#93e6ff}.spell.light{color:#f9ea82}.spell.heal{color:#77edb8}.spell.poison{color:#c288f7}.spell.physical{color:#f4cd7c}
@keyframes spell{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}30%{opacity:1;transform:translate(-50%,-50%) scale(.9)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}}
.stagefoot{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 2px 2px;flex-wrap:wrap}
.log{min-width:0;flex:1 1 180px}.log b{display:block;font-size:13px}.log span{font-size:12px;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skillbar{display:flex;gap:6px}.sk{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:#0f0d16;position:relative;display:grid;place-items:center;font-size:20px;overflow:hidden}
.sk img{position:absolute;width:26px;height:26px;image-rendering:pixelated}.sk i{position:absolute;left:0;right:0;bottom:0;background:#000a;height:0}.sk.empty{opacity:.35}
.stagebtns{display:flex;gap:8px;width:100%}.stagebtns .btn{flex:1}
/* herói / 360 */
.pview{position:relative;height:280px;border-radius:10px;background:radial-gradient(ellipse at 50% 82%,#3a3354 0,#1a1726 70%);border:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;padding-bottom:42px;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none}
.pview img,.pview canvas{image-rendering:pixelated;position:relative;z-index:1;filter:drop-shadow(0 6px 4px #0008)}
.pview canvas#pfb{position:absolute;inset:0;width:100%;height:100%;z-index:0;filter:none}
.pview .floor{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);width:120px;height:18px;border-radius:50%;background:#0007;border:1px solid #ffffff14}
.dirs{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:4px;z-index:2}
.dirs i{width:8px;height:8px;border-radius:50%;background:#ffffff26}.dirs i.on{background:var(--gold)}
.pv-label{position:absolute;top:8px;left:8px;z-index:2}
.rot{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.rot .btn{font-size:20px;padding:6px 14px}
/* cartas */
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ccard{background:linear-gradient(160deg,#3b3456,#1a1726);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.ccard.got{border-color:#cbab66}.ccard .art{width:100%;aspect-ratio:3/4;background:#0f0d16;border-radius:5px;display:grid;place-items:center;overflow:hidden;position:relative}
.ccard .art img{width:100%;height:100%;object-fit:contain;image-rendering:auto}.ccard .art img.mob{width:70%;height:70%;image-rendering:pixelated}
.ccard:not(.got) .art img{filter:grayscale(1) brightness(.35)}.ccard .q{position:absolute;font-family:var(--display);font-size:28px;color:#fff6}
.ccard b{font-size:11.5px;line-height:1.2;overflow-wrap:anywhere}.ccard small{font-size:10.5px;color:var(--mute);line-height:1.25}
.pagebar{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* mundo */
.mapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.node{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 6px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;border-left:4px solid var(--t)}
.node b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.node small{font-size:11px;color:var(--mute)}.node.on{border-color:var(--gold);border-left-color:var(--t)}.node:disabled{opacity:.45}
.mobs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mob{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;font-size:12px;min-width:0}
.mob .m{height:56px;display:grid;place-items:center}.mob img{max-height:52px;max-width:100%;image-rendering:pixelated}.mob.elite{border-color:#8fd3ff}.mob.boss{border-color:var(--gold)}
details summary{cursor:pointer;font-weight:600;color:var(--gold);list-style:none}details summary::-webkit-details-marker{display:none}
/* números legíveis: tudo que é número usa a fonte do corpo */
.lv,.lv b,.coins,.combat b,.stat b,.sum b,.focus-time,.dmg,.num,.top-name{font-family:var(--body);font-weight:700;letter-spacing:0}.top-name{font-weight:600}
.sync{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block;margin-right:6px;vertical-align:middle}.sync.on{background:var(--ok)}.sync.err{background:var(--hp)}
/* fases */
.stages{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.stg{height:30px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-size:12px;font-weight:700;color:var(--mute);padding:0}
.stg.done{background:color-mix(in srgb,var(--ok) 22%,var(--panel2));color:var(--ink)}.stg.cur{border-color:var(--gold);color:var(--gold)}.stg.boss{font-size:15px}.stg:disabled{opacity:.35}
.pips{display:flex;gap:5px;align-items:center}.pips i{width:12px;height:12px;border-radius:3px;background:#0f0d16;border:1px solid var(--line)}.pips i.on{background:var(--gold);border-color:var(--gold)}
/* cores e visuais */
.sw{display:flex;flex-wrap:wrap;gap:6px}.sw button{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);background:var(--c,#555);font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px #f2c14e55}
.costumes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.cos{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.cos.on{border-color:var(--gold)}.cos .pic{width:40px;height:40px}
/* forja */
.forge{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;background:radial-gradient(circle at 30% 40%,#3a2a20,#1a1410 70%);border:1px solid #6b4a2a;border-radius:10px;padding:12px}
.forge .big{width:96px;height:96px;border-radius:12px;background:#0f0d16;border:2px solid #b8862a;display:grid;place-items:center;position:relative;font-size:44px;box-shadow:0 0 22px #ff8a3a44 inset}
.forge .big img{position:absolute;width:64px;height:64px;image-rendering:pixelated}.forge .ref{position:absolute;top:-8px;right:-8px;background:var(--gold);color:#241a05;border-radius:999px;padding:1px 7px;font-weight:700;font-size:13px}
.sockets{display:flex;gap:10px;flex-wrap:wrap}.socket{width:72px;height:96px;border-radius:8px;border:2px dashed var(--line);background:#0f0d16;display:grid;place-items:center;position:relative;overflow:hidden;color:var(--mute);font-size:11px;padding:0}
.socket.full{border-style:solid;border-color:#cbab66}.socket img{width:100%;height:100%;object-fit:contain}.socket img.mob{width:70%;height:70%;image-rendering:pixelated}.socket span{position:absolute;bottom:0;left:0;right:0;background:#000b;font-size:10px;padding:2px}
.minicards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.delta{font-size:12px;font-weight:700}.delta.up{color:var(--ok)}.delta.down{color:#ff9b9b}
.login{display:grid;gap:8px}
/* abas inferiores */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);padding:4px 0;border-radius:8px}.tab span{font-size:20px;line-height:1}
.tabs.seven{grid-template-columns:repeat(7,1fr)}.tabs.seven .tab{font-size:10px}
.tab[aria-current="page"]{color:var(--gold);background:var(--panel2)}
.toast{position:fixed;z-index:40;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--gold);color:#241a05;border-radius:10px;padding:10px 16px;box-shadow:0 10px 40px #000a;max-width:min(92vw,480px);font-weight:600;text-align:center;font-size:14px}
.foot{font-size:11px;text-align:center;color:#6f6889;padding:0 14px}
@media(min-width:900px){main,.stagewrap,.top-in{max-width:780px}.stage{height:320px}.album{grid-template-columns:repeat(6,1fr)}.mapgrid{grid-template-columns:repeat(3,1fr)}.tabs{max-width:780px;margin:0 auto;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0}}
@media(max-width:380px){.stage{height:220px}.tab{font-size:10px}.album{grid-template-columns:repeat(3,1fr)}}

 if(m.adds)for(const [k,v] of Object.entries(m.adds))addCounter(k,v);gainJobXP(classCat(m.cat)?5:0);
 if(d.completed.length>=5&&!d.perf){d.perf=true;w.perf++;state.counters.diasPerf=cnt('diasPerf')+1;if(counterRelevant('diasPerf'))gainJobXP(CP_RATE.diasPerf);setTimeout(()=>toast('🌟 Dia completo! +1 em "dias com todas as diárias"'),1400)}
 state.hp=Math.min(state.hp+12,maxHP());save();render();toast(`✅ +${D.xp} XP · +${D.z} zeny · +${D.p} ${ATTR[C.at]}`+(classCat(m.cat)?' · +XP de Classe':''))}

 if(min){state.stats.focusMin+=min;state.weekly.focus+=min;state.zeny+=min*3;gainXP(min*4);const tens=Math.floor(min/10);state.attrs[CATS[cat].at]+=tens;if(classCat(cat))gainJobXP(tens*2);save();toast(`🎯 ${min} min de foco · +${min*4} XP · +${min*3} zeny`+(tens?` · +${tens} ${ATTR[CATS[cat].at]}`:''))}else{save();toast('Sessão encerrada antes de 1 minuto.')}render()}

function equip(uid){const inst=ownedItem(uid);if(!inst)return;state.equipped[ITEMS[inst.id].slot]=inst.uid;state.hp=Math.min(maxHP(),state.hp);save();render();heroKey='';updateHeroAsset(true);toast('Equipado: '+ITEMS[inst.id].name)}
function socket(uid,cardId){const i=ownedItem(uid),c=CARD_BY_ID[Number(cardId)];if(!i||!c||c.slot!==ITEMS[i.id].slot||i.cards.length>=ITEMS[i.id].sockets||(state.cards[c.id]||0)<1)return;i.cards.push(c.id);state.cards[c.id]--;save();render();toast('🃏 '+c.name+' encaixada')}
function downloadSave(){save();const blob=new Blob([JSON.stringify({kind:'torre-ragnarok-save',version:2,state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='torre-disciplina-ro-save-'+dateKey()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800)}
function restoreSave(file){const r=new FileReader();r.onload=()=>{try{const raw=JSON.parse(r.result),next=raw.state||raw;if(!next||!Array.isArray(next.inventory)||!next.stats)throw Error('formato não reconhecido');if(!confirm('Substituir o progresso atual pelo backup?'))return;localStorage.setItem(STORE,JSON.stringify(next));location.reload()}catch(e){toast('Não foi possível importar: '+e.message)}};r.readAsText(file)}
function action(e){const a=e.dataset.act,id=e.dataset.id,uid=Number(e.dataset.uid),n=Number(e.dataset.n);
 if(e.dataset.tab){tab=e.dataset.tab;render();scrollTo(0,0);return}if(e.dataset.sub){sub=e.dataset.sub;render();return}
 switch(a){
 case 'startgame':state.name=($('nameField')?.value||'').trim().slice(0,18);state.prologue=true;save();render();toast('🕯 A primeira vela foi acesa.');break;
 case 'cat':catFilter=id;render();break;
 case 'pick':{if(state.daily.locked)return;const s=state.daily.selected,i=s.indexOf(id);if(i>=0)s.splice(i,1);else if(s.length<5)s.push(id);else return toast('Máximo de 5 missões.');save();render();break}
 case 'lockdaily':if(state.daily.selected.length!==5)return toast('Escolha exatamente 5 missões.');state.daily.locked=true;save();render();toast('🔒 Missões de hoje confirmadas.');break;
 case 'complete':completeMission(id);break;
 case 'addcustom':{const t=($('cTitle')?.value||'').trim();if(t.length<3)return toast('Escreva um título.');state.customDaily.push({id:'c'+Date.now().toString(36),t:t.slice(0,60),cat:$('cCat').value,d:$('cDiff').value,custom:true});save();render();toast('Missão criada.');break}
 case 'delcustom':state.customDaily=state.customDaily.filter(m=>m.id!==id);state.daily.selected=state.daily.selected.filter(x=>x!==id);save();render();break;
 case 'cnt':{const el=$('cn-'+id),v=parseFloat(String(el?.value||'').replace(',','.'));if(!COUNTERS[id]||!(v>0)||v>100000)return toast('Digite uma quantidade válida.');const jx=addCounter(id,v);save();render();toast(`${COUNTERS[id].n}: +${fmtC(v)}`+(jx?` · +${fmtC(Math.round(jx*10)/10)} XP de Classe`:''));break}
 case 'wpick':if(state.weekly.picks.length>=3||state.weekly.picks.includes(id))return;state.weekly.picks.push(id);save();render();break;
 case 'weekly':claimWeekly(id);break;
 case 'fcat':if(!state.focus.start){state.focus.cat=id;save();render()}break;
 case 'startfocus':if(!state.focus.start){state.focus.start=Date.now();save();render();toast('⏳ Foco iniciado.')}break;
 case 'finishfocus':finishFocus();break;
 case 'travel':if(n>state.unlocked)return;state.region=n;state.map=0;stopHunt(false);toast('Você viajou para '+REGIONS[n].city);break;
 case 'map':state.map=n;if(state.location==='hunt'){enemy=null;spawnAt=performance.now()+400}save();render();break;
 case 'hunt':startHunt();break;case 'boss':startBoss();break;
 case 'buy':buy(id);break;case 'equip':equip(uid);break;
 case 'unequip':{const inst=ownedItem(uid);if(inst&&state.equipped[ITEMS[inst.id].slot]===uid){state.equipped[ITEMS[inst.id].slot]=null;save();render();heroKey='';updateHeroAsset(true)}break}
 case 'forgeitem':selectedItem=uid;sub='forja';tab='heroi';render();break;
 case 'socket':socket(uid,Number(e.dataset.card));break;
 case 'unsocket':{const inst=ownedItem(uid);if(!inst||inst.cards[n]==null||state.zeny<100)return;const cd=inst.cards.splice(n,1)[0];state.cards[cd]=(state.cards[cd]||0)+1;state.zeny-=100;save();render();toast('Carta devolvida ao álbum.');break}
 case 'openforge':tab='heroi';sub='forja';render();break;
 case 'csub':csub=id;render();break;
 case 'path':if(state.path)return toast('Você já escolheu um caminho.');if(!JOBS[id]||id==='novice')return;if(!confirm('Seguir o caminho de '+JOBS[id].name+'? Não dá para trocar depois.'))return;state.path=id;save();render();toast('Caminho escolhido: '+JOBS[id].name);break;
 case 'promote':if(!state.path||state.promoted||!promoReady())return;state.promoted=true;state.skillPoints++;save();render();heroKey='';updateHeroAsset(true);toast('🎉 Promoção a '+JOBS[state.path].name+'! +1 ponto de habilidade');break;
 case 'second':if(!state.promoted||state.second||!promoReady()||!JOBS[state.path]?.branches.includes(id))return;state.second=id;state.skillPoints++;save();render();heroKey='';updateHeroAsset(true);toast('🎉 Evolução: '+SECOND[id].name);break;
 case 'learn':{const sk=availableSkills().find(s=>s.id===id);if(!sk||state.skillPoints<1||(state.skills[id]||0)>=sk.max||(sk.req&&(state.skills[sk.req]||0)<2))return;state.skills[id]=(state.skills[id]||0)+1;state.skillPoints--;save();render();toast('✨ '+sk.name+' Nv '+state.skills[id]);break}
 case 'toggleSkill':{if(!availableSkills().some(s=>s.id===id)||(state.skills[id]||0)<1)return;const i=state.equippedSkills.indexOf(id);if(i>=0)state.equippedSkills.splice(i,1);else if(state.equippedSkills.length<4)state.equippedSkills.push(id);else return toast('A barra aceita 4 habilidades.');save();render();break}
 case 'previewjob':ui.pjob=n;ui.dir=0;ui.ppose='idle';tab='heroi';sub='aparencia';render();scrollTo(0,0);toast('Prévia da classe. Seu progresso não mudou.');break;
 case 'pjobreset':ui.pjob=null;render();break;
 case 'rot':rotate(n);break;
 case 'spin':if(ui.spin){stopSpin()}else{ui.spin=true;ui.spinTimer=setInterval(()=>rotate(-1),420)}render();break;
 case 'ppose':ui.ppose=id;portraitUpdate();document.querySelectorAll('[data-act="ppose"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));break;
 case 'assetbase':{const input=$('assetBaseField')?.value.trim()||ASSET_DEFAULT;try{const u=new URL(input);if(u.protocol!=='https:'&&u.hostname!=='localhost')throw 0;state.settings.assetBase=u.origin;stillCache.clear();save();render();heroKey=mobKey='';updateStageAssets();toast('Servidor atualizado.')}catch{toast('Informe uma URL HTTPS válida.')}break}
 case 'backup':downloadSave();break;
 case 'stage':{const S=stageOf();if(n>S.max&&!cleared(state.region))return;S.cur=n;state.stageKills=0;enemy=null;spawnAt=performance.now()+300;if(state.location!=='hunt')startHunt(state.region);else{save();render()}break}
 case 'sell':{const inst=ownedItem(uid);if(!inst||Object.values(state.equipped).includes(uid))return;const v=sellPrice(inst);if(!confirm('Vender '+itemName(inst)+' por '+v+' zeny?'))return;sellInst(inst);save();render();toast('💰 Vendido por '+v+' zeny');break}
 case 'sellall':{const free=state.inventory.filter(i=>!Object.values(state.equipped).includes(i.uid));const v=free.reduce((a,i)=>a+sellPrice(i),0);if(!free.length||!confirm('Vender '+free.length+' itens por '+v+' zeny?'))return;free.forEach(sellInst);save();render();toast('💰 '+free.length+' itens vendidos por '+v+' zeny');break}
 case 'refine':{const inst=ownedItem(uid);if(!inst)return;const r=inst.refine||0,cost=refineCost(r);if(r>=10||state.zeny<cost)return;state.zeny-=cost;if(Math.random()*100<REFINE_CH[r]){inst.refine=r+1;toast('⚒ Sucesso! '+itemName(inst))}else{if(r>=5)inst.refine=r-1;toast('💥 O refino falhou'+(r>=5?' e voltou para +'+inst.refine:'')+'.')}save();render();heroKey='';break}
 case 'resetclass':{if(!state.path||state.zeny<CFG.resetCost)return;if(!confirm('Resetar a classe por '+CFG.resetCost+' zeny? Você volta a Aprendiz e recebe os pontos de habilidade de volta.'))return;state.zeny-=CFG.resetCost;let pts=0;for(const [id,L] of Object.entries(state.skills))pts+=id==='firstaid'?Math.max(0,L-1):L;pts-=(state.promoted?1:0)+(state.second?1:0);state.skills={firstaid:Math.max(1,state.skills.firstaid||1)>=1?1:1};state.skillPoints=Math.max(0,state.skillPoints+pts+((state.skills.firstaid||1)-1));state.path=null;state.promoted=false;state.second=null;state.equippedSkills=['firstaid'];save();heroKey='';render();updateHeroAsset(true);toast('🔄 Classe resetada. Escolha um novo caminho.');break}
 case 'shopcat':shopCat=id;render();break;
 case 'buycos':{const c=COS[n];if(!c||state.costumes.includes(n)||state.zeny<c.cost)return;state.zeny-=c.cost;state.costumes.push(n);save();render();toast('🎩 Visual comprado: '+c.n+'. Use em Herói › Visual.');break}
 case 'wearcos':{const L=state.look,i=L.costume.indexOf(n);if(i>=0)L.costume.splice(i,1);else{if(L.costume.length>=3)L.costume.shift();L.costume.push(n)}save();heroKey='';render();updateHeroAsset(true);break}
 case 'hairc':state.look.hairColor=n;save();heroKey='';render();updateHeroAsset(true);break;
 case 'bodyc':state.look.bodyColor=n;save();heroKey='';render();updateHeroAsset(true);break;
 case 'skin':state.look.skinTone=n;state.look.skinColor='';save();heroKey='';render();updateHeroAsset(true);break;
 case 'glogin':case 'elogin':case 'esignup':case 'ereset':authAction(a);break;
 case 'logout':logout();break;
 case 'msave':masterSave(false);break;case 'mdefault':masterSave(true);break;
 case 'mtool':masterTool(id);break}}
function sellInst(inst){for(const cd of inst.cards||[])state.cards[cd]=(state.cards[cd]||0)+1;state.zeny+=sellPrice(inst);state.inventory=state.inventory.filter(i=>i!==inst);if(selectedItem===inst.uid)selectedItem=null}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-tab],[data-sub]');if(b&&!b.disabled)action(b)});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.look){if(el.dataset.look==='head')state.look.head=clamp(Number(el.value)||3,1,20);else state.look.gender=el.value==='female'?'female':'male';save();heroKey='';render();updateHeroAsset(true);return}
 if(el.id==='skinPick'){state.look.skinColor=el.value;save();heroKey='';render();updateHeroAsset(true);return}
 if(el.dataset.moff){const L=new Set(CFG.offMissions||[]);el.checked?L.delete(el.dataset.moff):L.add(el.dataset.moff);CFG.offMissions=[...L];return}
 if(el.id==='nameEdit'){state.name=el.value.trim().slice(0,18);save();updateHud();updateHeroAsset(true);return}
 if(el.dataset.setting){state.settings[el.dataset.setting]=el.checked;save();heroKey=mobKey='';render();updateStageAssets();return}
 if(el.id==='restoreInput'&&el.files?.length)restoreSave(el.files[0])});
/* ===================== NUVEM E CONTA MESTRE (Firebase do site) ===================== */
const FBC=window.TORRE_FIREBASE,FBCFG=FBC&&FBC.apiKey&&!/COLE/i.test(FBC.apiKey)?FBC:null;
const net={user:null,master:false,status:'local',fb:null,saveRef:null,cfgRef:null,timer:null};
function setSync(st){net.status=st;const d=$('tSync');if(d){d.className='sync'+(st==='online'?' on':st==='err'?' err':'');d.title={local:'Salvo neste aparelho',online:'Sincronizado na nuvem',err:'Erro ao sincronizar'}[st]||''}}
function scheduleRemote(){if(!net.saveRef)return;clearTimeout(net.timer);net.timer=setTimeout(pushRemote,2500)}
async function pushRemote(){if(!net.saveRef)return;try{await net.fb.FS.setDoc(net.saveRef,{ro:JSON.parse(JSON.stringify(state)),roUpdatedAt:state.updatedAt||Date.now()},{merge:true});setSync('online')}catch(e){setSync('err')}}
function setMaster(v){net.master=!!v;$('tabMaster').hidden=!net.master;$('tabs').classList.toggle('seven',net.master);if(!net.master&&tab==='mestre')tab='config';render()}
function applyCfg(d){CFG={...CFG_DEF,...(d||{})};try{localStorage.setItem('torre-ro-cfg',JSON.stringify(CFG))}catch{}render()}
const AUTHERR={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'Não existe conta com esse e-mail.','auth/email-already-in-use':'Esse e-mail já tem conta. Toque em Entrar.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/invalid-email':'Esse e-mail não parece válido.','auth/popup-closed-by-user':'Login cancelado.','auth/unauthorized-domain':'Este site não está autorizado no Firebase (Authentication › Domínios autorizados).','auth/network-request-failed':'Sem conexão com a internet.'};
const authErr=e=>{const m=AUTHERR[e&&e.code]||'Não foi possível entrar. Tente de novo.';const el=$('lErr');if(el)el.textContent=m;else toast(m)};
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function connectFirebase(){if(!FBCFG)return;const base='https://www.gstatic.com/firebasejs/10.12.2/';let A,AU,FS;
 try{[A,AU,FS]=await Promise.all(['firebase-app.js','firebase-auth.js','firebase-firestore.js'].map(f=>import(base+f)))}catch(e){setSync('err');return}
 const app=A.initializeApp(FBCFG),auth=AU.getAuth(app),db=FS.getFirestore(app);net.fb={AU,FS,auth,db};
 net.cfgRef=FS.doc(db,'game','roConfig');FS.onSnapshot(net.cfgRef,d=>applyCfg(d.exists()?d.data():null),()=>{});
 AU.getRedirectResult(auth).catch(authErr);
 AU.onAuthStateChanged(auth,async user=>{net.user=user||null;if(!user){net.saveRef=null;setSync('local');setMaster(false);return}
  try{const h=user.email&&user.emailVerified?await sha256(user.email.trim().toLowerCase()):'';setMaster(!!(FBCFG.masterHash&&h===String(FBCFG.masterHash).toLowerCase()))}catch{}
  net.saveRef=FS.doc(db,'saves',user.uid);
  try{const d=await FS.getDoc(net.saveRef);const r=d.exists()?d.data():null;if(r&&r.ro&&(r.roUpdatedAt||0)>(state.updatedAt||0)){state=r.ro;normalize();try{localStorage.setItem(STORE,JSON.stringify(state))}catch{}toast('☁ Save da nuvem carregado.');heroKey=mobKey=''}await pushRemote()}catch(e){setSync('err')}
  render();updateStageAssets()})}
async function authAction(a){if(!net.fb)return toast('Login indisponível agora.');const {AU,auth}=net.fb,em=($('eMail')?.value||'').trim(),pw=$('ePass')?.value||'';
 try{if(a==='glogin'){const pr=new AU.GoogleAuthProvider();try{await AU.signInWithPopup(auth,pr)}catch(e){if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))AU.signInWithRedirect(auth,pr);else throw e}}
  else if(a==='elogin')await AU.signInWithEmailAndPassword(auth,em,pw);else if(a==='esignup'){if(!em||pw.length<6)return authErr({code:'auth/weak-password'});await AU.createUserWithEmailAndPassword(auth,em,pw)}
  else if(a==='ereset'){if(!em)return toast('Digite seu e-mail primeiro.');await AU.sendPasswordResetEmail(auth,em);toast('Enviamos o link para o seu e-mail.')}}catch(e){authErr(e)}}
async function logout(){if(!net.fb)return;await pushRemote();try{await net.fb.AU.signOut(net.fb.auth)}catch{}net.user=null;render()}
async function masterSave(def){if(!net.master||!net.cfgRef)return;let o={...CFG_DEF};if(!def){for(const k of Object.keys(CFG_DEF)){const el=$('m_'+k);if(!el)continue;o[k]=k==='motd'?el.value.trim().slice(0,140):Math.max(0,Number(el.value)||CFG_DEF[k])}o.offMissions=CFG.offMissions||[]}
 try{await net.fb.FS.setDoc(net.cfgRef,o);toast('👑 Ajustes salvos para todos.')}catch(e){toast('Sem permissão para salvar (confira as regras do Firestore).')}}
function masterTool(id){if(!net.master)return;const S=stageOf();if(id==='zeny')state.zeny+=5000;else if(id==='lvl'){state.xp=xpNeed();gainXP(0)}else if(id==='job')gainJobXP(jobNeed()-state.jobXP+.01);else if(id==='stage'){if(S.cur<SPC()){S.cur++;S.max=Math.max(S.max,S.cur)}state.stageKills=0}else if(id==='city'){if(!cleared(state.region)){state.bosses.push(state.region);S.cur=S.max=SPC();recalcUnlock()}}else if(id==='card'){const c=Object.values(MONSTER_CARDS)[Math.floor(Math.random()*38)];state.cards[c.id]=(state.cards[c.id]||0)+1;state.seenCards[c.id]=1}save();render();toast('Feito.')}
$('btnCity').addEventListener('click',()=>stopHunt(true));$('btnHunt').addEventListener('click',()=>startHunt());
window.addEventListener('resize',()=>{resizeStage();heroKey=mobKey='';updateStageAssets()});
window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
function offlineReward(){const el=clamp((Date.now()-(Number(state.lastSeen)||Date.now()))/1000,0,8*3600);if(state.location==='hunt'&&el>120){const loot=Math.floor(el/70)*(2+state.region*2);if(loot>0){state.zeny+=loot;setTimeout(()=>toast('🌙 Caçada offline: +'+loot+' zeny em '+Math.floor(el/60)+' min.'),600)}}state.lastSeen=Date.now()}
offlineReward();state.hp=clamp(Number(state.hp)||maxHP(),1,maxHP());state.sp=clamp(Number(state.sp)||maxSP(),0,maxSP());
function animationLoop(time){const dt=clamp((time-frameTime)/1000,0,.07);frameTime=time;dailyRollover();const visible=!$('stageWrap').hidden;
 if(state.location==='hunt'){if(heroPoseNow()==='walk')scenePhase+=dt;battleTick(time,dt)}else scenePhase+=0;
 if(time-lastHUD>200){lastHUD=time;updateHud();if(visible){updateStageAssets();$('monsterSprite').style.left=px(enemyX)+'%'}const f=$('focusClock');if(f){const sec=state.focus.start?Math.max(0,Math.floor((Date.now()-state.focus.start)/1000)):0;f.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}}
 if(visible){$('monsterSprite').style.left=px(enemyX)+'%';sceneDraw(time)}requestAnimationFrame(animationLoop)}
if(!state.prologue&&state.stats.totalMissions>0)state.prologue=true;
if(state.location==='hunt'){spawnAt=performance.now()+500}
if(net.master)setMaster(true);render();resizeStage();updateStageAssets();requestAnimationFrame(animationLoop);setInterval(save,25000);connectFirebase();
</script></body></html>
