<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#201c2f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Torre da Disciplina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-title" content="Torre">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: app de celular — barra de status do herói no topo, conteúdo rolável, abas fixas embaixo. Tema único noturno de masmorra. */
:root{
  --bg:#14121d; --panel:#201c2f; --panel2:#2a2540; --line:#3a3354;
  --ink:#f1ead9; --mute:#a7a0bb;
  --gold:#f2c14e; --xp:#6ec6ff; --hp:#e8585a; --ok:#5fcf8a;
  --str:#ff8a5c; --int:#6ec6ff; --dis:#f2c14e; --cre:#c58cff;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:20px}
h3{font-size:17px}
p{margin:0}
.mute{color:var(--mute)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.lv{font-family:var(--display);font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;white-space:nowrap}
.lv b{color:var(--xp);font-size:17px}
.top-mid{min-width:0;display:flex;flex-direction:column;gap:3px}
.top-name{font-family:var(--display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.sync{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none}
.sync.on{background:var(--ok)}.sync.err{background:var(--hp)}
.coins{display:flex;gap:10px;align-items:center;font-family:var(--display);font-size:15px}
.coin{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #b8862a}
.fire{width:9px;height:12px;background:var(--str);clip-path:polygon(50% 0,100% 60%,80% 100%,20% 100%,0 60%)}
.bar{height:8px;background:#0f0d16;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--xp);transition:width .4s}
.bar.hp i{background:var(--hp)}
.bar.gold i{background:var(--gold)}

main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);font-weight:600}
.note{background:#0f0d16;border:1px dashed var(--line);border-radius:8px;padding:10px;font-size:13px;color:var(--mute)}
.note b{color:var(--ink)}

.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px 14px;font-weight:600}
.btn:hover{border-color:var(--mute)}
.btn.main{background:var(--gold);color:#241a05;border-color:#b8862a;box-shadow:0 3px 0 #9b6f1c;font-family:var(--display);font-size:16px}
.btn.main:active{transform:translateY(2px);box-shadow:0 1px 0 #9b6f1c}
.btn.red{background:var(--hp);color:#fff;border-color:#a83a3c;box-shadow:0 3px 0 #85292b;font-family:var(--display);font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:6px 10px;font-size:13px}
.x{background:none;border:0;color:var(--mute);font-size:18px;padding:4px 6px;line-height:1}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c,var(--mute))}
.c-str{--c:var(--str)}.c-int{--c:var(--int)}.c-dis{--c:var(--dis)}.c-cre{--c:var(--cre)}
.chip.bad{border-color:var(--hp);color:#ffb3b4}
.chip.good{border-color:var(--ok)}

.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.task.done{opacity:.6}
.task.done .tt{text-decoration:line-through}
.check{width:40px;height:40px;border-radius:8px;border:2px solid var(--c,var(--line));background:#0f0d16;display:grid;place-items:center}
.check svg{width:22px;height:22px;stroke:var(--c);stroke-width:3;fill:none;opacity:0}
.task.done .check{background:var(--c)}
.task.done .check svg{opacity:1;stroke:#14121d}
.tbody{min-width:0;display:flex;flex-direction:column;gap:4px}
.tt{font-weight:500;overflow-wrap:anywhere}
.tmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mute)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum{background:var(--panel2);border-radius:8px;padding:8px 10px}
.sum b{display:block;font-family:var(--display);font-size:20px}
.focus-time{font-family:var(--display);font-size:44px;text-align:center;line-height:1;padding:6px 0}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 4px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.cat i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.cat[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--panel2))}
details summary{cursor:pointer;font-weight:600;color:var(--gold);list-style:none}
details summary::-webkit-details-marker{display:none}
form.add{display:grid;gap:8px;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 120px;min-width:0}
input,select{background:#0f0d16;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.goal{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.goal.won{border-color:var(--gold)}
.goal-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.goal-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.goal-act input{width:70px;padding:6px 8px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{background:none;border:0;border-radius:7px;padding:8px 4px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--gold)}
.hero{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.stage{background:radial-gradient(circle at 50% 80%,#3a3354 0,#1a1726 70%);border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;aspect-ratio:1;max-width:100%}
canvas{image-rendering:pixelated;display:block;max-width:100%}
.clsname{font-family:var(--display);color:var(--gold);font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel2);border-radius:8px;padding:10px;border-left:3px solid var(--c)}
.stat b{font-family:var(--display);font-size:22px;display:block}
.stat small{color:var(--mute);font-size:12px}
.combat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.combat div{background:#0f0d16;border-radius:8px;padding:8px 2px}
.combat b{font-family:var(--display);font-size:18px;display:block}
.combat small{font-size:11px;color:var(--mute)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.item>div{min-width:0;display:flex;flex-direction:column;gap:3px}
.item.on{border-color:var(--gold)}
.item.locked{opacity:.75}
.item-n{font-weight:600}
.item-s{font-size:12px;color:var(--mute)}
.slot-tag{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--gold)}
.reqs{display:flex;gap:4px;flex-wrap:wrap}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button{flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--mute)}
.filters button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

.pts{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pts b{font-family:var(--display);font-size:28px;color:var(--gold)}
.cls{border-top:3px solid var(--c)}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#0f0d16;border:1px solid var(--line);color:var(--mute)}
.pill.on{border-color:var(--ok);color:var(--ok)}
.tree{list-style:none;margin:0;padding:0 0 0 14px;display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--line)}
.node{position:relative;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.node::before{content:"";position:absolute;left:-21px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:3px;background:var(--bg);border:2px solid var(--line)}
.node.own{border-color:var(--c)}
.node.own::before{background:var(--c);border-color:var(--c)}
.node.off{opacity:.55}
.node>div{min-width:0;display:flex;flex-direction:column;gap:2px}
.node b{font-weight:600}
.node small{color:var(--mute);font-size:12px}

.tower{display:flex;flex-direction:column;gap:4px}
.floor{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;background:#0f0d16;border:1px solid var(--line);font-family:var(--display);font-size:14px}
.floor.cur{background:color-mix(in srgb,var(--hp) 20%,var(--panel2));border-color:var(--hp)}
.floor.clr{color:var(--mute)}
.floor.boss span:first-child::after{content:" · chefe";color:var(--hp)}
.floor .who{font-family:var(--body);font-size:11px;color:var(--gold);text-align:right}
.mob{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}

.rank{display:flex;flex-direction:column;gap:6px}
.rk{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:8px;padding:8px 10px}
.rk.me{border:1px solid var(--gold)}
.rk .pos{font-family:var(--display);font-size:18px;color:var(--mute)}
.rk:first-child .pos{color:var(--gold)}
.rk .tbody span{font-size:12px}
.fl{font-family:var(--display);white-space:nowrap}
.duel{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:8px;padding:8px 10px}
.duel canvas{width:44px;height:auto}
.steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);padding:4px 0;border-radius:8px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--gold);background:var(--panel2)}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,6,14,.82);display:grid;place-items:center;padding:16px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.fighter{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.fighter .nm{font-family:var(--display);font-size:13px;overflow-wrap:anywhere}
.fighter .bar{width:100%}
.fighter small{font-size:12px}
.vs{font-family:var(--display);color:var(--hp);font-size:20px}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.blog{background:#0f0d16;border-radius:8px;padding:10px;height:140px;overflow:auto;font-size:13px;display:flex;flex-direction:column-reverse;gap:2px}
.result{font-family:var(--display);font-size:22px;text-align:center}
.result.win{color:var(--ok)}.result.lose{color:var(--hp)}
.rewards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--panel2);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.lvl{background:var(--gold);color:#241a05;font-family:var(--display);font-size:17px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);background:var(--sw);padding:0}
.sw button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--bg) inset}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.styles button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--mute)}
.styles button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.mis{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.mis.on{border-color:var(--c)}
.mis>div{min-width:0;display:flex;flex-direction:column;gap:4px}
.wk{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.wk.ready{border-color:var(--gold)}
.wk.claimed{opacity:.6}
.cp{display:flex;gap:8px;flex-wrap:wrap}
.cp .chip{font-size:12px}
.btns{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.four button{font-size:13px;padding:8px 2px}
.ctiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ctile{border:1px solid var(--line);border-top:3px solid var(--c);background:var(--panel2);border-radius:8px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.ctile b{font-family:var(--display);font-size:14px}
.ctile small{font-size:11px;color:var(--mute)}
.ctile.on small.st{color:var(--ok)}
.ctile[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 22%,var(--panel2));border-color:var(--c)}
.tiers{display:flex;flex-direction:column;gap:0}
.tier{display:flex;flex-direction:column;gap:6px}
.tier-h{display:flex;justify-content:space-between;align-items:center}
.tier-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.link{width:2px;height:16px;margin:4px auto;background:var(--line)}
.link.on{background:var(--c)}
.snode{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.snode b{font-weight:600;font-size:14px}
.snode small{color:var(--mute);font-size:12px;flex:1}
.snode.own{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel2))}
.snode.lock{opacity:.5}
.item{border-left:3px solid var(--rc,var(--line))}
.item-n{color:var(--rc,var(--ink))}
.r-c{--rc:#b9b2c9}.r-r{--rc:#6ec6ff}.r-e{--rc:#c58cff}.r-l{--rc:#f2c14e}
.rar{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--rc)}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.delta{font-size:12px;font-weight:600}
.delta.up{color:var(--ok)}.delta.down{color:var(--hp)}
.or{text-align:center;color:var(--mute);font-size:13px}
.linkbtn{background:none;border:0;color:var(--gold);font-weight:600;padding:4px;text-decoration:underline}
.err{color:#ffb3b4;font-size:13px;min-height:1em;text-align:center}
.ico{width:28px;height:28px;image-rendering:pixelated;object-fit:contain;background:#0f0d16;border-radius:6px;border:1px solid var(--line);flex:none}
.ico.big{width:56px;height:56px}
.iline{display:flex;gap:10px;align-items:center;min-width:0}
.iline>div{min-width:0;display:flex;flex-direction:column;gap:3px;flex:1}
.item>.iline,.mrow>.iline{flex-direction:row;align-items:center}
.mbtn{border:1px solid var(--gold);background:none;color:var(--gold);border-radius:6px;padding:3px 8px;font-family:var(--display);font-size:13px}
.evb{background:color-mix(in srgb,var(--ec) 22%,var(--panel));border:1px solid var(--ec);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.evb h2{color:var(--ink)}
.seg.five{grid-template-columns:repeat(5,1fr)}
.seg.five button{font-size:12px;padding:8px 2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fl2{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:12px;color:var(--mute);font-weight:600}
.fl2.full{grid-column:1/-1}
.fl2 input,.fl2 select{font-size:15px;color:var(--ink);font-weight:400}
.fl2 input[type=color]{height:42px;padding:4px}
.ck{display:flex;gap:8px;align-items:center;font-size:14px;grid-column:1/-1}
.ck input{width:auto}
.imgrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.imgrow input{flex:1 1 160px;font-size:13px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.mrow .acts{flex-direction:row;flex-wrap:wrap;justify-content:flex-end}
.pill.warn{border-color:var(--gold);color:var(--gold)}
.tabs.six{grid-template-columns:repeat(6,1fr)}
.ico{width:32px;height:32px;image-rendering:pixelated;object-fit:contain;flex:none;background:#0f0d16;border-radius:6px}
.ico.lg{width:64px;height:64px}
.iname{display:flex;gap:8px;align-items:center;min-width:0}
.evt{border:1px solid var(--ec,var(--gold));background:color-mix(in srgb,var(--ec,var(--gold)) 16%,var(--panel));border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.evt h3{color:var(--ec,var(--gold))}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--mute)}
.fld input[type=color]{height:42px;padding:4px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{width:20px;height:20px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.mrow>div{min-width:0;display:flex;flex-direction:column;gap:3px}
.mrow.off{opacity:.55}
.tagx{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tagx.ev{border-color:#ff8a2a;color:#ffb073}
.tagx.cu{border-color:var(--cre);color:var(--cre)}
.tagx.ofx{border-color:var(--hp);color:#ffb3b4}
.drop{border:2px dashed var(--line);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center}
/* números sempre na fonte de leitura: os dígitos da fonte pixelada se confundem em tamanho pequeno */
.lv b,.coins,.sum b,.focus-time,.stat b,.combat b,.pts b,.rk .pos,.fl{font-family:var(--body);font-weight:700;letter-spacing:0}
.lv{display:flex;align-items:baseline;gap:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.hero,.mob{grid-template-columns:1fr}.stage{max-width:160px;margin:0 auto;width:100%}}

function rollDrop(f){

  const w=pool.map(i=>({i,w:i.r==='l'?1:i.r==='e'?3:6})),tot=w.reduce((a,x)=>a+x.w,0);let r=Math.random()*tot;
  for(const x of w){r-=x.w;if(r<=0)return x.i.id}return pool[0].id;
}

function drawHero(cv,L,scale,flip){
  const W=14,H=15;cv.width=W*scale;cv.height=H*scale;const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);
  const px=(i,j,c)=>{if(i<0||i>=W||j<0||j>=H||!c)return;x.fillStyle=c;x.fillRect((flip?W-1-i:i)*scale,j*scale,scale,scale)};

  [...st.rows,...BODY].forEach((row,j)=>[...row].forEach((ch,i)=>{if(pal[ch])px(i+1,j+3,pal[ch])}));
  if(!L.hat||L.hat==='leaf')st.x.forEach(([i,j])=>px(i+1,j+3,L.hair));
  const hat=L.hat;
  if(hat==='wizard'){const p='#6a4bc9';px(8,0,p);[7,8].forEach(i=>px(i,1,p));[6,7,8].forEach(i=>px(i,2,p));for(let i=3;i<=10;i++)px(i,3,'#3f2a8a');[6,7].forEach(i=>px(i,2,'#f2c14e'))}
  if(hat==='hood'||hat==='hunter'){const p=hat==='hood'?'#7a5a3a':'#3f7a3a';for(let i=5;i<=8;i++)px(i,2,p);for(let i=4;i<=9;i++)px(i,3,p);[4,9].forEach(i=>{px(i,4,p);px(i,5,p)})}
  if(hat==='helm'){const p='#9aa4b5';for(let i=5;i<=8;i++)px(i,2,p);for(let i=4;i<=9;i++)px(i,3,p);[4,9].forEach(i=>{px(i,4,p);px(i,5,p)});px(6,1,'#d8584f');px(7,1,'#d8584f')}
  if(hat==='leaf'){[5,7,9].forEach(i=>px(i,2,'#5fcf8a'));for(let i=4;i<=9;i++)px(i,3,'#3f9a50')}
  const w=L.wep;
  if(w==='sword'){for(let j=3;j<=9;j++)px(12,j,'#d8e0ea');[11,12,13].forEach(i=>px(i,10,'#c8a24a'));px(12,11,'#6b4a24')}
  if(w==='dagger'){for(let j=7;j<=9;j++)px(12,j,'#b8bcc4');[11,12,13].forEach(i=>px(i,10,'#8a5a2b'));px(12,11,'#6b4a24')}
  if(w==='axe'){for(let j=4;j<=12;j++)px(12,j,'#6b4a24');[4,5,6,7].forEach(j=>px(13,j,'#c9d1db'));[5,6].forEach(j=>px(11,j,'#c9d1db'))}
  if(w==='staff'){for(let j=3;j<=14;j++)px(12,j,'#7a4f2a');px(12,1,'#6ec6ff');[11,12,13].forEach(i=>px(i,2,'#6ec6ff'))}
  if(w==='bow'){px(12,5,'#8a5a2b');px(12,12,'#8a5a2b');for(let j=6;j<=11;j++){px(13,j,'#8a5a2b');px(11,j,'#d8e0ea')}}
  if(L.shield){for(let j=8;j<=11;j++){px(0,j,L.shield);px(1,j,L.shield)}px(0,12,L.shield)}
}
function draw(cv,grid,pal,scale){
  const w=grid[0].length,h=grid.length;cv.width=w*scale;cv.height=h*scale;
  const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);
  grid.forEach((row,j)=>[...row].forEach((ch,i)=>{const c=pal[ch];if(!c)return;x.fillStyle=c;x.fillRect(i*scale,j*scale,scale,scale)}));
}
const imgCache=new Map();
function drawPng(cv,url,box){
  const paint=img=>{const k=Math.max(1,Math.floor(box/Math.max(img.width,img.height)));cv.width=img.width*k;cv.height=img.height*k;const x=cv.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(img,0,0,cv.width,cv.height)};
  let img=imgCache.get(url);if(img&&img.complete){paint(img);return}
  if(!img){img=new Image();img.src=url;imgCache.set(url,img)}
  img.addEventListener('load',()=>paint(img),{once:true});
}

/* ---------- batalha ---------- */
function simulate(A,B){
  const P={A,B},H={A:A.hp,B:B.hp},blk={A:!!A.fx.block,B:!!B.fx.block},stun={A:false,B:false},pois={A:0,B:0},fr=[];
  const push=(t,who)=>fr.push({ah:Math.max(0,Math.round(H.A)),bh:Math.max(0,Math.round(H.B)),t,who});
  const dead=()=>H.A<=0||H.B<=0;
  push(`${A.name} enfrenta ${B.name}`);
  function strike(xk,yk,mult,label,noCounter,spell){
    const x=P[xk],y=P[yk];
    if(!spell){
      if(y.fx.dodge&&Math.random()<Math.min(.5,y.fx.dodge)){push(`${y.name} se esquivou`);return}
      if(blk[yk]){blk[yk]=false;push(`Escudo de ${y.name} bloqueou o golpe`);return}
    }
    let m=mult;const xr=H[xk]/x.hp;
    if(x.fx.rage&&xr<0.3)m*=1+x.fx.rage;
    if(x.fx.wild&&xr<0.5)m*=1+x.fx.wild;
    if(x.fx.execute&&H[yk]/y.hp<0.25)m*=2;
    let def=spell?0:y.def*(x.fx.pierce?0.5:1);
    if(y.fx.wild&&H[yk]/y.hp<0.5)def*=1+y.fx.wild;
    let d=x.atk*m*(0.85+Math.random()*0.3)-def*0.5,tag='';
    if(Math.random()*100<x.crit){d*=x.fx.critMult||1.8;tag=' (crítico!)'}
    if(x.fx.triple&&Math.random()<x.fx.triple){d*=3;tag=' (golpe triplo!)'}
    d=Math.max(1,Math.round(d));H[yk]-=d;push(`${label||x.name+' causa'} ${d} de dano${tag}`,yk);
    if(x.fx.lifesteal&&H[xk]>0){const h=Math.round(d*x.fx.lifesteal);if(h>0){H[xk]=Math.min(x.hp,H[xk]+h)}}
    if(H[yk]>0&&y.fx.reflect){const r=Math.round(d*y.fx.reflect);if(r>0){H[xk]-=r;push(`${y.name} devolve ${r} de dano`,xk)}}
    if(dead())return;
    if(x.fx.poison&&!pois[yk]){pois[yk]=Math.max(1,Math.round(x.atk*x.fx.poison));push(`${y.name} está queimando (${pois[yk]} por turno)`)}
    if(x.fx.stun&&!stun[yk]&&Math.random()<x.fx.stun){stun[yk]=true;push(`${y.name} ficou atordoado`)}
    if(!noCounter&&y.fx.counter&&Math.random()<y.fx.counter)strike(yk,xk,0.7,`${y.name} contra-ataca:`,true);
  }
  function turn(xk,yk,n){
    const x=P[xk];
    if(pois[xk]){H[xk]-=pois[xk];push(`${x.name} sofre ${pois[xk]} de dano contínuo`,xk);if(dead())return}
    if(stun[xk]){stun[xk]=false;push(`${x.name} perde o turno`);return}
    if(n===0&&x.fx.opener){strike(xk,yk,x.fx.opener,`Golpe de abertura de ${x.name}:`,true,true);if(dead())return}
    if(x.fx.meteor&&n%4===3)strike(xk,yk,x.fx.meteor,`Meteoro de ${x.name}:`,true,true);else strike(xk,yk,1);
    if(dead())return;
    if(x.fx.double&&Math.random()<Math.min(.7,x.fx.double)){strike(xk,yk,1,`Ataque extra de ${x.name}:`);if(dead())return}
    if(x.fx.regen){const h=Math.round(x.hp*x.fx.regen),nh=Math.min(x.hp,H[xk]+h);if(nh>H[xk]){const g=Math.round(nh-H[xk]);H[xk]=nh;push(`${x.name} recupera ${g} de vida`)}}
  }
  for(let n=0;n<50&&!dead();n++){turn('A','B',n);if(dead())break;turn('B','A',n)}
  return{win:(H.B<=0&&H.A>0)||(H.A>0&&H.B>0&&H.A/A.hp>H.B/B.hp),fr};
}
const meFighter=()=>({name:s.name,...heroCombat(),fx:skillFx()});

function climb(max){
  const out=[];const lv0=s.level;
  for(let i=0;i<max;i++){
    const f=s.cleared+1,m=monster(f),A=meFighter(),B={name:m.name,...m.c,fx:m.fx},sim=simulate(A,B);
    const r={f,m,A,B,fr:sim.fr,win:sim.win};
    if(sim.win){
      const first=f>s.best,k=first?1:0.3;
      r.g=addGold((15+f*5)*k);r.x=gainXP((10+f*3)*k,true);
      if((m.boss&&first)||(m.elite&&Math.random()<0.2)){const d=rollDrop(f);if(d){s.owned.push(d);r.drop=d}}
      s.cleared=f;s.best=Math.max(s.best,f);bump('floors');
      if(m.boss){s.checkpoint=f;bump('boss');r.cp=true}
    }else if(m.boss){r.fell=s.checkpoint;s.cleared=s.checkpoint}
    out.push(r);
    if(!sim.win)break;
  }
  return{list:out,levels:s.level-lv0};
}
function climbSummary(c,start){
  const wins=c.list.filter(r=>r.win),last=c.list[c.list.length-1],g=wins.reduce((a,r)=>a+r.g,0),x=wins.reduce((a,r)=>a+r.x,0);
  let msg='';
  if(last){
    if(last.win)msg=`Subiu do andar ${start} até o ${last.f}.`;

function logLine(t,strong){const p=document.createElement('div');p.textContent=t;if(strong){p.style.color='var(--gold)';p.style.fontWeight='600'}$('blog').prepend(p)}

function tick(){

  if(!f){if(r.end)logLine(r.end,true);si++;fi=0;if(seq[si])startFight();else finish();return}
  paint(f);logLine(f.t);

}

function readPng(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\/png$/.test(file.type)){rej('Envie um arquivo PNG.');return}
    if(file.size>200000){rej('Imagem grande demais. Use um PNG pequeno, de até 64 por 64 pixels.');return}
    const fr=new FileReader();fr.onerror=()=>rej('Não consegui ler o arquivo.');
    fr.onload=()=>{const img=new Image();img.onerror=()=>rej('Arquivo de imagem inválido.');img.onload=()=>{
      const max=32,k=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*k)),h=Math.max(1,Math.round(img.height*k));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(img,0,0,w,h);
      const url=cv.toDataURL('image/png');okPng(url)?res(url):rej('A imagem ficou grande demais depois de ajustada.');};img.src=fr.result};
    fr.readAsDataURL(file);
  });
}

    <p class="mute full" style="font-size:12px">Efeitos com % aceitam o número em porcentagem: digite 10 para 10%. Multiplicadores usam o valor direto, como 2 para 2x. Efeitos de liga e desliga ignoram o valor.</p>
    ${chk('fs_off',!!x.off,'Desativar (some da árvore e para de funcionar)')}
  </div>${formFoot(!!x.custom&&!f.isNew,true,x.off,isB&&GCFG.skills[x.id])}</section>`;
}

function openForm(type,id,preset){
  let data,isNew=!id,png=null;
  if(type==='item'){data=id?deep(ITEM[id]):{id:newId('x'),custom:true,n:'',slot:'arma',r:'r',price:200,atk:5};png=GSPR.items[data.id]||null}
  if(type==='skill'){data=id?deep(SKILL[id]):{id:newId('s'),custom:true,cls:ui.mcls,tier:1,n:'',d:'',fx:{}}}
  if(type==='daily'){data=id?deep(DM[id]):{id:newId('d'),custom:true,t:'',cat:'exercicio',d:'medio'}}
  if(type==='weekly'){data=id?deep(WM[id]):{id:newId('w'),custom:true,t:'',key:'floors',target:10,st:'str'}}
  if(type==='event'){
    const y=new Date().getFullYear();
    data=id?deep(GCFG.events.find(e=>e.id===id)):preset==='halloween'?{id:newId('e'),n:'Halloween na Torre',from:`${y}-10-25`,until:`${y}-11-02`,xp:2,gold:1.5,idle:1,color:'#ff8a2a',msg:'Os mortos-vivos invadiram a torre! XP em dobro durante o evento.',mob:'Abóbora Assombrada'}
      :{id:newId('e'),n:'',from:today(),until:today(),xp:1.5,gold:1,idle:1,color:'#ff8a2a',msg:'',mob:''};
    png=GSPR.mobs[data.id]||null;
  }
  if(type==='gift'){data=id?deep(GCFG.gifts.find(g=>g.id===id)):{id:newId('g'),n:'',xp:200,gold:200,until:today()}}
  if(!data)return;
  ui.mform={type,data,isNew,png,pngChanged:false};ui.resetArm=false;render();scrollTo(0,0);
}
const cleanObj=o=>{Object.keys(o).forEach(k=>{if(o[k]===''||o[k]===undefined)delete o[k]});return o};
async function saveForm(){
  const f=ui.mform,t=f.type,d=f.data;
  if(t==='item'){
    const slot=V('fi_slot'),vis=V('fi_vis'),col=V('fi_color'),av=V('fi_av');
    const req={str:N('fi_str'),int:N('fi_int'),dis:N('fi_dis'),cre:N('fi_cre')};
    const it=cleanObj({id:d.id,custom:d.custom||undefined,n:V('fi_n')||'Item sem nome',slot,r:V('fi_r'),cls:V('fi_cls'),price:Math.max(0,Math.round(N('fi_price'))),
      atk:N('fi_atk'),def:N('fi_def'),hp:N('fi_hp'),crit:N('fi_crit'),goldPct:N('fi_gold'),lv:Math.round(N('fi_lv')),
      wep:slot==='arma'&&WEPS.includes(vis)?vis:null,hat:slot==='cabeca'&&HATS.includes(vis)?vis:null,color:slot==='corpo'?col:null,shield:slot==='secundaria'?col:null,
      event:av==='event'?V('fi_ev'):'',from:av==='dates'?V('fi_from'):'',until:av==='dates'?V('fi_until'):'',
      starter:C('fi_starter')?1:0,off:C('fi_off'),shop:C('fi_shop'),drop:C('fi_drop'),idleH:d.idleH});
    it.req=req;
    if(av==='event'&&!it.event){toast('Escolha o evento ou mude a disponibilidade.');return}
    GCFG.items[d.id]=it;
    if(f.pngChanged){if(f.png)GSPR.items[d.id]=f.png;else delete GSPR.items[d.id];if(!await publishSpr())return}
  }
  if(t==='skill'){
    const fx={};[['fs_k1','fs_v1'],['fs_k2','fs_v2']].forEach(([k,v])=>{const key=V(k);if(FXDEF[key]){const val=fromUi(key,N(v,FXDEF[key][1]==='flag'?1:0));if(val)fx[key]=val}});
    const x={n:V('fs_n')||'Habilidade',d:V('fs_d')||fxText(fx),fx};
    if(d.custom){x.custom=true;x.cls=d.cls;x.tier=f.isNew?Number(V('fs_tier'))||1:d.tier;x.id=d.id}
    if(C('fs_off'))x.off=true;
    GCFG.skills[d.id]=x;
  }
  if(t==='daily'){const m={t:V('fd_t')||'Missão',cat:V('fd_cat'),d:V('fd_d')};if(d.custom){m.custom=true;m.id=d.id}if(V('fd_ev'))m.event=V('fd_ev');if(C('fd_off'))m.off=true;GCFG.daily[d.id]=m}
  if(t==='weekly'){const m={t:V('fw_t')||'Missão semanal',key:V('fw_key'),target:Math.max(1,Math.round(N('fw_target',1))),st:V('fw_st')};if(d.custom){m.custom=true;m.id=d.id}if(V('fw_ev'))m.event=V('fw_ev');if(C('fw_off'))m.off=true;GCFG.weekly[d.id]=m}
  if(t==='event'){
    const e={id:d.id,n:V('fe_n')||'Evento',from:V('fe_from')||today(),until:V('fe_until')||today(),xp:clamp(N('fe_xp',1),1,10),gold:clamp(N('fe_gold',1),1,10),idle:clamp(N('fe_idle',1),1,10),color:V('fe_color'),msg:V('fe_msg'),mob:V('fe_mob')};
    if(e.until<e.from){toast('A data de fim precisa ser depois do início.');return}
    GCFG.events=(GCFG.events||[]).filter(x=>x.id!==d.id).concat(e);
    if(f.pngChanged){if(f.png)GSPR.mobs[d.id]=f.png;else delete GSPR.mobs[d.id];if(!await publishSpr())return}
  }
  if(t==='gift'){const g={id:d.id,n:V('fg_n')||'Presente',xp:Math.max(0,Math.round(N('fg_xp'))),gold:Math.max(0,Math.round(N('fg_gold'))),until:V('fg_until')||today()};
    GCFG.gifts=(GCFG.gifts||[]).filter(x=>x.id!==d.id).concat(g)}
  ui.mform=null;await publishCfg();render();
}
async function deleteForm(){
  const f=ui.mform,t=f.type,id=f.data.id;
  if(t==='item'){delete GCFG.items[id];if(GSPR.items[id]){delete GSPR.items[id];await publishSpr()}}
  if(t==='skill')delete GCFG.skills[id];
  if(t==='daily')delete GCFG.daily[id];
  if(t==='weekly')delete GCFG.weekly[id];
  if(t==='event'){GCFG.events=GCFG.events.filter(e=>e.id!==id);if(GSPR.mobs[id]){delete GSPR.mobs[id];await publishSpr()}}
  if(t==='gift')GCFG.gifts=GCFG.gifts.filter(g=>g.id!==id);
  ui.mform=null;ui.resetArm=false;await publishCfg('Excluído');render();
}
async function restoreForm(){
  const f=ui.mform,map={item:'items',skill:'skills',daily:'daily',weekly:'weekly'}[f.type];
  if(map)delete GCFG[map][f.data.id];
  ui.mform=null;await publishCfg('Voltou ao original');render();
}
async function masterClick(a,b){
  const k=b.dataset.k,id=b.dataset.id;
  if(a==='msub'){ui.msub=k;ui.resetArm=false;saveUi();render();return}
  if(a==='mcls'){ui.mcls=k;saveUi();render();return}
  if(a==='mmis'){ui.mmis=k;saveUi();render();return}
  if(a==='mfilter'){ui.mfilter=k;saveUi();render();return}
  if(a==='mnew'){openForm(k,null,b.dataset.preset);return}
  if(a==='medit'){openForm(k,id);return}
  if(a==='mcancel'){ui.mform=null;ui.resetArm=false;render();return}
  if(a==='msave'){await saveForm();return}
  if(a==='mdelarm'){ui.resetArm=true;render();return}
  if(a==='mdel'){await deleteForm();return}
  if(a==='mrestore'){await restoreForm();return}
  if(a==='mpngdel'){const keep=snapshotForm();ui.mform.png=null;ui.mform.pngChanged=true;render();restoreFormValues(keep);return}
  if(a==='msaveset'){GCFG.settings={tower:clamp(N('fset_tower',1),0.2,5),idle:clamp(N('fset_idle',1),0,10),maxDaily:clamp(Math.round(N('fset_md',6)),1,12),maxWeekly:clamp(Math.round(N('fset_mw',3)),1,6),sell:clamp(Math.round(N('fset_sell',40)),0,100),motd:V('fset_motd')};await publishCfg('Ajustes publicados');render();return}
  if(a==='mwipearm'){ui.resetArm=true;render();return}
  if(a==='mwipe'){GCFG=emptyCfg();GSPR={items:{},mobs:{}};ui.resetArm=false;await publishSpr();await publishCfg('Jogo restaurado ao padrão');render();return}
}
document.addEventListener('change',async e=>{
  if(e.target.id!=='fPng'||!ui.mform)return;
  const file=e.target.files&&e.target.files[0];
  try{
    const keep=snapshotForm();ui.mform.png=await readPng(file);ui.mform.pngChanged=true;render();restoreFormValues(keep);
  }catch(err){toast(typeof err==='string'?err:'Não consegui usar essa imagem.')}
});
/* mantém o que já foi digitado ao trocar a imagem */
function snapshotForm(){const o={};document.querySelectorAll('#view input,#view select').forEach(el=>{if(el.id&&el.type!=='file')o[el.id]=el.type==='checkbox'?el.checked:el.value});return o}
function restoreFormValues(o){Object.entries(o).forEach(([id,v])=>{const el=$(id);if(!el)return;if(el.type==='checkbox')el.checked=v;else el.value=v})}

/* ---------- eventos de interface ---------- */
function equipBest(){
  let changed=0;
  for(const sl of Object.keys(SLOTS)){
    const opts=[...new Set(s.owned)].map(id=>ITEM[id]).filter(i=>i&&i.slot===sl&&reqOk(i));
    if(!opts.length)continue;
    const best=opts.reduce((a,b)=>score(b)>score(a)?b:a);
    if(s.eq[sl]!==best.id&&score(best)>score(ITEM[s.eq[sl]])){s.eq[sl]=best.id;changed++}
  }
  return changed;
}
function sellOne(id){
  const i=ITEM[id],idx=s.owned.indexOf(id);if(!i||idx<0)return 0;
  if(s.eq[i.slot]===id&&count(id)===1)return 0;
  s.owned.splice(idx,1);const g=sellPrice(i);s.gold+=g;return g;
}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;ui.tab=b.dataset.tab;ui.resetArm=false;if(ui.tab!=='master')ui.mform=null;saveUi();render();scrollTo(0,0)});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;const a=b.dataset.act,id=b.dataset.id;rolls();
  if(a.startsWith('m')&&net.master&&ui.tab==='master'&&!['mcat','mtoggle'].includes(a)){masterClick(a,b);return}
  if(a==='go'){ui.tab=b.dataset.k;saveUi();render();scrollTo(0,0);return}
  if(a==='goshop'){ui.tab='heroi';ui.sub='loja';ui.shop=b.dataset.k;saveUi();render();scrollTo(0,0);return}
  if(a==='sub'){ui.sub=b.dataset.k;ui.resetArm=false;saveUi();render();return}
  if(a==='shop'){ui.shop=b.dataset.k;saveUi();render();return}
  if(a==='mcat'){ui.cat=b.dataset.k;saveUi();render();return}
  if(a==='cls'){ui.cls=b.dataset.k;saveUi();render();return}
  if(a==='resetarm'){ui.resetArm=true;render();return}
  if(a==='logout'){logout();return}
  if(a==='fcat'){s.focusCat=b.dataset.k;saveLocal();render();return}
  if(a==='fight'){towerRun(1);return}
  if(a==='auto'){towerRun(50);return}
  if(a==='pvp'){fightPvp(id);return}
  if(a==='done'){const m=DM[id];if(!m||!availNow(m)||!s.daily.includes(id)||s.doneDay.ids.includes(id)||s.doneDay.ids.length>=SET.maxDaily)return;
    s.doneDay.ids.push(id);touchStreak();bump('cat:'+m.cat);
    const act=s.daily.filter(x=>availNow(DM[x]));
    if(act.length>=3&&act.every(x=>s.doneDay.ids.includes(x))&&!s.week.perf.includes(today())){s.week.perf.push(today());setTimeout(()=>toast('Todas as diárias de hoje concluídas!',true),1200)}
    const d=DIFF[m.d];reward(d.xp,d.g,CATS[m.cat].st,d.p)}
  else if(a==='mtoggle'){if(s.daily.includes(id))s.daily=s.daily.filter(x=>x!==id);else if(s.daily.filter(x=>availNow(DM[x])).length<SET.maxDaily&&availNow(DM[id]))s.daily.push(id)}
  else if(a==='wpick'){if(s.week.picks.filter(x=>WM[x]).length<SET.maxWeekly&&availNow(WM[id])&&!s.week.picks.includes(id))s.week.picks.push(id)}
  else if(a==='wdrop'){if(!s.week.claimed.includes(id))s.week.picks=s.week.picks.filter(x=>x!==id)}
  else if(a==='claim'){const m=WM[id];if(!m||s.week.claimed.includes(id)||!s.week.picks.includes(id)||wprog(m)<m.target)return;s.week.claimed.push(id);reward(WREW.xp,WREW.g,m.st,WREW.p)}
  else if(a==='gift'){const g=(GCFG.gifts||[]).find(x=>x.id===id);if(!g||s.gifts.includes(id)||today()>g.until)return;s.gifts.push(id);const x=gainXP(g.xp||0),gg=Math.round(g.gold||0);s.gold+=gg;toast(`Presente coletado: +${fmt(x)} XP · +${fmt(gg)} ouro`)}
  else if(a==='look'){const k=b.dataset.k,v=b.dataset.v;if(k==='skin'&&SKINS.includes(v))s.look.skin=v;if(k==='hair'&&HAIRC.includes(v))s.look.hair=v;if(k==='style'&&STYLES[v])s.look.style=v}
  else if(a==='fstart'){s.focus={cat:s.focusCat,start:Date.now()}}
  else if(a==='fstop'){const f=s.focus;s.focus=null;const min=Math.min(240,Math.floor((Date.now()-f.start)/60000)),k=1+(skillFx().focusPct||0);
    if(min<1)toast('Sessão curta demais. Fique pelo menos 1 minuto focado.');else{touchStreak();bump('focus',min);reward(min*2*k,min*k,CATS[f.cat].st,Math.floor(min/10))}}
  else if(a==='buy'){const i=ITEM[id];if(!i||!availNow(i)||i.shop===false||count(id)||s.gold<i.price||!reqOk(i))return;s.gold-=i.price;s.owned.push(id);
    if(!s.eq[i.slot]){s.eq[i.slot]=id;toast(i.cls?`${i.n} equipado. Árvore de ${CLASSES[i.cls].n} liberada`:`${i.n} comprado e equipado`)}else toast(`${i.n} foi para a bolsa`)}
  else if(a==='equip'){const i=ITEM[id];if(!i||!count(id)||!reqOk(i))return;s.eq[i.slot]=id;toast(`${i.n} equipado`)}
  else if(a==='unequip'){if(SLOTS[b.dataset.k])s.eq[b.dataset.k]=null}
  else if(a==='best'){const n=equipBest();toast(n?`${n} ite${n>1?'ns trocados':'m trocado'} pelo melhor`:'Você já está com os melhores itens')}
  else if(a==='sell'){const g=sellOne(id);if(g)toast(`Vendido por ${fmt(g)} ouro`)}
  else if(a==='sellworse'){let g=0;[...new Set(s.owned)].forEach(id=>{const i=ITEM[id];if(!i)return;const e=ITEM[s.eq[i.slot]];if(s.eq[i.slot]!==id&&e&&score(i)<score(e))while(count(id)&&s.eq[i.slot]!==id){const v=sellOne(id);if(!v)break;g+=v}});if(g)toast(`Itens piores vendidos por ${fmt(g)} ouro`)}
  else if(a==='learn'){const sk=SKILL[id];if(!sk||sk.off||s.skills.includes(id)||!activeClasses().has(sk.cls)||!tierOpen(sk.cls,sk.tier)||points()<sk.cost)return;s.skills.push(id);toast('Habilidade aprendida: '+sk.n)}
  else if(a==='reset'){const cost=s.resets===0?0:100*s.level;if(s.gold<cost){toast(`Faltam ${fmt(cost-s.gold)} ouro para o reset`);ui.resetArm=false;render();return}
    s.gold-=cost;s.skills=[];s.resets++;ui.resetArm=false;toast(cost?`Pontos devolvidos por ${fmt(cost)} ouro`:'Reset grátis usado. Pontos devolvidos')}
  else return;
  save();render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='heroName'){s.name=t.value.trim().slice(0,20)||'Herói';save();header()}
});
setInterval(()=>{const el=$('fTime');if(el&&s.focus)el.textContent=fmtDur(Date.now()-s.focus.start)},1000);
setInterval(()=>{if(!document.hidden){s.lastSeen=Date.now();saveLocal()}},20000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){s.lastSeen=Date.now();save()}else{checkIdle();if(!ui.mform)render()}});
addEventListener('pagehide',()=>{s.lastSeen=Date.now();saveLocal()});

render();
if(s.treeNote){s.treeNote=false;saveLocal();setTimeout(()=>toast('As árvores de habilidade cresceram. Seus pontos foram devolvidos.',true),400)}
if(net.mode==='firebase')connectFirebase();
else{checkIdle();if(!(window.claude&&window.claude.use))setMaster(true);connectClaude()}
